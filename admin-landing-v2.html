<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing Page V2 — Club Pop</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Inter,system-ui;color:#111}main{max-width:1100px;margin:auto;padding:28px 18px 80px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer;background:#111;color:#fff}.green{background:#18b879}.block{background:#fff;border:1px solid #e2e6ea;border-radius:18px;margin:12px 0;overflow:hidden}.head{padding:17px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.body{display:none;padding:0 17px 17px;border-top:1px solid #eee}.block.open .body{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:12px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;margin-bottom:5px}input,textarea{width:100%;padding:11px;border:1px solid #dce1e5;border-radius:10px}textarea{min-height:78px}.notice{background:#eef7ff;border-radius:12px;padding:12px;margin:14px 0;font-size:12px}.status{font-size:12px;font-weight:800;margin-top:10px}.rows{display:grid;gap:10px}.row{border:1px solid #e4e7eb;border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.row img{max-width:150px;max-height:80px;object-fit:contain}.mini{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px;font-weight:800;cursor:pointer}@media(max-width:720px){.bar,.grid,.row{display:block}.actions{margin-top:12px}.field{margin-bottom:8px}}</style></head><body><main><div class="bar"><div><h1>Landing Page V2</h1><p>Editor novo • D1 • sem commits para salvar ou publicar conteúdo.</p></div><div class="actions"><button class="btn" id="save">SALVAR RASCUNHO</button><button class="btn" id="preview">PRÉ-VISUALIZAR ↗</button><button class="btn green" id="publish">PUBLICAR</button></div></div><div class="notice">Fluxo: edite → salve no D1 → confira no Preview → publique. O Preview lê o mesmo rascunho salvo no D1.</div><div id="status" class="status"></div><div id="blocks"></div></main><script src="/admin-common.js"></script><script>
const DEFAULT={version:2,seoTitle:"Club Pop Fit — Sua rotina vale mais",blocks:[
{id:"identity",name:"Identidade Visual",active:true,fields:{logoUrl:"",faviconUrl:""}},
{id:"carousel",name:"Banner Carrossel",active:true,fields:{interval:"5",items:[]}},
{id:"hero",name:"Abertura / Hero",active:true,fields:{eyebrow:"SEU TREINO. SUA CONSTÂNCIA. SUAS CONQUISTAS.",title:"Você treina pelos seus objetivos. O Club Pop recompensa o caminho.",text:"Transforme sua frequência em motivação: participe de missões, promoções e experiências que deixam cada treino ainda mais valioso.",imageUrl:"",buttonText:"QUERO FAZER PARTE →",buttonUrl:"/login.html"}},
{id:"features",name:"Missões, Promoções, Fitcoins e Benefícios",active:true,fields:{missionText:"Desafios que aproximam você dos seus objetivos.",promotionText:"Você já treina. Agora seu treino pode valer muito mais.",fitcoinsText:"Seu esforço vale. E agora também rende.",benefitsText:"Vantagens que acompanham a sua rotina."}},
{id:"how",name:"Como funciona",active:true,fields:{title:"Sua frequência vira benefícios.",text:"Quanto mais você se compromete com você mesmo, mais o Club Pop acompanha e reconhece sua jornada.",step1Title:"Faça suas aulas",step1Text:"Registre suas presenças e mantenha o ritmo.",step2Title:"Complete missões",step2Text:"Constância que te faz ir mais longe.",step3Title:"Conquiste vantagens",step3Text:"Fitcoins, prêmios, descontos e experiências."}},
{id:"promotion",name:"Promoção destaque",active:true,fields:{title:"Seu próximo check-in pode valer muito mais.",text:"Campanhas especiais transformam presença em chances, experiências e grandes prêmios.",buttonText:"VER MINHAS OPORTUNIDADES →",buttonUrl:"/login.html"}},
{id:"missions",name:"Missões",active:true,fields:{title:"Desafios que deixam você mais perto dos seus objetivos.",card1Title:"Constância semanal",card1Text:"Construa o hábito.",card2Title:"Metas de presença",card2Text:"Cada presença é mais um passo.",card3Title:"Conquistas que motivam",card3Text:"Seu progresso merece ser celebrado."}},
{id:"partners",name:"Academias parceiras",active:true,fields:{title:"Onde sua jornada acontece.",text:"O Club Pop Fit conecta alunos e academias.",items:[{name:"BIKE POP",logoUrl:""},{name:"GYM POP",logoUrl:""}]}},
{id:"header",name:"Botão do topo",active:true,fields:{buttonText:"Acessar Club Pop →",buttonUrl:"/login.html"}},
{id:"footer",name:"Rodapé",active:true,fields:{brand:"CLUB POP FIT",tagline:"Treine. Conquiste. Evolua.",text:"Academias parceiras: Bike Pop • Gym Pop"}}
]};
let data=structuredClone(DEFAULT);const blocks=document.getElementById("blocks"),statusEl=document.getElementById("status");const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fld(k,v){return '<div class="field"><label>'+k+'</label><textarea data-key="'+k+'">'+esc(v)+'</textarea></div>'}
function draw(){blocks.innerHTML=data.blocks.map((b,i)=>{let f=b.fields||{},body="";if(b.id==="carousel"||b.id==="partners"){let items=Array.isArray(f.items)?f.items:[];body='<div class="rows">'+items.map((x,j)=>'<div class="row" data-row="'+j+'"><div><label>'+(b.id==="partners"?"NOME":"IMAGEM")+'</label><input data-item="a" value="'+esc(b.id==="partners"?x.name:x.imageUrl)+'"></div><div><label>'+(b.id==="partners"?"LOGO":"LINK")+'</label><input data-item="b" value="'+esc(b.id==="partners"?x.logoUrl:x.linkUrl)+'"></div><button class="mini remove" type="button">REMOVER</button></div>').join("")+'</div><button class="mini add" type="button">+ ADICIONAR</button>';if(b.id==="carousel")body+=fld("interval",f.interval||"5");if(b.id==="partners"){body+=fld("title",f.title);body+=fld("text",f.text)}}else body=Object.entries(f).map(([k,v])=>fld(k,v)).join("");return '<section class="block" data-id="'+b.id+'"><div class="head"><b>'+String(i+1).padStart(2,"0")+' • '+esc(b.name)+'</b><span>'+(b.active?"ATIVO":"OCULTO")+'</span></div><div class="body"><button class="mini toggle" type="button">'+(b.active?"OCULTAR":"ATIVAR")+'</button><div class="grid">'+body+'</div></div></section>'}).join("");bind()}
function bind(){document.querySelectorAll(".block").forEach(el=>{let b=data.blocks.find(x=>x.id===el.dataset.id);el.querySelector(".head").onclick=()=>el.classList.toggle("open");el.querySelector(".toggle").onclick=()=>{b.active=!b.active;draw()};el.querySelectorAll("[data-key]").forEach(x=>x.oninput=()=>b.fields[x.dataset.key]=x.value);if(["carousel","partners"].includes(b.id)){el.querySelector(".add").onclick=()=>{b.fields.items.push(b.id==="partners"?{name:"",logoUrl:""}:{imageUrl:"",linkUrl:""});draw();document.querySelector('[data-id="'+b.id+'"]').classList.add("open")};el.querySelectorAll(".row").forEach(r=>{let i=+r.dataset.row,ins=r.querySelectorAll("input");ins[0].oninput=()=>{if(b.id==="partners")b.fields.items[i].name=ins[0].value;else b.fields.items[i].imageUrl=ins[0].value};ins[1].oninput=()=>{if(b.id==="partners")b.fields.items[i].logoUrl=ins[1].value;else b.fields.items[i].linkUrl=ins[1].value};r.querySelector(".remove").onclick=()=>{b.fields.items.splice(i,1);draw()}})}})}
async function api(method,body,slot="draft"){let r=await fetch("/api/evo-config?route=landing-v2&slot="+slot,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha");return d}
async function load(){try{let d=await api("GET",null,"draft");if(d.landing)data=d.landing;draw();statusEl.textContent=d.updatedAt?"Rascunho D1: "+d.updatedAt:"Novo rascunho — ainda não salvo."}catch(e){draw();statusEl.textContent="Erro: "+e.message}}
save.onclick=async()=>{try{let d=await api("PUT",{landing:data});statusEl.textContent="Rascunho salvo no D1 ✓ ("+d.bytes+" bytes)";cpNotify("success","Landing V2","Rascunho salvo. Nenhum commit gerado.")}catch(e){cpNotify("error","Landing V2",e.message)}};
preview.onclick=async()=>{try{await api("PUT",{landing:data});window.open("/landing-v2.html?preview=1","_blank")}catch(e){cpNotify("error","Preview",e.message)}};
publish.onclick=async()=>{if(!confirm("Publicar exatamente o rascunho que está no D1?"))return;try{await api("PUT",{landing:data});let d=await api("POST",{});statusEl.textContent="Publicado no D1 ✓";cpNotify("success","Landing V2","Publicada sem commit.")}catch(e){cpNotify("error","Landing V2",e.message)}};
load();
</script></body></html>
