<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bike Pop • Meu Desempenho</title><style>body{margin:0;background:#180d26;color:#fff;font:600 15px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:24px}button{padding:12px 18px;border:0;border-radius:12px;background:#ef4ba5;color:#fff;font-weight:800}</style></head>
<body><main id="loading">Carregando seu desempenho Bike Pop…</main><script>
(async()=>{try{
const urls=Array.from({length:10},(_,i)=>'/bike-pop-v3-1/parte-'+String(i+1).padStart(2,'0')+'.txt');
const parts=await Promise.all(urls.map(async url=>{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error('Parte indisponível: '+url);return r.text()}));
const html=parts.join('');
if(!html.startsWith('<!DOCTYPE html>')||!html.trimEnd().endsWith('</html>'))throw Error('HTML incompleto');
document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').innerHTML='<p>Não foi possível carregar o desempenho.</p><button onclick="location.reload()">Tentar novamente</button>';console.error(e)}})();
</script></body></html>
