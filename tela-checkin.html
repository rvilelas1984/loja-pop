<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Pop — Tela Check-in</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif}body{background:#f4f6f8;color:#111;overflow:hidden}.admin-shell{height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.admin-side{background:#111318;color:#fff;padding:27px 18px;position:relative}.admin-logo{font-size:23px;font-weight:950;padding:0 10px}.admin-logo span{color:#08a9e3}.admin-logo small{display:block;color:#777;font-size:9px;letter-spacing:2px;margin-top:4px}.admin-nav{display:grid;gap:6px;margin-top:30px}.admin-nav a{color:#aaa;text-decoration:none;padding:13px 14px;border-radius:12px;font-size:13px;font-weight:800}.admin-nav a.on{background:#fff;color:#111}.admin-foot{position:absolute;left:18px;right:18px;bottom:24px;padding:12px 10px 0;color:#aaa;font-size:10px;border-top:1px solid #2b2e34}.admin-foot b{display:block;color:#fff;font-size:11px;margin-bottom:7px}.admin-foot button{border:1px solid #353941;background:#1b1e23;color:#fff;border-radius:8px;padding:7px 10px;font-size:10px;font-weight:900;cursor:pointer}.checkin-wrap{min-width:0;padding:14px;background:#02080d;position:relative}
body{background:radial-gradient(circle at 50% 0,#142039 0,#07121d 35%,#02080d 78%)}.screen{height:calc(100vh - 28px);padding:1.4vh 2vw;display:flex;flex-direction:column}
.top{height:15vh;border:2px solid #15dbea;border-radius:24px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 2vw;box-shadow:0 0 20px #00dbe855,inset 0 0 28px #08172b}
.info{font-size:1.05vw;font-weight:900;color:#a8bac6}.info strong{display:block;font-size:2.6vw;color:#31e0ec;margin:.3vh 0}.right{text-align:right}.brand{text-align:center}.stage{font-size:1.1vw;letter-spacing:.6em;font-weight:950}.brand h1{font-size:3.2vw;margin:.4vh 0 0;font-style:italic}.brand b{color:#ad62ff}.brand span{color:#21d6e7}
.hint{text-align:center;font-size:1vw;color:#91a4b3;margin:.75vh}.map{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:1.1vh;min-height:0}.row{display:grid;gap:.9vw;justify-content:center}.r8{grid-template-columns:repeat(8,8.5vw)}.r9{grid-template-columns:repeat(9,8.5vw)}
.bike{min-height:0;border:1px solid #304452;border-radius:14px;background:linear-gradient(#0e1922,#071017);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 18px #0008}.bike .n{font-size:1.9vw;font-weight:950}.bike .name{font-size:.88vw;font-weight:950;margin-top:.6vh;text-transform:uppercase;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;color:#fff}
.bike.used{border-color:#22dce9;box-shadow:0 0 13px #0ddbea55,inset 0 0 20px #05303a}.bike.used .n{color:#37e5ef}.bike.used .name{color:#fff}.bike.present{border-color:#5cff8d;box-shadow:0 0 16px #5cff8d66,inset 0 0 20px #0b3520}.bike.present .n{color:#5cff8d}.bike.present .name{color:#fff}.bike .presence{font-size:.58vw;font-weight:950;letter-spacing:.08em;margin-top:.35vh;color:#5cff8d}
.participant-list{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));align-content:start;gap:10px;padding:12px 4vw;overflow:auto}.participant{border:1px solid #304452;border-radius:14px;background:linear-gradient(#0e1922,#071017);padding:14px 16px;color:#fff;font-size:1vw;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px}.participant.present{border-color:#5cff8d;box-shadow:0 0 12px #5cff8d33}.participant small{font-size:.65vw;color:#5cff8d;letter-spacing:.06em}.empty-class{grid-column:1/-1;text-align:center;color:#91a4b3;padding:40px 10px;font-size:1vw}
body.unit-gym .top{border-color:#ff4fa3;box-shadow:0 0 20px #ff4fa355,inset 0 0 28px #2a071b}body.unit-gym .info strong{color:#ff69b4}body.unit-gym .brand b,body.unit-gym .brand span{color:#ff4fa3}body.unit-gym .door:not(.exit){border-color:#ff4fa3;color:#ff69b4}body.unit-gym .bike.used{border-color:#ff4fa3;box-shadow:0 0 13px #ff4fa355,inset 0 0 20px #3a0825}body.unit-gym .bike.used .n{color:#ff69b4}
.foot{height:6vh;display:flex;align-items:center;justify-content:space-between;padding-bottom:.7vh;font-size:.85vw;color:#6f8493}.door{border:1px solid #16d7e4;border-radius:8px;padding:.5vh 1vw;color:#20dbe7;font-weight:900}.door.exit{border-color:#e94b55;color:#ff6570}
.controls{position:fixed;right:14px;bottom:12px;display:flex;gap:7px;opacity:.22;transition:.2s}.controls:hover{opacity:1}.controls button{background:#07141d;border:1px solid #3d5968;color:#fff;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.controls button:disabled{cursor:wait;opacity:.65}@keyframes spin{to{transform:rotate(360deg)}}#refresh.loading .spin{display:inline-block;animation:spin .75s linear infinite}.status{position:fixed;left:270px;bottom:12px;font-size:10px;color:#6e8492}
@media(max-width:760px){body{overflow:auto}.admin-shell{display:block;height:auto;min-height:100vh}.admin-side{display:none}.checkin-wrap{padding:8px;min-height:100vh}.screen{height:auto;min-height:100vh;padding:8px 6px 92px;display:block}.top{height:auto;min-height:150px;border-radius:20px;grid-template-columns:1fr 1fr;padding:14px 12px;gap:8px}.top .brand{grid-column:1/-1;grid-row:1}.top .info:first-child{grid-column:1;grid-row:2}.top .right{grid-column:2;grid-row:2}.info{font-size:10px}.info strong{font-size:22px;margin:4px 0}.info label{font-size:9px!important}.info select{font-size:14px;max-width:145px}.stage{font-size:9px}.brand h1{font-size:25px}.hint{font-size:9px;margin:10px 0 8px}.map{display:grid;gap:10px;min-height:0}.row{display:grid;gap:6px;width:100%;justify-content:center}.bike{height:86px;min-height:86px;border-radius:11px}.bike .n{font-size:15px}.bike .name{font-size:7px;margin-top:4px}.bike .presence{font-size:6px}.foot{height:auto;min-height:42px;font-size:8px;margin-top:10px;gap:6px}.door{padding:5px 7px}.controls{left:8px;right:8px;bottom:8px;justify-content:center;opacity:.94;background:#02080ddd;padding:8px;border-radius:13px;z-index:20}.controls button{padding:10px 9px;font-size:10px;flex:1;max-width:150px}.participant-list{grid-template-columns:1fr 1fr;padding:8px 0;gap:7px}.participant{font-size:10px;padding:11px 10px}.participant small{font-size:7px}.empty-class{font-size:10px}.status{position:fixed;left:12px;bottom:76px;margin:0;font-size:9px;z-index:21;background:#02080dcc;padding:4px 7px;border-radius:7px}.screen.mobile-many .bike{height:74px;min-height:74px}}body:fullscreen .admin-shell{display:block}body:fullscreen .admin-side{display:none}body:fullscreen .checkin-wrap{padding:0;height:100vh}body:fullscreen .screen{height:100vh}body:fullscreen #back{display:none}body:fullscreen .status{left:14px}</style></head><body><div class="admin-shell"><aside class="admin-side"><div class="admin-logo">CLUB <span>POP</span><small>ADMINISTRATIVO</small></div><nav class="admin-nav" id="roleNav"></nav><div class="admin-foot" id="roleFoot">CLUB POP • Carregando acesso…</div></aside><div class="checkin-wrap"><main class="screen"><header class="top"><div class="info"><label style="font-size:.65vw;color:#91a4b3">UNIDADE <select id="unitSelect" style="background:#07141d;color:#fff;border:1px solid #3d5968;border-radius:7px;padding:4px"><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select></label><br>AULA EXIBIDA<strong id="time">--:--</strong><span id="activity">BIKE POP</span></div><div class="brand"><div class="stage">PALCO</div><h1 id="unitBrand"><b>BIKE</b> <span>POP</span></h1></div><div class="info right">PROFESSOR<strong id="teacher">—</strong><span id="date"></span></div></header><div class="hint" id="hint">ENCONTRE SEU NOME E SIGA PARA SUA BIKE</div><section class="map" id="map"></section><footer class="foot"><span class="door exit">PORTA SAÍDA</span><span id="next">CARREGANDO PRÓXIMA AULA…</span><span class="door">PORTA ENTRADA</span></footer></main><div class="status" id="status">Conectando ao EVO…</div><div class="controls"><button id="back">← VOLTAR</button><button id="refresh"><span class="spin">↻</span> ATUALIZAR</button><button id="fs">⛶ TELA CHEIA</button></div></div></div><script>
(async()=>{const nav=document.getElementById("roleNav"),foot=document.getElementById("roleFoot");try{const r=await fetch("/api/admin-auth?route=me",{cache:"no-store"}),d=await r.json();if(!r.ok)throw 0;const rec=d.role==="reception",items=rec?[["Aulas e Check-in","/tela-checkin.html"],["Resgates e Transações","/admin-resgates.html"],["Central de Sorteios","/admin-sorteios.html"]]:[["Dashboard","/admin.html"],["Alunos","/admin-alunos-evo.html"],["Aulas e Check-in","/tela-checkin.html"],["Promoções","/admin-promocoes.html"],["Central de Sorteios","/admin-sorteios.html"],["Missões e Benefícios","/admin-missoes.html"],["Loja e Serviços","/admin-loja.html"],["Resgates e Transações","/admin-resgates.html"],["Sincronização","/admin-sync.html"],["Requisições EVO","/admin-requisicoes.html"],["Configurações","/admin-configuracoes.html"],["Testes Gerais","/admin-testes-gerais.html"]];nav.innerHTML=items.map(([n,h])=>'<a'+(h===location.pathname?' class="on"':'')+' href="'+h+'">'+n+'</a>').join("");foot.innerHTML='<b>'+(rec?"Recepcionista":"Administrador")+'</b><button type="button" id="checkinLogout">Sair</button>';document.querySelector(".admin-logo small").textContent=rec?"RECEPÇÃO":"ADMINISTRATIVO";document.getElementById("checkinLogout").onclick=async()=>{try{await fetch("/api/admin-auth?route=logout",{cache:"no-store"})}finally{sessionStorage.removeItem("cpAdminScope");location.replace("/admin-login.html")}}}catch{location.replace("/admin-login.html")}})();
</script><script>
let rowSizes=[8,8,9,9],els={map:document.querySelector("#map"),time:document.querySelector("#time"),activity:document.querySelector("#activity"),teacher:document.querySelector("#teacher"),date:document.querySelector("#date"),next:document.querySelector("#next"),status:document.querySelector("#status")};
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function applyUnitIdentity(unit){const gym=unit==="gym";document.body.classList.toggle("unit-gym",gym);document.getElementById("unitBrand").innerHTML=gym?"<b>GYM</b> <span>POP</span>":"<b>BIKE</b> <span>POP</span>";document.getElementById("hint").textContent=gym?"CONFIRA SEU NOME NA LISTA DA AULA":"ENCONTRE SEU NOME E SIGA PARA SUA BIKE"}
function render(data){const a=data.current||{},unit=data.unit||document.getElementById("unitSelect")?.value||"bike";applyUnitIdentity(unit);const active=(a.enrollments||[]).filter(x=>!x.removed),numbered=active.filter(x=>Number(x.slotNumber)>0),hasNumbered=numbered.length>0;els.map.innerHTML="";els.map.className=hasNumbered?"map":"participant-list";if(hasNumbered){const by=new Map(numbered.map(x=>[Number(x.slotNumber),x]));rowSizes=(data.layout?.rows?.length?data.layout.rows:[8,8,9,9]);els.map.style.gridTemplateRows=window.matchMedia("(max-width:760px)").matches?"none":"repeat("+rowSizes.length+",1fr)";document.querySelector(".screen")?.classList.toggle("mobile-many",rowSizes.length>4);let lo=1;for(const size of rowSizes){const hi=lo+size-1,r=document.createElement("div");r.className="row";r.style.gridTemplateColumns=window.matchMedia("(max-width:760px)").matches?"repeat("+size+",minmax(0,1fr))":"repeat("+size+",minmax(0,8.5vw))";for(let n=lo;n<=hi;n++){const e=by.get(n),d=document.createElement("div");d.className="bike"+(e?" used":"")+(e?.checkedIn?" present":"");d.innerHTML='<div class="n">B'+n+'</div><div class="name">'+(e?esc(e.displayName||e.name):"LIVRE")+"</div>"+(e?.checkedIn?'<div class="presence">PRESENTE</div>':"");r.appendChild(d)}els.map.appendChild(r);lo=hi+1}document.getElementById("hint").textContent=unit==="gym"?"ENCONTRE SEU NOME E CONFIRA SUA POSIÇÃO":"ENCONTRE SEU NOME E SIGA PARA SUA BIKE"}else{els.map.style.gridTemplateRows="";document.querySelector(".screen")?.classList.remove("mobile-many");if(active.length){for(const e of active){const d=document.createElement("div");d.className="participant"+(e.checkedIn?" present":"");d.innerHTML="<span>"+esc(e.displayName||e.name||"ALUNO")+"</span>"+(e.checkedIn?"<small>PRESENTE</small>":"");els.map.appendChild(d)}}else{els.map.innerHTML='<div class="empty-class">Nenhum aluno inscrito nesta aula.</div>'}document.getElementById("hint").textContent="ALUNOS INSCRITOS NESTA AULA"}els.time.textContent=a.startTime||"--:--";els.activity.textContent=a.name||(unit==="gym"?"GYM POP":"BIKE POP");els.teacher.textContent=a.instructor||"—";els.date.textContent=a.dateLabel||"";els.next.textContent=data.next?("PRÓXIMA: "+data.next.startTime+" • "+data.next.name):"ÚLTIMA AULA DO DIA";els.status.textContent="Última atualização • "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
let currentStart=null,autoReloadKey="";
const cacheKey=u=>"cpCheckinCache:"+u;function cached(u){try{const x=JSON.parse(localStorage.getItem(cacheKey(u))||"null");return x?.ok?x:null}catch{return null}}function storeCache(u,d){try{localStorage.setItem(cacheKey(u),JSON.stringify(d))}catch{}}async function load(reason="manual"){if(load.busy)return;const unit=document.getElementById("unitSelect")?.value||"bike";if(reason==="initial"){const hit=cached(unit);if(hit){render(hit);currentStart=hit.current?.startTime||null;els.status.textContent="Dados em cache • use ATUALIZAR para consultar a EVO";return}}load.busy=true;const rb=document.querySelector("#refresh");rb?.classList.add("loading");if(rb)rb.disabled=true;try{els.status.textContent=reason==="initial"?"Carregando EVO…":reason==="class-change"?"Carregando próxima aula…":"Atualizando EVO…";sessionStorage.setItem("cpCheckinUnit",unit);const r=await fetch("/api/tela-checkin?unit="+encodeURIComponent(unit),{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha");render(d);storeCache(unit,d);currentStart=d.current?.startTime||null;autoReloadKey=""}catch(e){els.status.textContent="Sem atualização • "+e.message}finally{load.busy=false;rb?.classList.remove("loading");if(rb)rb.disabled=false}}
function localMinutes(){const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());return Number(parts.find(x=>x.type==="hour").value)*60+Number(parts.find(x=>x.type==="minute").value)}
function toMinutes(v){const [h,m]=String(v||"0:0").split(":").map(Number);return h*60+m}
function watchClassChange(){if(!currentStart||load.busy)return;const threshold=toMinutes(currentStart)+30,now=localMinutes(),key=currentStart+"@"+threshold;if(now>=threshold&&autoReloadKey!==key){autoReloadKey=key;load("class-change")}}
const us=document.getElementById("unitSelect");if(us){us.value=sessionStorage.getItem("cpCheckinUnit")||"bike";applyUnitIdentity(us.value);us.onchange=()=>{applyUnitIdentity(us.value);const hit=cached(us.value);if(hit){render(hit);els.status.textContent="Dados em cache • use ATUALIZAR para consultar a EVO"}else load("initial")}}load("initial");document.querySelector("#back").onclick=()=>location.href="/admin.html";document.querySelector("#refresh").onclick=()=>load("manual");document.querySelector("#fs").onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.body.requestFullscreen()}catch{}};
</script></body></html>
