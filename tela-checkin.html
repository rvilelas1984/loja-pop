<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Pop — Tela Check-in</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02080d;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 50% 0,#142039 0,#07121d 35%,#02080d 78%)}.screen{height:100vh;padding:1.4vh 2vw;display:flex;flex-direction:column}
.top{height:15vh;border:2px solid #15dbea;border-radius:24px;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 2vw;box-shadow:0 0 20px #00dbe855,inset 0 0 28px #08172b}
.info{font-size:1.05vw;font-weight:900;color:#a8bac6}.info strong{display:block;font-size:2.6vw;color:#31e0ec;margin:.3vh 0}.right{text-align:right}.brand{text-align:center}.stage{font-size:1.1vw;letter-spacing:.6em;font-weight:950}.brand h1{font-size:3.2vw;margin:.4vh 0 0;font-style:italic}.brand b{color:#ad62ff}.brand span{color:#21d6e7}
.hint{text-align:center;font-size:1vw;color:#91a4b3;margin:.75vh}.map{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:1.1vh;min-height:0}.row{display:grid;gap:.9vw;justify-content:center}.r8{grid-template-columns:repeat(8,8.5vw)}.r9{grid-template-columns:repeat(9,8.5vw)}
.bike{min-height:0;border:1px solid #304452;border-radius:14px;background:linear-gradient(#0e1922,#071017);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 18px #0008}.bike .n{font-size:1.9vw;font-weight:950}.bike .name{font-size:.88vw;font-weight:950;margin-top:.6vh;text-transform:uppercase;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;color:#5e7180}
.bike.used{border-color:#22dce9;box-shadow:0 0 13px #0ddbea55,inset 0 0 20px #05303a}.bike.used .n{color:#37e5ef}.bike.used .name{color:#fff}
.foot{height:5vh;display:flex;align-items:flex-end;justify-content:space-between;font-size:.85vw;color:#6f8493}.door{border:1px solid #16d7e4;border-radius:8px;padding:.5vh 1vw;color:#20dbe7;font-weight:900}
.controls{position:fixed;right:14px;bottom:12px;display:flex;gap:7px;opacity:.22;transition:.2s}.controls:hover{opacity:1}.controls button{background:#07141d;border:1px solid #3d5968;color:#fff;border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.status{position:fixed;left:14px;bottom:12px;font-size:10px;color:#6e8492}
</style></head><body><main class="screen"><header class="top"><div class="info">AULA EXIBIDA<strong id="time">--:--</strong><span id="activity">BIKE POP</span></div><div class="brand"><div class="stage">PALCO</div><h1><b>BIKE</b> <span>POP</span></h1></div><div class="info right">PROFESSOR<strong id="teacher">—</strong><span id="date"></span></div></header><div class="hint">ENCONTRE SEU NOME E SIGA PARA SUA BIKE</div><section class="map" id="map"></section><footer class="foot"><span>PORTA SAÍDA</span><span id="next">CARREGANDO PRÓXIMA AULA…</span><span class="door">PORTA ENTRADA</span></footer></main><div class="status" id="status">Conectando ao EVO…</div><div class="controls"><button id="refresh">↻ ATUALIZAR</button><button id="fs">⛶ TELA CHEIA</button></div><script>
const rows=[[1,8],[9,16],[17,25],[26,34]],els={map:document.querySelector("#map"),time:document.querySelector("#time"),activity:document.querySelector("#activity"),teacher:document.querySelector("#teacher"),date:document.querySelector("#date"),next:document.querySelector("#next"),status:document.querySelector("#status")};
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(data){const a=data.current||{},by=new Map((a.enrollments||[]).filter(x=>!x.removed&&Number(x.slotNumber)>0).map(x=>[Number(x.slotNumber),x]));els.map.innerHTML="";for(const [lo,hi] of rows){const r=document.createElement("div");r.className="row "+(hi-lo+1===8?"r8":"r9");for(let n=lo;n<=hi;n++){const e=by.get(n),d=document.createElement("div");d.className="bike"+(e?" used":"");d.innerHTML='<div class="n">B'+n+'</div><div class="name">'+(e?esc(e.displayName||e.name):"LIVRE")+"</div>";r.appendChild(d)}els.map.appendChild(r)}els.time.textContent=a.startTime||"--:--";els.activity.textContent=a.name||"BIKE POP";els.teacher.textContent=a.instructor||"—";els.date.textContent=a.dateLabel||"";els.next.textContent=data.next?("PRÓXIMA: "+data.next.startTime+" • "+data.next.name):"ÚLTIMA AULA DO DIA";els.status.textContent="Atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
let currentStart=null,autoReloadKey="";
async function load(reason="manual"){if(load.busy)return;load.busy=true;try{els.status.textContent=reason==="initial"?"Carregando EVO…":reason==="class-change"?"Carregando próxima aula…":"Atualizando EVO…";const r=await fetch("/api/tela-checkin",{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha");render(d);currentStart=d.current?.startTime||null;autoReloadKey=""}catch(e){els.status.textContent="Sem atualização • "+e.message}finally{load.busy=false}}
function localMinutes(){const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());return Number(parts.find(x=>x.type==="hour").value)*60+Number(parts.find(x=>x.type==="minute").value)}
function toMinutes(v){const [h,m]=String(v||"0:0").split(":").map(Number);return h*60+m}
function watchClassChange(){if(!currentStart||load.busy)return;const threshold=toMinutes(currentStart)+30,now=localMinutes(),key=currentStart+"@"+threshold;if(now>=threshold&&autoReloadKey!==key){autoReloadKey=key;load("class-change")}}
load("initial");setInterval(watchClassChange,15000);document.querySelector("#refresh").onclick=()=>load("manual");document.querySelector("#fs").onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
</script></body></html>
