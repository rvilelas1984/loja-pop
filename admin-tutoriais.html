<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop — Administração de Tutoriais</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{background:#f4f6f8;color:#18212b;font:14px Inter,system-ui,sans-serif;margin:0}main{max-width:1100px;margin:auto;padding:28px 18px 100px}h1{font-size:27px}.panel{background:#fff;border:1px solid #e1e6eb;border-radius:19px;padding:20px;margin:18px 0}label{display:block;font-weight:800;font-size:12px;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #d9e0e7;border-radius:11px;padding:12px;font:inherit}textarea{min-height:80px}button{background:#151b22;color:#fff;border:0;border-radius:11px;padding:11px 16px;font:inherit;cursor:pointer}button.secondary{background:#eaf0f5;color:#17222d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border-bottom:1px solid #e8edf2;padding:15px 0}.item:last-child{border:0}.meta{color:#77818e;font-size:12px;margin:5px 0}.status{font-weight:800;color:#148354}#notice{min-height:20px;color:#a33439}</style></head><body><main><h1>Central de Tutoriais</h1><p>Cadastre vídeos do Google Drive para orientar os alunos do Bike Pop e Gym Pop.</p><section class="panel"><h2 id="formTitle">Novo tutorial</h2><form id="form"><input type="hidden" id="id"><div class="grid"><div><label for="title">Título do vídeo</label><input id="title" required maxlength="120" placeholder="Entenda o Dashboard"></div><div><label for="category">Categoria</label><input id="category" required maxlength="60" list="categories" placeholder="Dashboard"><datalist id="categories"><option value="Primeiros passos"><option value="Dashboard"><option value="Missões"><option value="Presenças"><option value="Vouchers"><option value="Loja"><option value="Perfil"></datalist></div></div><label for="description">Descrição</label><textarea id="description" maxlength="700" placeholder="O que o aluno aprenderá neste vídeo?"></textarea><label for="drive_url">Link do vídeo no Google Drive</label><input id="drive_url" required type="url" placeholder="https://drive.google.com/file/d/.../view"><p style="color:#657180;font-size:12px">No Drive, compartilhe como “Qualquer pessoa com o link — Leitor”. Não utilize vídeos com dados pessoais de alunos.</p><div class="grid"><div><label for="unit">Disponível para</label><select id="unit"><option value="all">Bike Pop e Gym Pop</option><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select></div><div><label for="sort">Ordem de exibição</label><input id="sort" type="number" min="0" max="9999" value="0"></div></div><label><input type="checkbox" id="published" checked style="width:auto"> Publicado para os alunos</label><div class="row" style="margin-top:16px"><button id="save">Salvar tutorial</button><button class="secondary" type="button" id="clear">Limpar formulário</button></div><div id="notice" role="status"></div></form></section><section class="panel"><h2>Vídeos cadastrados</h2><div id="list">Carregando...</div></section></main><script src="/admin-common.js"></script><script>
const $=id=>document.getElementById(id);let items=[];
function driveUrl(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
async function api(method,body){const r=await fetch('/api/admin-auth?route=tutorials',{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao salvar');return d}
function clearForm(){$('form').reset();$('id').value='';$('sort').value='0';$('formTitle').textContent='Novo tutorial';$('notice').textContent=''}
$('clear').onclick=clearForm;
function edit(x){$('id').value=x.id;$('title').value=x.title;$('description').value=x.description||'';$('category').value=x.category;$('unit').value=x.unit;$('sort').value=x.sort_order;$('published').checked=!!x.published;$('drive_url').value=driveUrl(x.drive_file_id);$('formTitle').textContent='Editar tutorial #'+x.id;scrollTo({top:0,behavior:'smooth'})}
function render(){const host=$('list');host.replaceChildren();if(!items.length){host.textContent='Nenhum tutorial cadastrado.';return}for(const x of items){const item=document.createElement('div');item.className='item';const title=document.createElement('strong');title.textContent=x.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=x.category+' · '+(x.unit==='all'?'Bike e Gym':x.unit)+' · Ordem '+x.sort_order+' · '+(x.published?'Publicado':'Oculto');const actions=document.createElement('div');actions.className='row';const editBtn=document.createElement('button');editBtn.textContent='Editar';editBtn.onclick=()=>edit(x);const preview=document.createElement('a');preview.href=driveUrl(x.drive_file_id);preview.target='_blank';preview.rel='noopener noreferrer';preview.textContent='Ver vídeo ↗';const del=document.createElement('button');del.className='secondary';del.textContent='Excluir';del.onclick=async()=>{if(!confirm('Excluir este tutorial?'))return;try{await api('DELETE',{id:x.id});await load()}catch(e){$('notice').textContent=e.message}};actions.append(editBtn,preview,del);item.append(title,meta,actions);host.append(item)}}
async function load(){try{const d=await api('GET');items=d.items||[];render()}catch(e){$('list').textContent='Erro ao carregar: '+e.message}}
$('form').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;$('notice').textContent='Salvando...';try{await api('POST',{id:Number($('id').value)||undefined,title:$('title').value,description:$('description').value,category:$('category').value,unit:$('unit').value,sort_order:Number($('sort').value),published:$('published').checked,drive_url:$('drive_url').value});clearForm();$('notice').style.color='#168354';$('notice').textContent='Tutorial salvo com sucesso.';await load()}catch(e){$('notice').style.color='#a33439';$('notice').textContent=e.message}finally{b.disabled=false}};load();
</script></body></html>
