<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pop Fit | Evolução do peso</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eef2;color:#152033;font-family:Arial,Helvetica,sans-serif}.shell{max-width:510px;margin:auto;padding:14px 12px 35px}.top{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.top strong{font-size:15px}.top small{color:#65717e}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{border:1px solid #cfd9df;border-radius:25px;background:#fff;padding:9px 12px;font-weight:700;color:#183148}.controls button.active{background:#0a2d3b;color:#66f7dc}.poster{width:100%;display:block;box-shadow:0 16px 45px #06233444;border-radius:13px;overflow:hidden}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:15px 8px;border:0;border-radius:13px;background:#123345;color:white;font-weight:800;font-size:14px}.actions button:first-child{background:#0bbaa6;color:#042b32}.note{font-size:12px;color:#677681;line-height:1.5;margin:12px 4px}.controlLabel{font-size:12px;font-weight:700;margin:8px 0}.photo{clip-path:url(#photoClip)}.style-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}.style-field{min-width:0;position:relative}.style-field label{display:block;font-size:12px;font-weight:800;margin:0 0 7px;color:#183148}.style-trigger{width:100%;height:47px;display:flex;align-items:center;justify-content:space-between;gap:7px;border:1px solid #cbd7df;border-radius:13px;background:#fff;color:#183148;padding:0 11px;font-weight:750;font-size:14px}.style-trigger .selected{display:flex;align-items:center;gap:8px;min-width:0}.color-dot{width:23px;height:23px;border-radius:50%;display:inline-block;flex-shrink:0}.style-menu{position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid #cbd7df;border-radius:13px;padding:5px;box-shadow:0 9px 20px #001c3033;max-height:260px;overflow-y:auto}.style-menu[hidden]{display:none}.style-menu button{display:block;width:100%;text-align:left;padding:11px 9px;background:white;color:#183148;border:0;border-radius:8px;font-weight:700}.style-menu button.active{background:#d7f7f2}.color-menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:9px 7px;min-width:0;width:min(240px,calc(100vw - 85px));left:auto;right:0}.color-menu button{border:2px solid transparent;width:28px;height:28px;border-radius:50%;padding:0;flex:0 0 28px;display:flex;align-items:center;justify-content:center}.color-menu button.active{border:2px solid #fff;outline:2px solid #143b52}@media(max-width:390px){.style-row{gap:8px}.style-trigger{font-size:12px;padding:0 8px}.style-field label{font-size:11px}}svg text{font-family:Arial,Helvetica,sans-serif}.script{font-family:Georgia,serif;font-style:italic}button{cursor:pointer}
</style></head><body><div class="shell"><div class="controlLabel">Período do gráfico</div><div class="controls" id="periods"><button class="active" data-period="month">Novembro</button><button data-period="3m">3 meses</button><button data-period="all">Histórico</button></div><div class="style-row"><div class="style-field"><label for="modelTrigger">Modelo de texto</label><button type="button" class="style-trigger" id="modelTrigger" aria-expanded="false" aria-controls="models"><span id="modelSelected">Modelo 1</span><span aria-hidden="true">⌄</span></button><div class="style-menu" id="models" hidden></div></div><div class="style-field"><label for="colorTrigger">Combinação de cores</label><button type="button" class="style-trigger" id="colorTrigger" aria-expanded="false" aria-controls="palettes"><span class="selected"><span class="color-dot" id="colorSelectedDot"></span><span id="colorSelectedName">Turquesa</span></span><span aria-hidden="true">⌄</span></button><div class="style-menu color-menu" id="palettes" hidden></div></div></div>
<svg id="poster" class="poster" viewBox="0 0 864 1536" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Story de evolução do peso Pop Fit com gráfico e indicadores">
<defs><linearGradient id="bg" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#07111d"/><stop offset=".62" stop-color="#061725"/><stop offset="1" stop-color="#073c42"/></linearGradient><linearGradient id="wave" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04d9b1"/><stop offset="1" stop-color="#4034a2"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16465c" stop-opacity=".85"/><stop offset="1" stop-color="#0b2032" stop-opacity=".9"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18f6d3" stop-opacity=".38"/><stop offset="1" stop-color="#18f6d3" stop-opacity="0"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="photoClip"><circle cx="714" cy="149" r="121"/></clipPath></defs>
<rect width="864" height="1536" fill="url(#bg)"/><path d="M0 0H170Q125 46 0 58Z" fill="#08caa8"/><path d="M0 60Q65 45 99 25L0 124Z" fill="#6134ac"/><path d="M864 203Q750 253 864 337Z" fill="#0e987e" opacity=".28"/><path d="M0 1424Q92 1490 217 1536H0Z" fill="#18c9c0"/><path d="M0 1397Q45 1458 122 1496L0 1491Z" fill="#7435bc"/>
<text x="70" y="111" font-size="52" font-weight="900" fill="#55f2e4">✦</text><text x="135" y="111" font-size="53" font-weight="900" fill="#66e8f7">POP <tspan fill="white">FIT</tspan></text><text x="85" y="142" font-size="17" fill="#c7d5dc" letter-spacing="1">MOVIMENTO · SAÚDE · BEM-ESTAR</text>
<circle cx="714" cy="149" r="128" fill="#00d9bd"/><circle cx="714" cy="149" r="122" fill="#082b37"/><g clip-path="url(#photoClip)"><image class="photo" href="" x="593" y="28" width="242" height="242" preserveAspectRatio="xMidYMid slice"/></g>

<rect x="32" y="1054" width="800" height="264" rx="30" fill="url(#glass)" stroke="#346079" stroke-width="2"/><text x="70" y="1111" font-size="29" fill="#30f0db">◷</text><text x="119" y="1111" font-size="28" font-weight="800" fill="white">Últimas pesagens</text><text id="countLabel" x="794" y="1111" text-anchor="end" font-size="20" fill="#b8cad5">3 registros</text><g id="historyRows"></g>

</svg><div class="actions"><button id="share">↗ Compartilhar</button><button id="save">↓ Salvar imagem</button></div></div><script>
const ns='http://www.w3.org/2000/svg';
let all=[],active='month';

const models=[
[['Minha evolução','começa com','consistência!'],['Disciplina','gera resultados!'],['Você mais forte','a cada treino!']],
[['Cada conquista','conta uma','história!'],['Um dia','de cada vez!'],['Minha dedicação,','minha transformação!']],
[['Orgulho de','cada passo','dessa jornada!'],['O progresso','é meu!'],['Mais forte','do que ontem!']],
[['Minha melhor','versão está em','construção!'],['Pequenos passos,','grandes mudanças!'],['Eu escolhi','cuidar de mim!']],
[['O resultado','de nunca','desistir!'],['Minha evolução,','minhas regras!'],['Minha história','continua!']]
];
const palettes=[
['Turquesa','#07111d','#19f6dc','#6134ac'],
['Pink Pop','#200c24','#ff69b8','#ef368c'],
['Dourado','#18171c','#f0c970','#aa8542'],
['Roxo Pop','#160c29','#c69aff','#8743d0'],
['Azul Elétrico','#07152c','#55caff','#3979f2']
];
let mi=0,ci=0;
try{const x=JSON.parse(localStorage.getItem('popfit_weight_story_style')||'{}');mi=Math.max(0,Math.min(4,Number(x.model)||0));ci=Math.max(0,Math.min(4,Number(x.color)||0))}catch(e){}
const svg=document.getElementById('poster');
const paint=[...svg.querySelectorAll('[fill],[stroke],[stop-color]')].map(el=>[el,el.getAttribute('fill'),el.getAttribute('stroke'),el.getAttribute('stop-color')]);
function fit(id,value,width,size){const el=document.getElementById(id);el.textContent=value;el.setAttribute('font-size',size);while(size>19&&el.getComputedTextLength()>width)el.setAttribute('font-size',--size)}
function styleStory(){
 const m=models[mi],p=palettes[ci];
 m[0].forEach((v,i)=>fit('headline'+(i+1),v,540,63));
 m[1].forEach((v,i)=>fit('side'+(i+1),v,290,37));
 m[2].forEach((v,i)=>fit('footer'+(i+1),v,430,43));
 const accents=new Set(['#00d9bd','#08caa8','#04d9b1','#18c9c0','#13f0c9','#2de9d0','#27f0d5','#25dcca','#25e7c8','#23d9c4','#28e5a5','#18f6d3','#55f2e4','#66e8f7','#61f0df','#58e7d7','#30f0db']);
 const secondary=new Set(['#6134ac','#7435bc','#4034a2']);
 for(const [el,...attrs] of paint){['fill','stroke','stop-color'].forEach((attr,i)=>{const v=attrs[i];if(accents.has(v))el.setAttribute(attr,p[2]);else if(secondary.has(v))el.setAttribute(attr,p[3]);else if(v==='#07111d')el.setAttribute(attr,p[1]);else if(v==='#061725')el.setAttribute(attr,p[1]);else if(v==='#073c42')el.setAttribute(attr,p[1])})}
 document.querySelectorAll('#models button').forEach((b,i)=>b.classList.toggle('active',i===mi));document.getElementById('modelSelected').textContent='Modelo '+(mi+1);
 document.querySelectorAll('#palettes button[data-palette]').forEach((b,i)=>b.classList.toggle('active',i===ci));document.getElementById('colorSelectedName').textContent=p[0];document.getElementById('colorSelectedDot').style.background=p[2];
 try{localStorage.setItem('popfit_weight_story_style',JSON.stringify({model:mi,color:ci}))}catch(e){}
 draw();
}
const modelMenu=document.getElementById('models'),colorMenu=document.getElementById('palettes');
function closeMenus(){modelMenu.hidden=true;colorMenu.hidden=true;document.getElementById('modelTrigger').setAttribute('aria-expanded','false');document.getElementById('colorTrigger').setAttribute('aria-expanded','false')}
function toggleMenu(which){const menu=which==='model'?modelMenu:colorMenu,wasHidden=menu.hidden;closeMenus();menu.hidden=!wasHidden;document.getElementById(which==='model'?'modelTrigger':'colorTrigger').setAttribute('aria-expanded',String(wasHidden))}
document.getElementById('modelTrigger').onclick=()=>toggleMenu('model');
document.getElementById('colorTrigger').onclick=()=>toggleMenu('color');
models.forEach((_,i)=>{const b=document.createElement('button');b.textContent='Modelo '+(i+1);b.onclick=()=>{mi=i;styleStory();closeMenus()};modelMenu.appendChild(b)});
palettes.forEach((p,i)=>{const b=document.createElement('button');b.dataset.palette=String(i);b.title=p[0];b.setAttribute('aria-label',p[0]);b.style.background=p[2];b.onclick=()=>{ci=i;styleStory();closeMenus()};colorMenu.appendChild(b)});
document.addEventListener('click',e=>{if(!e.target.closest('.style-row'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});

const fmt=v=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:1});
function node(name,attrs,text,parent){const e=document.createElementNS(ns,name);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;(parent||document.getElementById('chartData')).appendChild(e);return e}
function dateBR(d){const a=String(d||'').slice(0,10).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:'—'}
function draw(){
 const now=new Date(),month=now.toISOString().slice(0,7),start3=new Date(now.getFullYear(),now.getMonth()-2,1).toISOString().slice(0,10);
 const source=all.filter(p=>p.source!=='Peso inicial').sort((a,b)=>String(a.recordedAt||a.date).localeCompare(String(b.recordedAt||b.date)));
 const filtered=source.filter(p=>active==='all'||(active==='month'?p.date?.slice(0,7)===month:p.date>=start3));
 const rows=[];for(const p of filtered){const day=String(p.date);if(rows.length&&rows.at(-1).date===day){rows[rows.length-1]=p}else rows.push(p)}
 const title=active==='all'?'Todo o histórico':active==='3m'?'Últimos 3 meses':now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const label=document.getElementById('periodLabel');label.textContent='▦  '+title;let size=29;label.setAttribute('font-size',size);while(size>18&&label.getComputedTextLength()>270)label.setAttribute('font-size',--size);
 const chart=document.getElementById('chartData');chart.replaceChildren();
 const initial=all.find(p=>p.source==='Peso inicial');
 const selected=rows.length>7?rows.filter((_,i)=>i===0||i===rows.length-1||i%Math.ceil(rows.length/6)===0):rows;
 const chartRows=initial?[{...initial,isBaseline:true},...selected]:selected;
 if(chartRows.length){
  const vals=chartRows.map(p=>Number(p.weight)),min=Math.min(...vals)-1,max=Math.max(...vals)+1;
  const xs=chartRows.map((_,i)=>chartRows.length===1?460:148+i*630/(chartRows.length-1));
  const ys=chartRows.map(p=>770-(Number(p.weight)-min)/(max-min)*180);
  const pts=xs.map((x,i)=>x+','+ys[i]).join(' ');
  node('polygon',{points:pts+' '+xs.at(-1)+',815 '+xs[0]+',815',fill:'url(#area)'},undefined,chart);
  node('polyline',{points:pts,fill:'none',stroke:palettes[ci][2],'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#glow)'},undefined,chart);
  chartRows.forEach((p,i)=>{const x=xs[i],y=ys[i];node('circle',{cx:x,cy:y,r:10,fill:'#fff',stroke:palettes[ci][2],'stroke-width':5},undefined,chart);node('text',{x,y:y-23,'text-anchor':'middle','font-size':20,'font-weight':800,fill:'#fff'},fmt(p.weight)+' kg',chart);node('text',{x,y:843,'text-anchor':'middle','font-size':18,fill:'#b7c9d3'},(p.isBaseline?'Início':dateBR(p.date).slice(0,5)),chart)});
 }else node('text',{x:430,y:700,'text-anchor':'middle','font-size':27,fill:'#fff'},'Sem pesagens neste período',chart);
 const first=initial||source[0];
 const last=source.at(-1);
 document.getElementById('statInitial').textContent=first?fmt(first.weight)+' kg':'—';
 document.getElementById('statCurrent').textContent=last?fmt(last.weight)+' kg':'—';
 const delta=first&&last?Number(last.weight)-Number(first.weight):null;
 document.getElementById('statDiff').textContent=delta===null?'—':(delta>0?'+':'')+fmt(delta).replace('-','−')+' kg';
 document.getElementById('countLabel').textContent=rows.length+' registros';
 const hist=document.getElementById('historyRows');hist.replaceChildren();
 rows.slice(-5).reverse().forEach((p,i)=>{const y=1158+i*34;node('text',{x:70,y,fill:'#d9e8ee','font-size':20},dateBR(p.date)+' · '+(p.source||'Pop Fit')+(p.unit?' · '+(p.unit==='gym'?'Gym Pop':'Bike Pop'):''),hist);node('text',{x:795,y,'text-anchor':'end',fill:'#fff','font-size':23,'font-weight':800},fmt(p.weight)+' kg',hist)});
}
document.querySelectorAll('[data-period]').forEach(btn=>btn.onclick=()=>{active=btn.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===btn));draw()});
let photoReady=Promise.resolve();
async function load(){try{
 const token=sessionStorage.getItem('clubpop_token');if(!token)throw Error('Sessão indisponível');
 const [wr,pr]=await Promise.all([fetch('/api/auth?route=pop-fit&scope=club&action=weight-history',{headers:{Authorization:'Bearer '+token},cache:'no-store'}),fetch('/api/auth?route=profile-photo',{headers:{Authorization:'Bearer '+token},cache:'no-store'})]);
 const data=await wr.json();if(!wr.ok||!data.ok)throw Error(data.error||'Falha na consulta');
 all=(data.points||[]).filter(p=>Number.isFinite(Number(p.weight))&&Number(p.weight)>0);draw();
 if(pr.ok){const photo=await pr.json();if(photo.photoUrl){photoReady=(async()=>{const response=await fetch(photo.photoUrl,{credentials:'same-origin'});if(!response.ok)throw Error('Foto indisponível');const blob=await response.blob();const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Falha ao incorporar foto'));reader.readAsDataURL(blob)});document.querySelector('#poster image.photo').setAttribute('href',dataUrl)})();await photoReady}}
 }catch(e){document.getElementById('periodLabel').textContent='Não foi possível carregar o histórico';draw()}}
load();styleStory();
async function png(){await photoReady;const svg=document.getElementById('poster');const clone=svg.cloneNode(true);const photo=clone.querySelector('image.photo');if(photo){photo.setAttribute('clip-path','url(#photoClip)');photo.setAttribute('style','clip-path:url(#photoClip)')}const xml=new XMLSerializer().serializeToString(clone);const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;canvas.getContext('2d').drawImage(img,0,0,1080,1920);return await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('Falha ao exportar')),'image/png'))}finally{URL.revokeObjectURL(url)}}function download(blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='popfit-evolucao.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}document.getElementById('save').onclick=async()=>{try{download(await png())}catch(e){alert('Não foi possível salvar neste navegador: '+e.message)}};document.getElementById('share').onclick=async()=>{try{let blob=await png();let file=new File([blob],'popfit-evolucao.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Minha evolução · Pop Fit'});else download(blob)}catch(e){if(e.name!=='AbortError')alert('Compartilhamento indisponível: '+e.message)}};
</script></body></html>
