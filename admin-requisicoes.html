<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Requisições</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui}.ey{font-size:11px;color:#777;font-weight:900}h1{margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.block{background:#fff;border:1px solid #e2e6ea;border-radius:18px}.stat{padding:18px}.stat small{font-size:10px;color:#777}.stat strong{display:block;font-size:24px;margin-top:7px}.block{padding:20px;margin:14px 0}.row{display:grid;grid-template-columns:1.3fr .8fr 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.row b{font-size:13px}.row small{display:block;color:#777;margin-top:3px}.btn{border:0;background:#111;color:#fff;border-radius:10px;padding:11px 13px;font-weight:900}.muted{font-size:11px;color:#777}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.row .btn{width:100%}}</style></head><body><main><div class="ey">CONTROLE DE CONSUMO EVO</div><h1>Requisições</h1><section class="stats"><div class="stat"><small>MODELO</small><strong>Manual</strong></div><div class="stat"><small>UNIDADES</small><strong>2</strong></div><div class="stat"><small>CACHE LOCAL</small><strong>Ativo</strong></div><div class="stat"><small>CHAMADAS AO ABRIR TELAS</small><strong>0</strong></div></section><section class="block"><h2>Atualizações disponíveis</h2><p class="muted">O sistema usa o último cache salvo. Só faça uma nova requisição quando precisar atualizar a informação.</p><div id="rows"></div></section></main><script src="/admin-common.js"></script><script>
let D={};const kinds=[["Atividades / modalidades","activities","Usadas para validar missões e promoções"],["Alunos","members","Cadastros vinculáveis ao CLUB POP"],["Contratos / planos","contracts","Elegibilidade de promoções e campanhas"],["Presenças","attendance","Consultadas por aluno durante a validação"]];async function load(){D=await(await fetch("/api/content",{cache:"no-store"})).json();D.evoCache??={activities:{bike:[],gym:[]},contracts:{bike:[],gym:[]},members:{bike:[],gym:[]},syncLog:[]};D.evoCache.contracts??={bike:[],gym:[]};D.evoCache.members??={bike:[],gym:[]};render()}function render(){rows.innerHTML=["bike","gym"].flatMap(u=>kinds.map(([n,k,d])=>{const last=(D.evoCache.syncLog||[]).filter(x=>x.unit===u&&x.kind===k).at(-1);return '<div class="row"><div><b>'+n+'</b><small>'+d+'</small></div><b>'+(u==="bike"?"BIKE POP":"GYM POP")+'</b><span class="muted">'+(last?new Date(last.at).toLocaleString("pt-BR"):"Nunca atualizado")+'</span><button class="btn" onclick="sync(\''+u+'\',\''+k+'\')">Atualizar</button></div>'})).join("")}window.sync=async(u,k)=>{if(u==="gym")return cpNotify("error","Gym Pop protegido","Durante os testes, as requisições EVO serão feitas somente no Bike Pop.");if(k==="attendance")return cpNotify("error","Presenças por aluno","As presenças são consultadas por aluno/período durante a validação da promoção.");const btn=event?.target;if(btn)cpBusy(btn,true,"ATUALIZANDO...");try{const r=await fetch("/api/evo-admin?unit="+u+"&kind="+k,{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error([d.error,d.detail].filter(Boolean).join(" • "));let items=d.items||[];if(k==="activities")items=items.map(x=>({id:x.idActivity||x.idActivitie||x.id||null,name:x.name||x.activityName||x.description||x.nome||String(x)}));if(k==="contracts")items=items.map(x=>({id:x.idMembership||x.idMembershipPlan||x.id||null,name:x.nameMembership||x.displayName||x.name||x.membershipName||x.description||x.nome||String(x),inactive:!!x.inactive}));D.evoCache[k]??={bike:[],gym:[]};D.evoCache[k][u]=items;D.evoCache.syncLog??=[];D.evoCache.syncLog.push({unit:u,kind:k,at:new Date().toISOString(),count:items.length});const w=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(D)});if(!w.ok)throw Error(await cpErrorDetail(w));render();cpNotify("success","Requisição concluída",items.length+" registro(s) atualizados no cache Bike Pop.")}catch(e){cpNotify("error","Falha na requisição",e.message)}finally{if(btn)cpBusy(btn,false)}};load().catch(e=>cpNotify("error","Erro ao abrir Requisições",e.message));
</script></body></html>
