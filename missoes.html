<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Missões</title><style>
:root{--b:#111318;--bg:#f4f6f8;--blue:#00a9e8;--line:#e8ebef;--m:#747b86}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--b)}.shell{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px}.top{padding:23px 20px}.brand{font-weight:950;font-size:22px}.brand span{color:var(--blue)}.tag{font-size:10px;color:var(--m)}main{padding:0 18px}h1{font-size:28px;margin:6px 0}.sub{color:var(--m);font-size:12px}.card{border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:15px}.ey{font-size:9px;color:var(--blue);font-weight:900}.card h2{font-size:18px;margin:6px 0}.progress{height:12px;background:#edf0f3;border-radius:99px;margin:22px 0 8px;position:relative}.bar{height:100%;background:var(--blue);border-radius:99px}.bubble{position:absolute;top:-31px;background:#111;color:#fff;padding:5px 8px;border-radius:8px;font-size:9px;font-weight:900;transform:translateX(-50%)}.marks{display:flex;justify-content:space-between;font-size:9px;font-weight:900}.tier{background:#f5f7f9;border-radius:14px;padding:13px;margin-top:10px}.tier.premium{background:#111;color:#fff}.tier small{font-size:9px;font-weight:900}.tier b{display:block;margin-top:5px;font-size:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;font-size:10px;color:#888;font-weight:700}.nav b{display:block;font-size:19px}.nav .active{color:var(--blue)}
</style></head><body><div class="shell"><header class="top"><div class="brand">CLUB <span>POP</span></div><div class="tag">Benefícios exclusivos para alunos Pop</div></header><main><h1>Missões</h1><div class="sub">Treine, avance e desbloqueie recompensas.</div><div id="missions"></div></main><nav class="nav"><button onclick="location.href='/'"><b>⌂</b>Início</button><button class="active"><b>★</b>Missões</button><button onclick="location.href='/beneficios.html'"><b>◇</b>Benefícios</button><button onclick="location.href='/loja.html'"><b>▣</b>Loja</button><button onclick="sessionStorage.clear();location.href='/'"><b>○</b>Sair</button></nav></div><script>
const u=(()=>{try{return JSON.parse(sessionStorage.getItem("clubpop")||"null")}catch{return null}})();if(!u)location.href="/";
(async()=>{const d=await (await fetch("/api/content",{cache:"no-store"})).json(),m=d.missions||{},n=Number(u.attendanceCount||0);let h="";
if(m.presence?.active){const x=m.presence,p=Math.min(100,n/Number(x.maxGoal||12)*100);h+=`<section class="card"><div class="ey">MISSÃO PRESENÇA</div><h2>${x.title}</h2><div class="sub">Seu progresso acompanha as presenças confirmadas.</div><div class="progress"><i class="bar" style="display:block;width:${p}%"></i><span class="bubble" style="left:${Math.max(8,p)}%">${n} presenças</span></div><div class="marks"><span>★ ${x.firstMilestone} AULAS</span><span>★ ${x.maxGoal} AULAS</span></div><div class="tier"><small>PRÊMIOS • ${x.firstMilestone} AULAS</small><b>${x.rewards8.join(" · ")}</b></div><div class="tier premium"><small>PRÊMIOS PREMIUM • ${x.maxGoal} AULAS</small><b>${x.rewards12.join(" · ")}</b></div></section>`}
if(m.consistency?.active){const x=m.consistency,w=Number(u.currentWeek?.distinctDays||0),p=Math.min(100,w/Number(x.daysPerWeek||3)*100);h+=`<section class="card"><div class="ey">MISSÃO CONSTÂNCIA</div><h2>${x.title}</h2><div class="sub">Faça aulas em ${x.daysPerWeek} dias diferentes por semana durante ${x.weeks} semanas.</div><div class="progress"><i class="bar" style="display:block;width:${p}%"></i><span class="bubble" style="left:${Math.max(8,p)}%">${w}/${x.daysPerWeek} dias</span></div><div class="tier"><small>PRÊMIO DE CONCLUSÃO</small><b>${x.rewards.join(" · ")}</b></div></section>`}document.getElementById("missions").innerHTML=h})()
</script></body></html>
