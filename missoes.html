<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Desafios</title><style>:root{--b:#111318;--bg:#f4f6f8;--blue:#08a9e3;--m:#747b86;--line:#e5e9ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--b)}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:22px 18px 95px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--blue)}h1{font-size:29px;margin:25px 0 3px}.sub{font-size:12px;color:var(--m)}.card{margin-top:16px;border:1px solid var(--line);border-radius:22px;padding:18px}.empty-card{text-align:center;padding:38px 22px}.empty-card .empty-icon{width:48px;height:48px;border-radius:50%;background:#f1f4f6;display:grid;place-items:center;margin:0 auto 13px;font-size:20px}.empty-card h2{margin:0 0 7px}.empty-card p{margin:0;color:var(--m);font-size:11px;line-height:1.5}.dark{background:#111318;color:#fff}.pill{font-size:8px;font-weight:900;color:var(--blue)}h2{font-size:18px;margin:7px 0}.desc{font-size:11px;color:#8a929c}.dark .desc{color:#b8c0c9}.bar{height:9px;background:#e9edf0;border-radius:99px;margin:17px 0 7px;overflow:hidden}.dark .bar{background:#30343a}.bar i{display:block;height:100%;background:linear-gradient(90deg,#08a9e3,#35d09a)}.row{display:flex;justify-content:space-between;align-items:center;font-size:10px}.reward{margin-top:12px;border-radius:13px;padding:12px;background:#f4f7f9;font-size:10px}.dark .reward{background:#ffffff10}.action{width:100%;border:0;border-radius:13px;padding:13px;margin-top:12px;font-weight:900;font-size:10px;background:var(--blue);color:#fff}.action.lock{background:#e9ecef;color:#8a929b}.days{display:flex;gap:6px;margin:13px 0}.day{width:32px;height:32px;border-radius:50%;background:#eef1f3;display:grid;place-items:center;font-size:8px;font-weight:900}.day.on{background:#111;color:#fff}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(436px,calc(100% - 24px));height:70px;border:1px solid var(--line);border-radius:22px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 30px #1112}.nav button{border:0;background:none;font-size:9px;color:#777}.nav .active{color:var(--blue);font-weight:900}.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:0 12px 10px;z-index:50;background:linear-gradient(transparent,#f4f6f8 35%)}.nav.modern{position:static;transform:none;width:100%;height:72px;min-height:72px;max-height:72px;background:#fff;border:1px solid #e5e9ee;border-radius:22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;box-shadow:0 10px 30px #1112;padding:6px}.nav.modern button{height:58px;min-width:0;padding:0 2px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8b929b;font-size:9px;font-weight:800;border-radius:16px;position:relative}.nav.modern svg{width:21px;height:21px;min-width:21px;min-height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav.modern span{display:block;line-height:11px;white-space:nowrap}.nav.modern .active{color:#078fcb;background:#eaf8fe}.nav.modern .active:after{content:"";position:absolute;bottom:4px;width:16px;height:3px;border-radius:9px;background:#08a9e3}.navwrap{padding:0 10px 10px!important}.nav.modern{height:84px!important;min-height:84px!important;max-height:84px!important;border-radius:24px!important;padding:6px!important}.nav.modern button{height:70px!important;font-size:11px!important;gap:5px!important;border-radius:18px!important}.nav.modern svg{width:25px!important;height:25px!important;min-width:25px!important;min-height:25px!important}.nav.modern span{font-size:11px!important;line-height:13px!important}.nav.modern .active:after{bottom:3px!important;width:20px!important;height:3px!important} .tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f2f4;border-radius:14px;padding:4px;margin:18px 0 4px}.tabs button{border:0;background:transparent;border-radius:11px;padding:11px;font-weight:900;font-size:11px;color:#747b86}.tabs button.on{background:#fff;color:#111;box-shadow:0 2px 8px #1111}.tabpane{display:none}.tabpane.on{display:block}.promo-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.promo-card .meta span{background:#eef8fc;color:#0875d1;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:900}.rulebox{margin-top:13px;border-top:1px solid var(--line);padding-top:13px}.rulebox h3{font-size:12px;margin:0 0 7px}.rulebox p{white-space:pre-line;font-size:10px;color:#69717b;line-height:1.6;margin:0}.milestones{display:grid;gap:7px;margin-top:12px}.milestone{background:#f5f7f9;border-radius:11px;padding:10px;font-size:10px;display:flex;justify-content:space-between}.promo-banner{width:100%;border-radius:14px;margin-bottom:12px;display:block} </style></head><body><div class="app"><div class="brand">CLUB <span>POP</span></div><h1>Desafios</h1><div class="sub">Missões, promoções e recompensas do Club Pop.</div><div class="tabs"><button class="on" data-tab="missions">MISSÕES</button><button data-tab="promos">PROMOÇÕES</button></div><div class="tabpane on" id="missionsPane"><div id="cards"></div></div><div class="tabpane" id="promosPane"><div id="promoCards"></div></div></div><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox='0 0 24 24'><path d='M3 10.5 12 3l9 7.5'/><path d='M5 9.5V21h14V9.5'/><path d='M9 21v-7h6v7'/></svg><span>Início</span></button><button class="active" onclick="location.href='/missoes.html'"><svg viewBox='0 0 24 24'><path d='m12 3 2.1 4.3 4.8.7-3.5 3.4.8 4.8L12 14l-4.2 2.2.8-4.8L5.1 8l4.8-.7L12 3Z'/><path d='M7 20h10'/></svg><span>Desafios</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox='0 0 24 24'><path d='M20 12v8H4v-8'/><path d='M2 7h20v5H2z'/><path d='M12 7v13'/><path d='M12 7H7.5A2.5 2.5 0 1 1 10 4.5L12 7Zm0 0h4.5A2.5 2.5 0 1 0 14 4.5L12 7Z'/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox='0 0 24 24'><path d='M6 8h12l1 13H5L6 8Z'/><path d='M9 10V6a3 3 0 0 1 6 0v4'/></svg><span>Loja</span></button><button onclick="location.href='/perfil.html'"><svg viewBox='0 0 24 24'><circle cx='12' cy='8' r='4'/><path d='M4.5 21a7.5 7.5 0 0 1 15 0'/></svg><span>Perfil</span></button></nav></div><script>const AUTH_API="/api/auth?route=";
async function authFetch(path,opts={}){const token=sessionStorage.getItem("clubpop_token");if(!token)throw new Error("SEM_SESSAO");const r=await fetch(AUTH_API+encodeURIComponent(path.replace(/^\/auth\//,"")),{...opts,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||"SESSAO_INVALIDA");return d}
async function getClubUser(){await authFetch("/auth/me");try{return JSON.parse(sessionStorage.getItem("clubpop")||"null")}catch{return null}}
async function requireClubUser(){try{const u=await getClubUser();if(!u)location.replace("/");return u}catch{sessionStorage.removeItem("clubpop_token");sessionStorage.removeItem("clubpop");location.replace("/");return null}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("on"));document.getElementById(b.dataset.tab==="missions"?"missionsPane":"promosPane").classList.add("on")});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const fmt=v=>{if(!v)return "—";const [y,m,d]=v.split("-");return d+"/"+m+"/"+y};
(async()=>{const u=await requireClubUser();if(!u)return;async function go(){const c=await(await fetch("/api/content",{cache:"no-store"})).json(),m=c.missions||{},n=Number(u.attendanceCount||0),g=Number(m.presence?.maxGoal||12),f=Number(m.presence?.firstMilestone||8),d=Number(m.consistency?.daysPerWeek||3),w=Number(u.currentWeek?.distinctDays||0);const activePresence=m.presence?.active===true,activeConsistency=m.consistency?.active===true;const promos=(c.promotions||[]).filter(p=>p.status==="Ativo");promoCards.innerHTML=promos.length?promos.map(p=>{const unit=p.unit==="gym"?"GYM POP":p.unit==="club"?"CLUB POP":"BIKE POP",ms=p.milestones||[],reset=p.reset==="monthly"?"Metas reiniciam mensalmente":"Válida durante toda a campanha";return `<section class="card promo-card">${p.bannerUrl?`<img class="promo-banner" src="${esc(p.bannerUrl)}" alt="">`:""}<span class="pill">PROMOÇÃO ATIVA • ${unit}</span><h2>${esc(p.name)}</h2><div class="desc">${esc(p.dashboardText||"")}</div><div class="meta"><span>${fmt(p.start)} a ${fmt(p.end)}</span><span>${Number(p.numbersPerAttendance||0)} por presença</span><span>${reset}</span></div>${ms.length?`<div class="milestones">${ms.map(x=>`<div class="milestone"><b>${Number(x.attendance||0)} presenças</b><span>+${Number(x.bonus||0)} bônus</span></div>`).join("")}</div>`:""}<div class="rulebox"><h3>Regras da promoção</h3><p>${esc(p.rules||"As regras completas desta promoção ainda não foram informadas.")}</p></div></section>`}).join(""):`<section class="card empty-card"><div class="empty-icon">★</div><h2>Em breve teremos novas promoções...</h2><p>Continue acompanhando o Club Pop. Novas oportunidades e benefícios aparecerão por aqui.</p></section>`;if(!activePresence&&!activeConsistency){document.querySelector("#cards").innerHTML=`<section class="card empty-card"><div class="empty-icon">★</div><h2>Em breve teremos novas missões...</h2><p>Continue treinando. Novos desafios e recompensas aparecerão por aqui.</p></section>`;return}let unlocked=n>=g?"Massagem • 15 minutos ou 1 Aula Avulsa":n>=f?"Massagem • 10 minutos ou Bioimpedância":"Continue treinando para desbloquear sua recompensa.";document.querySelector("#cards").innerHTML=`${activePresence?`<section class="card dark"><span class="pill">MISSÃO PRESENÇA</span><h2>${m.presence?.title||"Missão Frequência"}</h2><div class="desc">Cada presença confirmada conta para seu progresso.</div><div class="bar"><i style="width:${Math.min(100,n/g*100)}%"></i></div><div class="row"><b>${n} presenças</b><span>8 • 12</span></div><div class="reward">🎁 ${unlocked}</div><button class="action ${n>=f?"":"lock"}">${n>=f?"RESGATAR RECOMPENSA AGORA →":"RECOMPENSA AINDA BLOQUEADA"}</button></section>`:""}${activeConsistency?`<section class="card"><span class="pill">MISSÃO DE CONSTÂNCIA</span><h2>3 dias diferentes na semana</h2><div class="desc">Duas aulas no mesmo dia contam como duas presenças na Missão Presença, mas apenas um dia aqui.</div><div class="days">${["S","T","Q","Q","S","S","D"].map((z,i)=>`<span class="day ${i<w?"on":""}">${z}</span>`).join("")}</div><div class="bar"><i style="width:${Math.min(100,w/d*100)}%"></i></div><div class="row"><b>${Math.min(w,d)}/${d} dias</b><span>${w<d?"Falta "+(d-w)+" dia(s)":"Meta semanal atingida ✓"}</span></div><button class="action ${w>=d?"":"lock"}">${w>=d?"META DA SEMANA CONCLUÍDA ✓":"RECOMPENSA AINDA BLOQUEADA"}</button></section>`:""}`};await go()})()</script></body></html>
