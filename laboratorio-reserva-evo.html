<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratório EVO • Reserva</title><style>body{font:15px system-ui;background:#f5f3f8;color:#241c30;margin:0;padding:18px}main{max-width:540px;margin:auto}section{background:white;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 3px 14px #0001}label{display:block;margin:12px 0 5px}input,select,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #ddd;font:inherit}button{background:#7134a0;color:white;border:0;font-weight:700;margin-top:12px}button:disabled{opacity:.45}small{color:#666}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f3f3f3;padding:12px;border-radius:8px}h1{font-size:23px}#status{font-weight:700}</style><main><h1>🧪 Laboratório de reserva EVO</h1><p>Área isolada • Bike Pop. Apenas o botão final cria uma reserva real.</p><section><label>ID EVO do seu perfil</label><input id="member" inputmode="numeric" placeholder="ID do Renato na EVO"><button id="profile">Consultar cadastro (1 requisição)</button><label>Dia da aula</label><input id="date" type="date"><button id="schedule">Consultar grade (1 requisição)</button><label>Aula / horário</label><select id="class"><option value="">Consulte a grade primeiro</option></select><button id="detail">Consultar vagas (1 requisição)</button><label>Bicicleta disponível</label><select id="spot"><option value="">Consulte as vagas primeiro</option></select></section><section><strong>Confirmação real</strong><p><small>Uma reserva pode comprometer ou consumir crédito. Confira os dados antes de confirmar.</small></p><label><input type="checkbox" id="confirm" style="width:auto"> Autorizo criar uma reserva real na EVO</label><button id="book" disabled>Confirmar reserva real (1 requisição)</button></section><section><strong>Requisições EVO nesta sessão: <span id="count">0</span></strong><p id="status">Aguardando consulta</p><pre id="log">Nenhuma chamada realizada.</pre></section></main><script>const $=id=>document.getElementById(id);let n=0,classes=[],detail=null;const api='/api/evo-admin?unit=bike&kind=booking_lab';function report(data){n+=data.requestCount||0;$('count').textContent=n;$('status').textContent=data.ok?'Consulta concluída':'Erro / resposta da EVO';$('log').textContent=JSON.stringify(data,null,2).slice(0,5500)}async function call(action,body){try{let u=api+'&action='+action;let opts={credentials:'same-origin',cache:'no-store'};if(body){opts.method='POST';opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify({action,...body})}else{let raw=$('date').value;let normalized=/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw:/^\d{2}\/\d{2}\/\d{4}$/.test(raw)?raw.split('/').reverse().join('-'):raw;let p=new URLSearchParams({date:normalized,idMember:$('member').value,idActivitySession:$('class').value});u+='&'+p}const r=await fetch(u,opts),data=await r.json();report(data);return data}catch(e){report({ok:false,error:String(e)});return null}}$('profile').onclick=()=>call('member');$('schedule').onclick=async()=>{const d=await call('schedule');classes=d?.items||[];$('class').innerHTML='<option value="">Selecione uma aula</option>'+classes.map((x,i)=>'<option value="'+(x.idActivitySession||'')+'" data-i="'+i+'">'+String(x.startTime||'')+' — '+String(x.name||'Aula')+'</option>').join('');detail=null;$('spot').innerHTML='<option>Consulte as vagas</option>'};$('detail').onclick=async()=>{const d=await call('detail');detail=d?.session||null;$('spot').innerHTML='<option value="">Selecione a bike</option>'+(detail?.spots||[]).filter(x=>x.available).map(x=>'<option value="'+Number(x.number)+'">Bike '+Number(x.number)+'</option>').join('');};$('confirm').onchange=()=>{$('book').disabled=!$('confirm').checked};$('book').onclick=async()=>{const selected=classes.find(x=>String(x.idActivitySession)===String($('class').value));const idMember=Number($('member').value),slotNumber=Number($('spot').value);if(!selected||!detail||!slotNumber||!idMember||!selected.idConfiguration){alert('Consulte a grade e as vagas; verifique o ID EVO e a configuração da aula.');return}const activityDate=String(selected.activityDate||detail.date||$('date').value).slice(0,10);if(!confirm('CRIAR RESERVA REAL na EVO?\nAluno: '+idMember+'\nAula: '+selected.name+'\nDia: '+activityDate+'\nBike: '+slotNumber))return;$('book').disabled=true;await call('enroll',{idMember,idConfiguration:Number(selected.idConfiguration),activityDate,slotNumber,confirm:true})};</script></html>
