<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Transações</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,Arial;background:#f4f6f8;margin:0;color:#101217}main{max-width:1180px;margin:auto;padding:28px 20px 70px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#168ed1}.top h1{font-size:34px;margin:5px 0}.top p{margin:0;color:#747b85}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card{background:#fff;border:1px solid #e2e5e8;border-radius:18px;padding:18px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#168ed1}.card.credit:before{background:#22a45a}.card.debit:before{background:#db4a4a}.card.pending:before{background:#e5ad20}.card small{font-size:10px;font-weight:900;color:#777}.card b{display:block;font-size:28px;margin-top:5px}.filters{background:#fff;border:1px solid #e2e5e8;border-radius:18px;padding:14px;display:grid;grid-template-columns:1.7fr repeat(3,1fr);gap:9px;margin-bottom:14px}input,select{width:100%;border:1px solid #dfe3e7;background:#fafbfc;border-radius:11px;padding:12px;font:inherit}.box{background:#fff;border:1px solid #e2e5e8;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:145px minmax(130px,1.15fr) minmax(180px,1.5fr) 100px 125px 100px;gap:10px;padding:13px 16px;border-top:1px solid #edf0f2;font-size:11px;align-items:center}.row:first-child{border-top:0}.head{font-weight:900;background:#f7f8f9;color:#606873;font-size:10px}.plus{color:#14884a;font-weight:900}.minus{color:#c43d3d;font-weight:900}.empty{padding:28px;text-align:center;color:#777}.row span{min-width:0;overflow-wrap:anywhere}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.box{overflow-x:auto}.row{min-width:780px}}@media(max-width:600px){main{padding:20px 12px 60px}.top h1{font-size:28px}.cards{gap:7px}.card{padding:14px 11px}.card b{font-size:23px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}}</style></head><body><main><div class="top"><div><div class="eyebrow">RECEPÇÃO • CLUB POP</div><h1>Transações</h1><p>Movimentações de Fitcoins, resgates e estornos em um só lugar.</p></div></div><div class="cards"><div class="card"><small>TRANSAÇÕES</small><b id="n">0</b></div><div class="card credit"><small>CRÉDITOS FC</small><b id="cr">0</b></div><div class="card debit"><small>DÉBITOS FC</small><b id="db">0</b></div><div class="card pending"><small>PENDENTES</small><b id="pd">0</b></div></div><div class="filters"><input id="q" placeholder="Buscar aluno, item ou referência"><select id="form"><option value="">Todas as formas</option><option>FITCOINS</option><option>DINHEIRO</option></select><select id="origin"><option value="">Todas as origens</option><option value="store">Loja</option><option value="refund">Estorno</option><option value="mission">Missão</option><option value="promotion">Promoção</option></select><select id="status"><option value="">Todos os status</option><option>COMPLETED</option><option>PENDING</option></select></div><div class="box"><div class="row head"><span>DATA</span><span>ALUNO</span><span>DESCRIÇÃO</span><span>ORIGEM</span><span>FORMA / VALOR</span><span>STATUS</span></div><div id="rows"></div></div></main><script src="/admin-common.js"></script><script>let A=[];const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const scope=()=>window.cpAdminScope?.get?.()||"club";function render(){const B=scope()==="club"?A:A.filter(x=>String(x.unit||"bike").toLowerCase()===scope()||String(x.unit||"").toLowerCase()==="club");let z=B.filter(x=>(!q.value||JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()))&&(!form.value||x.paymentMethod===form.value)&&(!origin.value||x.origin===origin.value)&&(!status.value||x.status===status.value));rows.innerHTML=z.map(x=>'<div class="row"><span>'+new Date(x.createdAt).toLocaleString("pt-BR")+'</span><span>'+E(x.memberName||x.memberId)+'</span><span>'+E(x.description)+'</span><span>'+E(x.origin)+'</span><span class="'+(x.direction==="credit"?"plus":"minus")+'">'+(x.direction==="credit"?"+":"−")+(x.fitcoins||0)+' FC</span><span>'+E(x.status)+'</span></div>').join("")||'<div class="empty">Nenhuma transação encontrada.</div>';n.textContent=B.length;cr.textContent=B.filter(x=>x.direction==="credit").reduce((a,x)=>a+Number(x.fitcoins||0),0)+" FC";db.textContent=B.filter(x=>x.direction==="debit").reduce((a,x)=>a+Number(x.fitcoins||0),0)+" FC";pd.textContent=B.filter(x=>x.status==="PENDING").length}document.querySelectorAll("input,select").forEach(x=>x.oninput=render);fetch("/api/redemption?route=admin").then(r=>r.json()).then(d=>{A=d.transactions||[];render()})</script></body></html>
