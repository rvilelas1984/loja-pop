<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Transações</title><link rel="stylesheet" href="/admin-common.css"><style>body{font-family:Inter,system-ui;background:#f4f6f8;margin:0;color:#111}main{max-width:1300px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.card,.box{background:#fff;border:1px solid #e3e7ea;border-radius:18px;padding:16px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:12px}input,select,button{padding:11px;border:1px solid #ddd;border-radius:10px}.row{display:grid;grid-template-columns:140px 1.2fr 1.5fr 110px 130px 110px;gap:10px;padding:13px;border-top:1px solid #eee;font-size:11px}.head{font-weight:900;background:#f7f8f9}.plus{color:#14884a;font-weight:900}.minus{color:#c43d3d;font-weight:900}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.box{overflow:auto}.row{min-width:850px}}</style></head><body><main><div class="top"><div><small>CLUB POP • ADMIN</small><h1>Transações</h1></div><button onclick="location.href='/admin.html'">Voltar</button></div><div class="cards"><div class="card">TRANSAÇÕES<br><b id="n">0</b></div><div class="card">CRÉDITOS FC<br><b id="cr">0</b></div><div class="card">DÉBITOS FC<br><b id="db">0</b></div><div class="card">PENDENTES<br><b id="pd">0</b></div></div><div class="filters"><input id="q" placeholder="Buscar aluno, item ou referência"><select id="form"><option value="">Todas as formas</option><option>FITCOINS</option><option>DINHEIRO</option></select><select id="origin"><option value="">Todas as origens</option><option value="store">Loja</option><option value="refund">Estorno</option><option value="mission">Missão</option><option value="promotion">Promoção</option></select><select id="status"><option value="">Todos os status</option><option>COMPLETED</option><option>PENDING</option></select></div><div class="box"><div class="row head"><span>DATA</span><span>ALUNO</span><span>DESCRIÇÃO</span><span>ORIGEM</span><span>FORMA / VALOR</span><span>STATUS</span></div><div id="rows"></div></div></main><script src="/admin-common.js"></script><script>let A=[];const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const scope=()=>window.cpAdminScope?.get?.()||"club";function render(){const B=scope()==="club"?A:A.filter(x=>String(x.unit||"club").toLowerCase()===scope()||String(x.unit||"").toLowerCase()==="club");let z=B.filter(x=>(!q.value||JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()))&&(!form.value||x.paymentMethod===form.value)&&(!origin.value||x.origin===origin.value)&&(!status.value||x.status===status.value));rows.innerHTML=z.map(x=>'<div class="row"><span>'+new Date(x.createdAt).toLocaleString("pt-BR")+'</span><span>'+E(x.memberName||x.memberId)+'</span><span>'+E(x.description)+'</span><span>'+E(x.origin)+'</span><span class="'+(x.direction==="credit"?"plus":"minus")+'">'+(x.direction==="credit"?"+":"−")+(x.fitcoins||0)+' FC</span><span>'+E(x.status)+'</span></div>').join("")||'<p>Nenhuma transação.</p>';n.textContent=B.length;cr.textContent=B.filter(x=>x.direction==="credit").reduce((a,x)=>a+Number(x.fitcoins||0),0)+" FC";db.textContent=B.filter(x=>x.direction==="debit").reduce((a,x)=>a+Number(x.fitcoins||0),0)+" FC";pd.textContent=B.filter(x=>x.status==="PENDING").length}document.querySelectorAll("input,select").forEach(x=>x.oninput=render);fetch("/api/redemption?route=admin").then(r=>r.json()).then(d=>{A=d.transactions||[];render()})</script></body></html>
