function cpCancelSaleDialog(){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;background:#0009;z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px';overlay.innerHTML='<div role="dialog" aria-modal="true" style="background:white;color:#17212b;border-radius:18px;padding:24px;width:min(440px,100%);box-shadow:0 12px 40px #0005"><h3 style="margin:0 0 12px">Cancelar venda</h3><p>Confirme somente após o estorno dos Fitcoins. Esta ação não realiza novo estorno.</p><label for="cpCancelReason">Motivo do cancelamento</label><textarea id="cpCancelReason" style="box-sizing:border-box;width:100%;min-height:85px;margin:10px 0;border:1px solid #aaa;border-radius:8px;padding:10px" placeholder="Informe o motivo (mínimo 8 caracteres)"></textarea><p id="cpCancelError" style="color:#b42318;display:none">Informe pelo menos 8 caracteres.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" id="cpCancelBack">Voltar</button><button type="button" id="cpCancelOk" style="background:#bb2639;color:white">Confirmar cancelamento</button></div></div>';document.body.appendChild(overlay);const close=value=>{overlay.remove();resolve(value)};overlay.querySelector('#cpCancelBack').onclick=()=>close(null);overlay.querySelector('#cpCancelOk').onclick=()=>{const reason=overlay.querySelector('#cpCancelReason').value.trim();if(reason.length<8){overlay.querySelector('#cpCancelError').style.display='block';return}close(reason)};overlay.querySelector('#cpCancelReason').focus()})}
async function fiscalSale(id){if(pixActionBusy)return;if(!confirm("Confirmar que a venda já foi lançada no sistema fiscal?"))return;pixActionBusy=true;try{const r=await fetch("/api/redemption?route=fiscal-sale",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId:id})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Erro ao registrar");cpNotify("success","Controle fiscal","Venda lançada.");await loadPix()}catch(e){cpNotify("error","Controle fiscal",e.message)}finally{pixActionBusy=false}}
