<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Resgates</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui}.ey{font-size:10px;color:#777;font-weight:900}h1{margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e2e6ea;border-radius:18px;padding:18px}.card strong{display:block;font-size:25px;margin-top:7px}.row{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.row small{display:block;color:#777;margin-top:4px}.pill{padding:6px 9px;border-radius:99px;background:#fff5d9;font-size:9px;font-weight:900}.btn{border:0;background:#111;color:#fff;border-radius:9px;padding:10px;font-weight:900}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}</style></head><body><main><div class="ey">OPERAÇÃO</div><h1>Resgates</h1><section class="stats"><div class="card"><span class="ey">AGUARDANDO</span><strong id="pending">0</strong></div><div class="card"><span class="ey">ENTREGUES</span><strong id="done">0</strong></div><div class="card"><span class="ey">FITCOINS</span><strong id="coins">0</strong></div><div class="card"><span class="ey">TOTAL</span><strong id="total">0</strong></div></section><section class="panel"><h2>Histórico e entregas</h2><div id="rows"></div></section></main><script src="/admin-common.js"></script><script>
let D={};const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){D=await(await fetch("/api/content",{cache:"no-store"})).json();D.redemptions??=[];render()}async function put(){const r=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error(await cpErrorDetail(r))}function render(){const a=D.redemptions;$("pending").textContent=a.filter(x=>x.status==="AGUARDANDO_ENTREGA"||x.status==="AGUARDANDO_UTILIZACAO").length;$("done").textContent=a.filter(x=>["ENTREGUE","UTILIZADO"].includes(x.status)).length;$("coins").textContent=a.reduce((n,x)=>n+Number(x.fitcoins||0),0);$("total").textContent=a.length;$("rows").innerHTML=a.length?a.slice().reverse().map(x=>'<div class="row"><div><b>'+esc(x.title)+'</b><small>'+esc(x.memberName||"Aluno")+' • '+new Date(x.createdAt).toLocaleString("pt-BR")+' • '+esc(x.receipt||"")+'</small></div><b>'+Number(x.fitcoins||0)+' Fitcoins</b><span class="pill">'+esc(x.status)+'</span>'+(x.status.startsWith("AGUARDANDO")?'<button class="btn" onclick="deliver(\''+x.id+'\')">'+(x.sourceType==="service"?"CONFIRMAR USO":"CONFIRMAR ENTREGA")+'</button>':"<span></span>")+'</div>').join(""):"<p>Nenhum resgate registrado.</p>"}window.deliver=async id=>{const x=D.redemptions.find(r=>r.id===id),old=x.status;x.status=x.sourceType==="service"?"UTILIZADO":"ENTREGUE";x.handledAt=new Date().toISOString();try{await put();render();cpNotify("success","Resgate atualizado","Entrega/utilização confirmada.")}catch(e){x.status=old;cpNotify("error","Erro ao atualizar resgate",e.message)}};load().catch(e=>cpNotify("error","Erro ao carregar resgates",e.message));
</script></body></html>
