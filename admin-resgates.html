<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Central de Resgates</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#101217;font-family:Inter,system-ui,Arial}main{max-width:1180px;margin:auto;padding:28px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;color:#168ed1}.top h1{font-size:34px;margin:5px 0}.top p{margin:0;color:#747b85}.back{border:1px solid #dde1e5;background:#fff;border-radius:13px;padding:12px 16px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#fff;border:1px solid #e2e5e8;border-radius:18px;padding:18px;position:relative;overflow:hidden}.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}.stat.pending:before{background:#e5ad20}.stat.done:before{background:#22a45a}.stat.refund:before{background:#db4a4a}.stat small{font-size:10px;font-weight:900;color:#777}.stat strong{display:block;font-size:30px;margin-top:5px}.toolbar{background:#fff;border:1px solid #e2e5e8;border-radius:18px;padding:14px;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:9px;margin-bottom:14px}input,select{width:100%;border:1px solid #dfe3e7;background:#fafbfc;border-radius:11px;padding:12px;font:inherit}.card{background:#fff;border:1px solid #e2e5e8;border-left:7px solid #e5ad20;border-radius:18px;padding:18px;margin:11px 0;display:grid;grid-template-columns:1fr auto;gap:15px}.card.confirmed{border-left-color:#22a45a}.card.refunded{border-left-color:#db4a4a}.card h3{margin:0 0 6px;font-size:18px}.meta{font-size:12px;color:#707780;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tag{font-size:9px;font-weight:900;padding:6px 9px;border-radius:99px;background:#edf1f4}.tag.pending{background:#fff3cc;color:#7d5b00}.tag.confirmed{background:#e8f8ef;color:#16703c}.tag.refunded{background:#fdeaea;color:#a72e2e}.tag.pay{background:#fff0d9;color:#995d00}.actions{display:flex;align-items:center;gap:8px}.actions button{border:1px solid #dce0e4;border-radius:11px;background:#fff;padding:11px 13px;font-weight:900;cursor:pointer}.actions .confirm{background:#15934d;color:#fff;border-color:#15934d}.actions .pay{background:#e5ad20;color:#16120a;border-color:#e5ad20}.actions .refund{color:#b83232}.empty{background:#fff;border:1px dashed #d7dce0;border-radius:18px;padding:30px;text-align:center;color:#777}@media(max-width:760px){main{padding:20px 12px 60px}.top h1{font-size:28px}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:14px 11px}.stat strong{font-size:24px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.card{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}}
</style></head><body><main><div class="top"><div><div class="eyebrow">RECEPÇÃO • CLUB POP</div><h1>Central de Resgates</h1><p>Entregas, utilizações e estornos em um só lugar.</p></div><button class="back" onclick="location.href='/admin.html'">Voltar</button></div>
<section class="stats"><div class="stat pending"><small>PENDENTES</small><strong id="sPending">0</strong></div><div class="stat done"><small>CONFIRMADOS</small><strong id="sDone">0</strong></div><div class="stat refund"><small>ESTORNADOS</small><strong id="sRefund">0</strong></div></section>
<div class="toolbar"><input id="q" placeholder="Buscar aluno, item ou comprovante"><select id="status"><option value="">Todos os status</option><option value="pending">Pendentes</option><option value="confirmed">Confirmados</option><option value="refunded">Estornados</option></select><select id="origin"><option value="">Todas as origens</option><option value="store">Loja</option><option value="mission">Missão</option><option value="promotion">Promoção</option><option value="benefit">Benefício</option></select><select id="payment"><option value="">Todos os pagamentos</option><option value="paid">Pago / só Fitcoins</option><option value="pending">Complemento pendente</option><option value="hybrid">Fitcoins + dinheiro</option></select></div>
<div id="list"></div></main><script>
let A=[];const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pending=x=>["AGUARDANDO_ENTREGA","AGUARDANDO_UTILIZACAO","AGUARDANDO_PAGAMENTO"].includes(x.status),originName=x=>({store:"LOJA",mission:"MISSÃO",promotion:"PROMOÇÃO",benefit:"BENEFÍCIO"}[x.origin||"store"]||String(x.origin||"LOJA").toUpperCase());
function kind(x){return x.status==="ESTORNADO"?"refunded":x.status==="CONCLUIDO"?"confirmed":"pending"}
function render(){sPending.textContent=A.filter(pending).length;sDone.textContent=A.filter(x=>x.status==="CONCLUIDO").length;sRefund.textContent=A.filter(x=>x.status==="ESTORNADO").length;let z=A.filter(x=>{const k=kind(x),txt=JSON.stringify(x).toLowerCase(),hy=Number(x.cashComplement||0)>0,pp=x.status==="AGUARDANDO_PAGAMENTO"||x.paymentStatus==="COMPLEMENTO_PENDENTE";return(!q.value||txt.includes(q.value.toLowerCase()))&&(!status.value||k===status.value)&&(!origin.value||(x.origin||"store")===origin.value)&&(!payment.value||(payment.value==="pending"&&pp)||(payment.value==="hybrid"&&hy)||(payment.value==="paid"&&!pp))});list.innerHTML=z.slice().reverse().map(x=>{const k=kind(x),hy=Number(x.cashComplement||0)>0,pp=x.status==="AGUARDANDO_PAGAMENTO"||x.paymentStatus==="COMPLEMENTO_PENDENTE",canConfirm=["AGUARDANDO_ENTREGA","AGUARDANDO_UTILIZACAO"].includes(x.status);return '<article class="card '+(k==="confirmed"?"confirmed":k==="refunded"?"refunded":"")+'"><div><h3>'+E(x.title)+'</h3><div class="meta"><b>'+E(x.memberName||("EVO "+x.memberId))+'</b> • '+new Date(x.createdAt).toLocaleString("pt-BR")+'<br>'+E(x.receipt||"")+'</div><div class="tags"><span class="tag">'+E(originName(x))+'</span><span class="tag '+k+'">'+(k==="pending"?"PENDENTE":k==="confirmed"?"CONFIRMADO":"ESTORNADO")+'</span><span class="tag">'+Number(x.fitcoins||0)+' FITCOINS</span>'+(hy?'<span class="tag pay">'+(pp?"PAGAMENTO PENDENTE • ":"PAGO • ")+'R$ '+Number(x.cashComplement).toFixed(2).replace(".",",")+'</span>':'')+'</div></div><div class="actions">'+(pp?'<button class="pay" onclick="act(\''+x.id+'\',\'confirm_payment\')">Confirmar R$ '+Number(x.cashComplement).toFixed(2).replace(".",",")+'</button>':'')+(canConfirm?'<button class="confirm" onclick="act(\''+x.id+'\',\'confirm\')">Confirmar '+(x.sourceType==="service"?"utilização":"entrega")+'</button>':'')+(k==="pending"?'<button class="refund" onclick="act(\''+x.id+'\',\'refund\')">Estornar</button>':'')+'</div></article>'}).join("")||'<div class="empty">Nenhum resgate encontrado.</div>'}
async function load(){const r=await fetch("/api/redemption?route=admin",{cache:"no-store"}),d=await r.json();if(!r.ok)return alert(d.error||"Falha ao carregar resgates");A=d.redemptions||[];render()}
async function act(id,action){const msg=action==="refund"?"Estornar este resgate e devolver os Fitcoins?":action==="confirm_payment"?"Confirmar recebimento do pagamento complementar?":"Confirmar entrega/utilização deste resgate?";if(!confirm(msg))return;const r=await fetch("/api/redemption?route=admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({redemptionId:id,action})}),d=await r.json();if(!r.ok||!d.ok)return alert(d.error||"Falha na operação");alert(action==="refund"?"Estorno confirmado.":action==="confirm_payment"?"Pagamento confirmado.":"Resgate confirmado.");load()}
[q,status,origin,payment].forEach(x=>x.oninput=render);load();
</script></body></html>
