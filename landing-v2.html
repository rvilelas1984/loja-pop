<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop Fit</title><style>*{box-sizing:border-box}body{margin:0;background:#07101b;color:#fff;font-family:Inter,system-ui}.wrap{max-width:1180px;margin:auto;padding:0 24px}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:25px;font-weight:950}.btn{display:inline-block;background:#19e49b;color:#07110d;text-decoration:none;padding:13px 19px;border-radius:99px;font-weight:900}.carousel{overflow:hidden;position:relative}.track{display:flex;transition:transform .45s ease}.slide{min-width:100%}.slide img{display:block;width:100%;max-height:520px;object-fit:cover}.hero{padding:70px 0;background:radial-gradient(circle at 75% 20%,#6e1b8555,transparent 34%)}.heroGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}.ey{font-size:11px;letter-spacing:2px;font-weight:900;color:#20e7a0}.hero h1,.section h2{font-size:52px;line-height:1;margin:12px 0 18px}.copy{color:#c5ced8;line-height:1.6}.hero img{width:100%;border-radius:28px}.features{background:#fff;color:#111;display:grid;grid-template-columns:repeat(4,1fr);border-radius:24px;margin-top:-24px;position:relative}.feat{padding:24px;border-right:1px solid #eee}.section{padding:82px 0}.light{background:#f7f8fb;color:#111}.light .copy{color:#66717d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;color:#111;border-radius:20px;padding:24px}.promo{background:linear-gradient(110deg,#111827,#28123d);border-radius:28px;padding:40px}.partnerViewport{overflow:hidden}.partnerTrack{display:flex;width:max-content;gap:15px;animation:loop 24s linear infinite}.partner{min-width:210px;background:#fff;color:#111;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900}.partner img{max-width:130px;max-height:60px;object-fit:contain}@keyframes loop{to{transform:translateX(-50%)}}footer{padding:32px 0;border-top:1px solid #ffffff20}.preview{background:#ffd43b;color:#111;padding:10px;text-align:center;font-weight:900}.hidden{display:none!important}@media(max-width:760px){.heroGrid,.features,.cards{grid-template-columns:1fr}.hero h1,.section h2{font-size:40px}.feat{border-right:0;border-bottom:1px solid #eee}}</style></head><body><div id="previewBar" class="preview hidden">PRÉ-VISUALIZAÇÃO — RASCUNHO DO D1 • nada publicado</div><header><div class="wrap nav"><div class="brand" id="brand">CLUB POP FIT</div><a class="btn" id="headerBtn" href="/login.html">Acessar Club Pop →</a></div></header><main><section id="carousel" class="carousel"><div id="track" class="track"></div></section><section id="hero" class="hero"><div class="wrap heroGrid"><div><div class="ey"></div><h1></h1><p class="copy"></p><a class="btn action"></a></div><img></div></section><div id="features" class="wrap features"></div><section id="how" class="section light"><div class="wrap"><h2></h2><p class="copy"></p><div class="cards"></div></div></section><section id="promotion" class="section"><div class="wrap promo"><h2></h2><p class="copy"></p><a class="btn action"></a></div></section><section id="missions" class="section light"><div class="wrap"><h2></h2><div class="cards"></div></div></section><section id="partners" class="section"><div class="wrap"><h2></h2><p class="copy"></p><div class="partnerViewport"><div class="partnerTrack"></div></div></div></section></main><footer><div class="wrap"><b></b><p></p><small></small></div></footer><script>
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function imgUrl(v){v=String(v||"").trim();let m=v.match(/drive\.google\.com\/file\/d\/([^/?#]+)/)||v.match(/[?&]id=([^&#]+)/);return m?"https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1600":v}
function block(data,id){return (data.blocks||[]).find(x=>x.id===id)||{active:false,fields:{}}}function hide(id,b){document.getElementById(id)?.classList.toggle("hidden",b.active===false)}
function render(d){if(!d)return;document.title=d.seoTitle||document.title;let b=block(d,"identity"),f=b.fields||{};if(f.logoUrl)document.getElementById("brand").innerHTML='<img src="'+esc(imgUrl(f.logoUrl))+'" style="max-height:48px;max-width:210px">';if(f.faviconUrl){let l=document.createElement("link");l.rel="icon";l.href=imgUrl(f.faviconUrl);document.head.appendChild(l)}
b=block(d,"header");f=b.fields||{};headerBtn.textContent=f.buttonText||"Acessar Club Pop →";headerBtn.href=f.buttonUrl||"/login.html";
b=block(d,"carousel");hide("carousel",b);f=b.fields||{};let items=(f.items||[]).filter(x=>x.imageUrl);track.innerHTML=items.map(x=>'<a class="slide" href="'+esc(x.linkUrl||"#")+'"><img src="'+esc(imgUrl(x.imageUrl))+'"></a>').join("");if(items.length>1){let i=0;setInterval(()=>{i=(i+1)%items.length;track.style.transform="translateX(-"+i*100+"%)"},Math.max(2,+f.interval||5)*1000)}
b=block(d,"hero");hide("hero",b);f=b.fields||{};hero.querySelector(".ey").textContent=f.eyebrow||"";hero.querySelector("h1").textContent=f.title||"";hero.querySelector(".copy").textContent=f.text||"";hero.querySelector("img").src=imgUrl(f.imageUrl||"");hero.querySelector(".action").textContent=f.buttonText||"";hero.querySelector(".action").href=f.buttonUrl||"#";
b=block(d,"features");hide("features",b);f=b.fields||{};features.innerHTML=[["🏆 MISSÕES",f.missionText],["🎁 PROMOÇÕES",f.promotionText],["🪙 FITCOINS",f.fitcoinsText],["✨ BENEFÍCIOS",f.benefitsText]].map(x=>'<div class="feat"><b>'+x[0]+'</b><p>'+esc(x[1])+'</p></div>').join("");
b=block(d,"how");hide("how",b);f=b.fields||{};how.querySelector("h2").textContent=f.title||"";how.querySelector(".copy").textContent=f.text||"";how.querySelector(".cards").innerHTML=[1,2,3].map(i=>'<div class="card"><h3>'+esc(f["step"+i+"Title"])+'</h3><p>'+esc(f["step"+i+"Text"])+'</p></div>').join("");
b=block(d,"promotion");hide("promotion",b);f=b.fields||{};promotion.querySelector("h2").textContent=f.title||"";promotion.querySelector(".copy").textContent=f.text||"";promotion.querySelector(".action").textContent=f.buttonText||"";promotion.querySelector(".action").href=f.buttonUrl||"#";
b=block(d,"missions");hide("missions",b);f=b.fields||{};missions.querySelector("h2").textContent=f.title||"";missions.querySelector(".cards").innerHTML=[1,2,3].map(i=>'<div class="card"><h3>'+esc(f["card"+i+"Title"])+'</h3><p>'+esc(f["card"+i+"Text"])+'</p></div>').join("");
b=block(d,"partners");hide("partners",b);f=b.fields||{};partners.querySelector("h2").textContent=f.title||"";partners.querySelector(".copy").textContent=f.text||"";let ps=(f.items||[]).filter(x=>x.name||x.logoUrl),cards=ps.map(x=>'<div class="partner">'+(x.logoUrl?'<img src="'+esc(imgUrl(x.logoUrl))+'">':'')+'<span>'+esc(x.name)+'</span></div>').join("");partners.querySelector(".partnerTrack").innerHTML=cards+cards;
b=block(d,"footer");f=b.fields||{};document.querySelector("footer b").textContent=f.brand||"";document.querySelector("footer p").textContent=f.tagline||"";document.querySelector("footer small").textContent=f.text||""}
const preview=new URLSearchParams(location.search).get("preview")==="1";if(preview)previewBar.classList.remove("hidden");fetch("/api/evo-config?route=landing-v2&slot="+(preview?"draft":"published")+(preview?"":"&public=1"),{cache:"no-store"}).then(async r=>{let d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha");if(!d.landing)throw Error("Conteúdo ainda não disponível");render(d.landing)}).catch(e=>{document.body.insertAdjacentHTML("beforeend",'<div class="wrap" style="padding:40px">Landing V2: '+esc(e.message)+'</div>')});
</script></body></html>
