(async()=>{'use strict';const KEY='clubpop_landing_rebuild_admin_v1',page=document.getElementById('page');let saved;const published=new URLSearchParams(location.search).has('published');if(published){document.querySelector('.top').remove();try{const response=await fetch('/api/content',{cache:'no-store'});const data=await response.json();if(!response.ok||!data.landingPageRebuild)throw Error('Nenhuma landing publicada.');saved=data.landingPageRebuild}catch(e){page.textContent=e.message;page.className='error';return}}else{try{saved=JSON.parse(localStorage.getItem(KEY));if(!saved||!Array.isArray(saved.blocks)||saved.blocks.length!==10)throw Error('Salve o rascunho no editor antes de visualizar.')}catch(e){page.textContent=e.message;page.className='error';return}}
const blocks=new Map(saved.blocks.map(b=>[b.id,b]));const node=(tag,cls='',value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!=null)e.textContent=String(value);return e};const put=(parent,...children)=>{for(const c of children)if(c)parent.append(c);return parent};const field=(b,k)=>b?.fields?.[k]??'';const active=id=>blocks.get(id)?.active!==false;const url=v=>{try{const u=new URL(String(v||''),location.origin);if(!['http:','https:'].includes(u.protocol))return '';const m=u.hostname==='drive.google.com'&&(u.pathname.match(/\/file\/d\/([^/]+)/)||u.searchParams.get('id')&&[0,u.searchParams.get('id')]);return m?'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1200':u.href}catch{return ''}};const btn=(b)=>{if(b.fields.buttonVisible===false)return null;const a=node('a','btn',field(b,'buttonText'));a.href=url(field(b,'buttonUrl'))||'/login.html';if(b.fields.buttonNewTab){a.target='_blank';a.rel='noopener noreferrer'}return a};const section=(cls='')=>put(page,node('section','section '+cls));const wrap=p=>put(p,node('div','container')).lastChild;const heading=(p,b,h='h2')=>{put(p,node('div','ey',field(b,'eyebrow')),node(h,'',field(b,'title')),node('p','',field(b,'text')))};
const head=node('header','container sitehead');const logo=field(blocks.get('identity'),'logoUrl');if(logo){const img=node('img');img.src=url(logo);img.alt='Club Pop Fit';head.append(img)}else head.append(node('strong','','CLUB POP FIT'));if(active('header')){const button=btn(blocks.get('header'));if(button)head.append(button)};page.append(head);const fav=field(blocks.get('identity'),'faviconUrl');if(fav){const link=node('link');link.rel='icon';link.href=url(fav);document.head.append(link)}
if(active('carousel')){const b=blocks.get('carousel'),arr=(field(b,'banners')||[]).filter(x=>url(x.imageUrl));const s=node('section','carousel');const track=node('div','slides'),dots=node('div','dots');if(!arr.length)s.append(node('div','empty','Nenhum banner cadastrado neste rascunho.'));else{arr.forEach((item,i)=>{const img=node('img');img.src=url(item.imageUrl);img.alt='Banner '+(i+1);const dest=url(item.linkUrl);const slide=node(dest?'a':'div','slide');if(dest){slide.href=dest;if(item.newTab){slide.target='_blank';slide.rel='noopener noreferrer'}}slide.append(img);track.append(slide);const dot=node('button',i===0?'active':'');dot.type='button';dot.onclick=()=>go(i);dots.append(dot)});let index=0;function go(i){index=i;track.style.transform='translateX(-'+i*100+'%)';[...dots.children].forEach((d,j)=>d.classList.toggle('active',i===j))}if(arr.length>1)setInterval(()=>go((index+1)%arr.length),Math.max(2,Number(field(b,'interval'))||5)*1000);s.append(track,dots)}page.append(s)}
if(active('hero')){const b=blocks.get('hero'),p=wrap(section('hero')),grid=node('div','herogrid'),left=node('div'),right=node('div','hero-art');left.append(node('div','ey',field(b,'eyebrow')));const title=node('h1'),raw=String(field(b,'title')),splitAt=raw.indexOf('O Club Pop');if(splitAt>0){title.append(node('span','',raw.slice(0,splitAt)),node('span','gradient',raw.slice(splitAt)))}else title.textContent=raw;left.append(title,node('p','',field(b,'text')));{const button=btn(b);if(button)left.append(button)}if(field(b,'imageUrl')){const img=node('img');img.src=url(field(b,'imageUrl'));img.alt='Imagem principal';right.append(img)}else right.append(node('div','art-top','CLUB POP FIT'),node('div','art-number','POP'),node('p','','Mais que aulas. Uma comunidade de benefícios.'),node('div','ey','TREINE • CONQUISTE • EVOLUA'));grid.append(left,right);p.append(grid)}
if(active('features')){const b=blocks.get('features'),p=wrap(section('benefits-section')),panel=node('div','benefits-panel');[['🏆','MISSÕES','missionText'],['🎁','PROMOÇÕES','promotionText'],['🪙','FITCOINS','fitcoinsText'],['✨','BENEFÍCIOS','benefitsText']].forEach(([emoji,title,k])=>{const item=node('article','benefit'),copy=node('div');copy.append(node('strong','',title),node('p','',field(b,k)));item.append(node('span','emoji',emoji),copy);panel.append(item)});p.append(panel)}
if(active('how')){const b=blocks.get('how'),p=wrap(section('light')),g=node('div','steps');heading(p,b);for(let i=1;i<=3;i++){const item=node('article','step');item.append(node('div','num',String(i).padStart(2,'0')),node('h3','',field(b,'step'+i+'Title')),node('p','',field(b,'step'+i+'Text')));g.append(item)}p.append(g)}
if(active('promotion')){const b=blocks.get('promotion'),p=wrap(section('promotion-section')),panel=node('div','promo-panel');heading(panel,b);{const button=btn(b);if(button)panel.append(button)}p.append(panel)}
if(active('missions')){const b=blocks.get('missions'),p=wrap(section('missions-section')),g=node('div','mission-grid');heading(p,b);for(let i=1;i<=3;i++){const item=node('article','mission');item.append(node('div','symbol',['🔥','🎯','🏅'][i-1]),node('h3','',field(b,'card'+i+'Title')),node('p','',field(b,'card'+i+'Text')));g.append(item)}p.append(g)}
if(active('partners')){const b=blocks.get('partners'),p=wrap(section('partners-section')),viewport=node('div','partners'),rail=node('div','partnerRail');heading(p,b);const partners=field(b,'partners')||[];for(let repeat=0;repeat<2;repeat++)for(const item of partners){const card=node('div','partner');if(item.logoUrl){const img=node('img');img.src=url(item.logoUrl);img.alt=item.name||'Parceiro';card.append(img)}if(!item.logoUrl)card.append(node('span','',item.name));rail.append(card)}viewport.append(rail);p.append(viewport)}
if(active('footer')){const b=blocks.get('footer'),p=wrap(put(page,node('footer')));put(p,node('strong','',field(b,'brand')),node('p','',field(b,'tagline')),node('small','',field(b,'text')))}
})();
