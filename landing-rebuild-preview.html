<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop Fit | Pré-visualização</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#fff;font:16px system-ui}a{color:inherit}.top{position:sticky;top:0;z-index:10;background:#17243b;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{background:#fff;color:#17243b;border-radius:9px;padding:10px;text-decoration:none;font-weight:700}.container{max-width:1160px;margin:auto;padding:0 22px}.sitehead{padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}.sitehead img{max-width:190px;max-height:65px;object-fit:contain}.btn{display:inline-block;padding:13px 20px;border-radius:30px;background:#21e7a3;color:#071321;text-decoration:none;font-weight:800}.carousel{overflow:hidden;position:relative}.slides{display:flex;transition:transform .4s}.slide{flex:0 0 100%;display:block}.slide img{display:block;width:100%;max-height:480px;object-fit:cover}.dots{text-align:center;position:absolute;bottom:10px;left:0;right:0}.dots button{border:0;border-radius:50%;width:11px;height:11px;margin:3px;background:#aaa}.dots button.active{background:#20e7a3}.section{padding:75px 0}.hero{background:linear-gradient(120deg,#10192b,#301448)}.herogrid{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.hero img{width:100%;border-radius:20px}.ey{font-size:12px;color:#21e7a3;font-weight:900;letter-spacing:2px}.section h1{font-size:clamp(34px,5vw,60px);line-height:1.08}.section h2{font-size:clamp(28px,4vw,46px)}.section p{line-height:1.65;color:#cbd4df}.light{background:#f5f7fa;color:#101828}.light p{color:#475467}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid.four{grid-template-columns:repeat(4,1fr)}.tile{padding:24px;border-radius:16px;background:#fff;color:#111827}.tile p{color:#475467}.promo{background:linear-gradient(100deg,#18213b,#432057)}.partners{display:flex;gap:20px;overflow:hidden}.partner{flex:0 0 200px;background:#fff;color:#101828;border-radius:15px;padding:18px;text-align:center;font-weight:800}.partner img{display:block;max-width:150px;max-height:75px;margin:auto auto 8px;object-fit:contain}.partnerRail{display:flex;gap:20px;width:max-content;animation:scroll 25s linear infinite}@keyframes scroll{to{transform:translateX(-50%)}}footer{padding:35px 0;border-top:1px solid #ffffff33}.empty{padding:30px;text-align:center;color:#bfc9d8}.error{margin:60px auto;max-width:750px;padding:25px;border:1px solid #b77;background:#341b25;border-radius:12px}@media(max-width:720px){.herogrid,.grid,.grid.four{grid-template-columns:1fr}.section{padding:45px 0}.top{flex-wrap:wrap}}
</style></head><body><div class="top"><strong>PRÉ-VISUALIZAÇÃO • LANDING RECONSTRUÍDA</strong><a href="/admin-landing-rebuild.html">← Voltar ao editor</a></div><div id="page"></div><script>
(()=>{'use strict';const KEY='clubpop_landing_rebuild_admin_v1',page=document.getElementById('page');let saved;try{saved=JSON.parse(localStorage.getItem(KEY));if(!saved||!Array.isArray(saved.blocks)||saved.blocks.length!==10)throw Error('Salve o rascunho no editor antes de visualizar.')}catch(e){page.textContent=e.message;page.className='error';return}
const blocks=new Map(saved.blocks.map(b=>[b.id,b]));const node=(tag,cls='',value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!=null)e.textContent=String(value);return e};const put=(parent,...children)=>{for(const c of children)if(c)parent.append(c);return parent};const field=(b,k)=>b?.fields?.[k]??'';const active=id=>blocks.get(id)?.active!==false;const url=v=>{try{const u=new URL(String(v||''),location.origin);if(!['http:','https:'].includes(u.protocol))return '';const m=u.hostname==='drive.google.com'&&(u.pathname.match(/\/file\/d\/([^/]+)/)||u.searchParams.get('id')&&[0,u.searchParams.get('id')]);return m?'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1200':u.href}catch{return ''}};const btn=(b)=>{if(b.fields.buttonVisible===false)return null;const a=node('a','btn',field(b,'buttonText'));a.href=url(field(b,'buttonUrl'))||'/login.html';if(b.fields.buttonNewTab){a.target='_blank';a.rel='noopener noreferrer'}return a};const section=(cls='')=>put(page,node('section','section '+cls));const wrap=p=>put(p,node('div','container')).lastChild;const heading=(p,b,h='h2')=>{put(p,node('div','ey',field(b,'eyebrow')),node(h,'',field(b,'title')),node('p','',field(b,'text')))};
const head=node('header','container sitehead');const logo=field(blocks.get('identity'),'logoUrl');if(logo){const img=node('img');img.src=url(logo);img.alt='Club Pop Fit';head.append(img)}else head.append(node('strong','','CLUB POP FIT'));if(active('header'))head.append(btn(blocks.get('header')));page.append(head);const fav=field(blocks.get('identity'),'faviconUrl');if(fav){const link=node('link');link.rel='icon';link.href=url(fav);document.head.append(link)}
if(active('carousel')){const b=blocks.get('carousel'),arr=(field(b,'banners')||[]).filter(x=>url(x.imageUrl));const s=node('section','carousel');const track=node('div','slides'),dots=node('div','dots');if(!arr.length)s.append(node('div','empty','Nenhum banner cadastrado neste rascunho.'));else{arr.forEach((item,i)=>{const img=node('img');img.src=url(item.imageUrl);img.alt='Banner '+(i+1);const dest=url(item.linkUrl);const slide=node(dest?'a':'div','slide');if(dest){slide.href=dest;if(item.newTab){slide.target='_blank';slide.rel='noopener noreferrer'}}slide.append(img);track.append(slide);const dot=node('button',i===0?'active':'');dot.type='button';dot.onclick=()=>go(i);dots.append(dot)});let index=0;function go(i){index=i;track.style.transform='translateX(-'+i*100+'%)';[...dots.children].forEach((d,j)=>d.classList.toggle('active',i===j))}if(arr.length>1)setInterval(()=>go((index+1)%arr.length),Math.max(2,Number(field(b,'interval'))||5)*1000);s.append(track,dots)}page.append(s)}
if(active('hero')){const b=blocks.get('hero'),p=wrap(section('hero')),grid=node('div','herogrid'),left=node('div'),right=node('div');heading(left,b,'h1');left.append(btn(b));if(field(b,'imageUrl')){const img=node('img');img.src=url(field(b,'imageUrl'));img.alt='Imagem principal';right.append(img)}grid.append(left,right);p.append(grid)}
if(active('features')){const b=blocks.get('features'),p=wrap(section('light')),g=node('div','grid four');[['Missões','missionText'],['Promoções','promotionText'],['Fitcoins','fitcoinsText'],['Benefícios','benefitsText']].forEach(([title,k])=>put(g,put(node('article','tile'),node('h3','',title),node('p','',field(b,k)))));p.append(g)}
if(active('how')){const b=blocks.get('how'),p=wrap(section('light')),g=node('div','grid');heading(p,b);for(let i=1;i<=3;i++)g.append(put(node('article','tile'),node('h3','',field(b,'step'+i+'Title')),node('p','',field(b,'step'+i+'Text'))));p.append(g)}
if(active('promotion')){const b=blocks.get('promotion'),p=wrap(section('promo'));heading(p,b);p.append(btn(b))}
if(active('missions')){const b=blocks.get('missions'),p=wrap(section('light')),g=node('div','grid');heading(p,b);for(let i=1;i<=3;i++)g.append(put(node('article','tile'),node('h3','',field(b,'card'+i+'Title')),node('p','',field(b,'card'+i+'Text'))));p.append(g)}
if(active('partners')){const b=blocks.get('partners'),p=wrap(section()),viewport=node('div','partners'),rail=node('div','partnerRail');heading(p,b);const partners=field(b,'partners')||[];for(let repeat=0;repeat<2;repeat++)for(const item of partners){const card=node('div','partner');if(item.logoUrl){const img=node('img');img.src=url(item.logoUrl);img.alt=item.name||'Parceiro';card.append(img)}card.append(node('span','',item.name));rail.append(card)}viewport.append(rail);p.append(viewport)}
if(active('footer')){const b=blocks.get('footer'),p=wrap(put(page,node('footer')));put(p,node('strong','',field(b,'brand')),node('p','',field(b,'tagline')),node('small','',field(b,'text')))}
})();
</script></body></html>
