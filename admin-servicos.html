<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Serviços</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui}.top{display:flex;justify-content:space-between;align-items:center}.ey,label{font-size:10px;color:#747b86;font-weight:900}h1{margin:4px 0}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:13px 16px;font-weight:900}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e2e6ea;border-radius:18px;padding:18px}.card strong{display:block;font-size:26px;margin-top:7px}.service{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.service p{margin:4px 0;color:#777;font-size:11px}.chip{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef8fc;font-size:9px;font-weight:900;margin:4px 4px 0 0}.mini{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px;font-weight:900}.editor{display:none}.editor.show{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce1e5;border-radius:10px}.field label{display:block;margin:8px 0 6px}.actions{display:flex;gap:8px;margin-top:15px}@media(max-width:760px){.stats,.form{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}</style></head><body><main><div class="top"><div><div class="ey">CATÁLOGO DE SERVIÇOS</div><h1>Serviços</h1></div><button class="primary" id="new">+ Novo serviço</button></div><section class="stats"><div class="card"><span class="ey">ATIVOS</span><strong id="active">0</strong></div><div class="card"><span class="ey">RESGATES</span><strong>—</strong></div><div class="card"><span class="ey">FITCOINS</span><strong>—</strong></div><div class="card"><span class="ey">CATEGORIAS</span><strong id="cats">0</strong></div></section><section class="panel"><h2>Serviços cadastrados</h2><div id="list"></div></section><section class="panel editor" id="editor"><h2 id="title">Novo serviço</h2><div class="form"><div class="field"><label>NOME</label><input id="name"></div><div class="field"><label>UNIDADE</label><select id="unit"><option value="club">Club Pop</option><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select></div><div class="field full"><label>DESCRIÇÃO</label><textarea id="desc"></textarea></div><div class="field"><label>CATEGORIA</label><input id="category" placeholder="Bem-estar, Aulas, Avaliações..."></div><div class="field"><label>STATUS</label><select id="status"><option>Ativo</option><option>Inativo</option></select></div><div class="field"><label>PREÇO R$</label><input id="price" type="number" step=".01" min="0"></div><div class="field"><label>FITCOINS</label><input id="fitcoins" type="number" min="0"></div><div class="field"><label>PREÇO COM FITCOINS R$</label><input id="discountPrice" type="number" step=".01" min="0"></div><div class="field"><label>VALIDADE APÓS RESGATE</label><select id="validity"><option value="30">30 dias</option><option value="15">15 dias</option><option value="7">7 dias</option><option value="0">Sem prazo</option></select></div><div class="field"><label>CONTROLE</label><select id="control"><option value="voucher">Gerar voucher</option><option value="manual">Validação manual</option><option value="credit">Crédito automático</option></select></div><div class="field full"><label>INSTRUÇÕES</label><textarea id="instructions"></textarea></div></div><div class="actions"><button class="primary" id="save">Salvar serviço</button><button class="mini" id="cancel">Cancelar</button></div></section></main><script src="/admin-common.js"></script><script>
let D={},editId=null,$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){D=await(await fetch("/api/content",{cache:"no-store"})).json();D.services??=[];render()}async function put(){const r=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error(await cpErrorDetail(r))}function render(){$("active").textContent=D.services.filter(x=>x.status==="Ativo").length;$("cats").textContent=new Set(D.services.map(x=>x.category).filter(Boolean)).size;$("list").innerHTML=D.services.length?D.services.map(s=>'<div class="service"><div><b>'+esc(s.name)+'</b><p>'+esc(s.description||"")+'</p><span class="chip">'+esc(s.unit||"club").toUpperCase()+'</span><span class="chip">'+Number(s.fitcoins||0)+' FITCOINS</span></div><button class="mini" onclick="editService(\''+s.id+'\')">EDITAR</button></div>').join(""):"<p>Nenhum serviço cadastrado.</p>"}function open(s={}){editId=s.id||null;$("editor").classList.add("show");$("title").textContent=s.id?"Editar serviço":"Novo serviço";["name","unit","desc","category","status","price","fitcoins","discountPrice","validity","control","instructions"].forEach(k=>$(k).value=s[k]??({unit:"club",status:"Ativo",validity:"30",control:"voucher"}[k]??""));$("editor").scrollIntoView({behavior:"smooth"})}window.editService=id=>open(D.services.find(x=>x.id===id));$("new").onclick=()=>open();$("cancel").onclick=()=>$("editor").classList.remove("show");$("save").onclick=async()=>{const s={id:editId||"service-"+Date.now(),name:$("name").value.trim(),unit:$("unit").value,description:$("desc").value.trim(),category:$("category").value.trim(),status:$("status").value,price:Number($("price").value)||0,fitcoins:Number($("fitcoins").value)||0,discountPrice:Number($("discountPrice").value)||0,validity:$("validity").value,control:$("control").value,instructions:$("instructions").value.trim()};if(!s.name)return cpNotify("error","Serviço não salvo","Informe o nome.");const i=D.services.findIndex(x=>x.id===s.id),old=i>=0?D.services[i]:null;i>=0?D.services[i]=s:D.services.push(s);cpBusy($("save"),true,"SALVANDO...");try{await put();$("editor").classList.remove("show");render();cpNotify("success","Serviço salvo","Disponível para Loja e recompensas.")}catch(e){if(i>=0)D.services[i]=old;else D.services=D.services.filter(x=>x.id!==s.id);cpNotify("error","Erro ao salvar serviço",e.message)}finally{cpBusy($("save"),false)}};load().catch(e=>cpNotify("error","Erro ao carregar serviços",e.message));
</script></body></html>
