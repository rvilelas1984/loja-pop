<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Serviços</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui}.top{display:flex;justify-content:space-between;align-items:center}.ey,label{font-size:10px;color:#747b86;font-weight:900}h1{margin:4px 0}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:13px 16px;font-weight:900}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e2e6ea;border-radius:18px;padding:18px}.card strong{display:block;font-size:26px;margin-top:7px}.service{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.service p{margin:4px 0;color:#777;font-size:11px}.chip{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef8fc;font-size:9px;font-weight:900;margin:4px 4px 0 0}.mini{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px;font-weight:900}.editor{display:none}.editor.show{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field input:not([type="checkbox"]),.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce1e5;border-radius:10px}.eligibleContract{width:15px!important;height:15px!important;vertical-align:-2px;margin-right:6px}.field label{display:block;margin:8px 0 6px}.actions{display:flex;gap:8px;margin-top:15px}@media(max-width:760px){.stats,.form{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}.mediaPreview{margin-top:10px;aspect-ratio:16/9;border:1px dashed #cfd6dc;border-radius:15px;background:#f6f8fa;display:grid;place-items:center;color:#747b86;font-size:11px;overflow:hidden}.mediaPreview img{width:100%;height:100%;object-fit:contain}</style></head><body><main><div class="top"><div><div class="ey">CATÁLOGO DE SERVIÇOS</div><h1>Serviços</h1></div><button class="primary" id="new">+ Novo serviço</button></div><section class="stats"><div class="card"><span class="ey">ATIVOS</span><strong id="active">0</strong></div><div class="card"><span class="ey">RESGATES</span><strong>—</strong></div><div class="card"><span class="ey">FITCOINS</span><strong>—</strong></div><div class="card"><span class="ey">CATEGORIAS</span><strong id="cats">0</strong></div></section><section class="panel"><h2>Serviços cadastrados</h2><div id="list"></div></section><section class="panel editor" id="editor"><h2 id="title">Novo serviço</h2><div class="form"><div class="field"><label>NOME</label><input id="name"></div><div class="field"><label>UNIDADE</label><select id="unit"><option value="club">Club Pop</option><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select></div><div class="field full"><label>DESCRIÇÃO</label><textarea id="desc"></textarea></div><div class="field"><label>CATEGORIA</label><input id="category" placeholder="Bem-estar, Aulas, Avaliações..."></div><div class="field"><label>STATUS</label><select id="status"><option>Ativo</option><option>Inativo</option></select></div><div class="field"><label>PREÇO R$</label><input id="price" type="number" step=".01" min="0"></div><div class="field"><label>FITCOINS</label><input id="fitcoins" type="number" min="0"></div><div class="field"><label>PREÇO COM FITCOINS R$</label><input id="discountPrice" type="number" step=".01" min="0"></div><div class="field"><label>VALIDADE APÓS RESGATE</label><select id="validity"><option value="30">30 dias</option><option value="15">15 dias</option><option value="7">7 dias</option><option value="0">Sem prazo</option></select></div><div class="field"><label>CONTROLE</label><select id="control"><option value="voucher">Gerar voucher</option><option value="manual">Validação manual</option><option value="credit">Crédito automático</option></select></div><div class="field full"><label>IMAGEM DO SERVIÇO • LINK GOOGLE DRIVE</label><input id="imageUrl" type="url" placeholder="Cole o link público da imagem no Google Drive"><div id="serviceImagePreview" class="mediaPreview">Pré-visualização da imagem</div></div><div class="field full"><label>MODELO / COR DO CARD</label><select id="cardTheme"><option value="dark">Premium • Preto + Azul</option><option value="pink">Energia • Rosa + Lilás</option><option value="green">Conquista • Verde Club Pop</option><option value="blue">Progresso • Azul + Ciano</option><option value="purple">Benefício • Roxo + Lavanda</option></select></div><div class="field full"><label>ELEGIBILIDADE</label><select id="eligibility"><option value="any">Qualquer aluno</option><option value="active_contract">Somente aluno com contrato ativo</option></select><div id="contractsBox" style="display:none;margin-top:8px"><label>CATEGORIA DO CONTRATO</label><select id="contractCategory"></select><button type="button" class="mini" id="toggleContracts" style="margin-top:10px">Selecionar contratos ▾</button><div id="contractsList" style="display:none;background:#f5f7f8;border-radius:12px;padding:12px;font-size:11px"></div><label style="margin-top:10px">CONTRATOS SELECIONADOS</label><div id="selectedContractsList" style="background:#f5f7f8;border-radius:12px;padding:12px;font-size:11px"></div></div></div><div class="field full"><label>INSTRUÇÕES</label><textarea id="instructions"></textarea></div></div><div class="actions"><button class="primary" id="save">Salvar serviço</button><button class="mini" id="cancel">Cancelar</button></div></section></main><script src="/admin-common.js"></script><script>
let D={},editId=null,selectedContracts=[],$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function load(){D=await(await fetch("/api/content",{cache:"no-store"})).json();D.services??=[];D.evoCache??={contracts:{bike:[],gym:[]},contractCategories:{bike:[],gym:[]}};render()}async function put(){const r=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error(await cpErrorDetail(r))}function render(){$("active").textContent=D.services.filter(x=>x.status==="Ativo").length;$("cats").textContent=new Set(D.services.map(x=>x.category).filter(Boolean)).size;$("list").innerHTML=D.services.length?D.services.map(s=>'<div class="service"><div><b>'+esc(s.name)+'</b><p>'+esc(s.description||"")+'</p><span class="chip">'+esc(s.unit||"club").toUpperCase()+'</span><span class="chip">'+Number(s.fitcoins||0)+' FITCOINS</span></div><button class="mini" onclick="editService(\''+s.id+'\')">EDITAR</button></div>').join(""):"<p>Nenhum serviço cadastrado.</p>"}function contractRows(){return (D.evoCache?.contracts?.bike||[]).filter(x=>!x.inactive)}function eligibilityUI(){const box=$("contractsBox");box.style.display=$("eligibility").value==="active_contract"?"block":"none";const cats=[...new Set(contractRows().map(x=>String(x.category||"Sem categoria")))].sort((a,b)=>a.localeCompare(b,"pt-BR"));$("contractCategory").innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");renderContracts()}function renderSelectedContracts(){const rows=contractRows();$("selectedContractsList").innerHTML=selectedContracts.length?selectedContracts.map(id=>{const x=rows.find(r=>String(r.id)===id);return '<span style="display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid #dfe4e8;border-radius:999px;padding:6px 9px;margin:3px"><b>'+esc(x?.name||id)+'</b><button type="button" class="removeContract" data-id="'+esc(id)+'" style="border:0;background:none;cursor:pointer">×</button></span>'}).join(""):"Nenhum contrato selecionado.";$("selectedContractsList").querySelectorAll(".removeContract").forEach(b=>b.onclick=()=>{selectedContracts=selectedContracts.filter(v=>v!==b.dataset.id);renderContracts()})}function renderContracts(){const cat=$("contractCategory").value,rows=contractRows().filter(x=>!cat||String(x.category||"Sem categoria")===cat);$("contractsList").innerHTML=rows.length?rows.map(x=>{const id=String(x.id),ck=selectedContracts.includes(id);return '<label style="display:block;margin:7px 0"><input type="checkbox" class="eligibleContract" value="'+esc(id)+'" '+(ck?"checked":"")+'> <b>'+esc(x.name)+'</b>'+'<small style="display:block;margin-left:22px">Categoria: '+esc(x.category||"Sem categoria")+'</small>'+'</label>'}).join(""):"Nenhum contrato ativo nesta categoria.";$("contractsList").querySelectorAll(".eligibleContract").forEach(x=>x.onchange=()=>{if(x.checked&&!selectedContracts.includes(x.value))selectedContracts.push(x.value);if(!x.checked)selectedContracts=selectedContracts.filter(v=>v!==x.value);renderSelectedContracts()});renderSelectedContracts()}function open(s={}){editId=s.id||null;$("editor").classList.add("show");$("title").textContent=s.id?"Editar serviço":"Novo serviço";["name","unit","desc","category","status","price","fitcoins","discountPrice","validity","control","instructions","imageUrl"].forEach(k=>$(k).value=s[k]??({unit:"club",status:"Ativo",validity:"30",control:"voucher"}[k]??""));$("cardTheme").value=s.cardTheme||"green";previewServiceImage();selectedContracts=(s.eligibility?.acceptedContracts||[]).map(String);$("eligibility").value=s.eligibility?.mode||"any";eligibilityUI();$("editor").scrollIntoView({behavior:"smooth"})}function drivePreview(url){if(!url)return"";const m=url.match(/\/d\/([^/]+)/)||url.match(/[?&]id=([^&]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200":url}function previewServiceImage(){const p=$("serviceImagePreview"),u=drivePreview($("imageUrl")?.value||"");if(p)p.innerHTML=u?'<img src="'+esc(u)+'" alt="Prévia">':"Pré-visualização da imagem"}$("imageUrl").addEventListener("input",previewServiceImage);window.editService=id=>open(D.services.find(x=>x.id===id));$("new").onclick=()=>open();$("eligibility").onchange=eligibilityUI;$("contractCategory").onchange=renderContracts;$("toggleContracts").onclick=()=>{const x=$("contractsList"),open=x.style.display!=="none";x.style.display=open?"none":"block";$("toggleContracts").textContent=open?"Selecionar contratos ▾":"Ocultar contratos ▴"};$("cancel").onclick=()=>$("editor").classList.remove("show");$("save").onclick=async()=>{const s={id:editId||"service-"+Date.now(),name:$("name").value.trim(),unit:$("unit").value,description:$("desc").value.trim(),category:$("category").value.trim(),status:$("status").value,price:Number($("price").value)||0,fitcoins:Number($("fitcoins").value)||0,discountPrice:Number($("discountPrice").value)||0,validity:$("validity").value,control:$("control").value,instructions:$("instructions").value.trim(),imageUrl:$("imageUrl").value.trim(),cardTheme:$("cardTheme").value||"green",eligibility:{mode:$("eligibility").value,acceptedContracts:[...selectedContracts]}};if(s.eligibility.mode==="active_contract"&&!s.eligibility.acceptedContracts.length)return cpNotify("error","Serviço não salvo","Selecione pelo menos um contrato elegível.");if(!s.name)return cpNotify("error","Serviço não salvo","Informe o nome.");const i=D.services.findIndex(x=>x.id===s.id),old=i>=0?D.services[i]:null;i>=0?D.services[i]=s:D.services.push(s);cpBusy($("save"),true,"SALVANDO...");try{await put();$("editor").classList.remove("show");render();cpNotify("success","Serviço salvo","Disponível para Loja e recompensas.")}catch(e){if(i>=0)D.services[i]=old;else D.services=D.services.filter(x=>x.id!==s.id);cpNotify("error","Erro ao salvar serviço",e.message)}finally{cpBusy($("save"),false)}};load().catch(e=>cpNotify("error","Erro ao carregar serviços",e.message));
</script></body></html>
