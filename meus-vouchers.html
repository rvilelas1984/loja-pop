<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus vouchers — Club Pop</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#19232d;background:var(--cp-unit-bg,#a9eaf5)}*{box-sizing:border-box}body{margin:0}main{width:100%;max-width:none;margin:0;padding:0 30px 115px}main>header{margin:0 -30px 20px!important;width:calc(100% + 60px)!important;border-radius:0!important}header{display:flex;align-items:center;gap:15px;margin-bottom:25px}a{color:inherit;text-decoration:none}.back{border:0;border-radius:14px;background:#fff;padding:12px 15px;font-weight:800}.lead{color:#49606c;margin:5px 0 22px}.card{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 6px 20px #15334810}.tag{display:inline-block;border-radius:99px;background:#e6f8f3;color:#176c52;padding:6px 12px;font-size:12px;font-weight:800}.code{user-select:all;font-size:24px;font-weight:900;letter-spacing:1px;overflow-wrap:anywhere;margin:12px 0}.sub{color:#596876;font-size:14px}.empty{background:white;border-radius:20px;padding:30px 20px;text-align:center}.action{border:0;background:#202c47;color:white;border-radius:12px;padding:12px 16px;font-weight:800}.error{color:#a12e36}h1{margin:0;font-size:26px}h2{font-size:19px;margin:14px 0 8px} .page-title{margin:14px 0 20px}.navwrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(96%,460px);z-index:10;background:#fff;border-radius:26px;padding:12px 5px;box-shadow:0 6px 28px #0002}.nav.modern{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.nav button{border:0;background:transparent;color:#7c8793;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:700;padding:8px 0}.nav button.active{color:#089dcc;background:#e8f8fc;border-radius:16px}.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}body{background:var(--cp-unit-bg,#a9eaf5)}.back{display:none}.copy-voucher{margin:9px 0 14px;padding:11px 16px;border:0;border-radius:12px;background:#101820;color:#fff;font-weight:850;cursor:pointer}.copy-voucher:focus-visible{outline:3px solid #00a9dc}@media(max-width:500px){main{padding-left:18px;padding-right:18px}main>header{margin-left:-18px!important;margin-right:-18px!important;width:calc(100% + 36px)!important}}.claim-panel{background:white;border-radius:22px;padding:22px;margin:14px 0;text-align:center}.claim-panel button{background:#101820;color:white;border:0;border-radius:14px;padding:15px 22px;font-weight:850}.claim-spin{width:55px;height:55px;margin:14px auto;border:6px solid #d6f5ff;border-top-color:#05a8c6;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes popIn{0%{transform:scale(.45);opacity:0}70%{transform:scale(1.13);opacity:1}100%{transform:scale(1)}}</style><link rel="stylesheet" href="/student-unit-theme.css"></head><body><main><header id="club-pop-student-header" class="cp-header-card cp-header-placeholder" aria-label="Cabeçalho Club Pop"></header><div class="page-title"><h1>🎟️ Meus vouchers</h1><div class="sub">Suas recompensas no Club Pop</div></div><p class="lead">Confira os códigos, os benefícios e a situação dos seus vouchers.</p><section id="claimPanel" hidden class="claim-panel"></section><div id="list" class="empty">Carregando seus vouchers...</div></main><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H5V10"/></svg><span>Início</span></button><button onclick="location.href='/missoes.html'"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/></svg><span>Missões</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox="0 0 24 24"><path d="M4 9h16v12H4zM2 5h20v4H2zM12 5v16"/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg><span>Loja</span></button><button class="active" onclick="location.href='/perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button></nav></div><script src="/student-unit-theme.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),mid=params.get("mission"),gid=params.get("goal"),panel=document.getElementById("claimPanel");
function voucherMeta(v){try{return JSON.parse(v.metadata_json||"{}")}catch{return {}}}
function showClaim(vouchers,pending=[]){if(!mid||!gid)return;panel.hidden=false;const found=vouchers.find(v=>v.source_type==="MISSION"&&String(v.source_id)===gid&&String(voucherMeta(v).missionId)===mid),waiting=pending.find(x=>x.source_id===mid+":"+gid);
if(found){panel.innerHTML=voucherMeta(found).provider==="EVO"?'<div style="font-size:46px;animation:popIn .65s ease-out">🎉🎁✨</div><h2>Parabéns! Seu voucher chegou!</h2><p>Você conquistou um benefício especial. Copie o código da EVO abaixo e use na compra do seu pacote pelo app do Bike Pop.</p><div class="code" style="margin:16px auto">'+esc(found.code)+'</div><button type="button" class="copy-voucher" data-code="'+esc(found.code)+'">COPIAR MEU VOUCHER</button>':'<h2>Resgate interno já registrado</h2><p>Este código anterior não comprova emissão na EVO. Solicite conferência à equipe.</p>';return}
if(waiting){panel.innerHTML='<div style="font-size:38px">🎟️</div><h2>Seu voucher está chegando!</h2><p>A EVO já recebeu a solicitação. Assim que o código real for confirmado, ele aparecerá aqui. Atualize a página em alguns instantes.</p>';return}
panel.innerHTML='<h2>🎁 Sua conquista merece comemoração!</h2><p>Confirme para gerar seu voucher na EVO.</p><button id="claimVoucher">RESGATAR VOUCHER</button>'}
let claiming=false;
async function redeem(){if(claiming)return;claiming=true;panel.innerHTML='<div class="claim-spin" role="status" aria-label="Processando"></div><h2>Gerando seu voucher na EVO...</h2>';try{const token=sessionStorage.getItem("clubpop_token"),r=await fetch("/api/mission-redemptions?route=claim",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({missionId:mid,goalId:gid})}),d=await r.json();if(!r.ok||!d.ok){const messages={META_AINDA_NAO_ATINGIDA:"A meta ainda não foi confirmada nos dados sincronizados.",MISSAO_FORA_DO_PERIODO:"Este desafio não está no período ativo.",MODELO_VOUCHER_INDISPONIVEL:"O modelo de voucher está indisponível. Fale com a equipe.",VOUCHER_EVO_EXIGE_UMA_RECOMPENSA_POR_META:"Para emissão automática, a meta deve ter somente um voucher como recompensa.",TAREFA_SEM_COMPROVACAO_D1:"Esta tarefa ainda não possui comprovação suficiente para resgate automático.",RESGATE_ANTERIOR_INTERNO_REQUER_CONFERENCIA:"Este prêmio já tem um resgate interno. Solicite conferência à equipe."};throw Error(messages[d.error]||"Não foi possível emitir agora. Informe à equipe: "+(d.error||"falha de comunicação"))}await load();}catch(e){panel.innerHTML='<h2>Não foi possível confirmar a emissão</h2><p>'+esc(e.message)+'</p><p>Atualize a página para conferir a situação antes de tentar novamente.</p>'}finally{claiming=false}}
document.addEventListener("click",e=>{if(e.target.id==="claimVoucher")redeem()});
async function load(){const box=document.getElementById("list"),token=sessionStorage.getItem("clubpop_token");if(!token){location.replace("/");return}
try{const r=await fetch("/api/mission-redemptions?route=vouchers",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Não foi possível consultar seus vouchers");const vouchers=d.vouchers||[];showClaim(vouchers,d.pending||[]);if(!vouchers.length){box.className="empty";box.textContent="Você ainda não possui vouchers registrados.";return}
box.className="";box.innerHTML=vouchers.map(v=>'<article class="card"><span class="tag">'+esc(({ACTIVE:"ATIVO",USED:"UTILIZADO",CANCELLED:"CANCELADO",PENDING:"PENDENTE"}[v.status]||v.status||"PENDENTE"))+'</span><h2>'+esc(v.title||v.description||"Voucher")+'</h2><div class="sub">'+esc(v.description||"")+'</div><div class="sub">'+(voucherMeta(v).provider==='EVO'?'Código emitido pela EVO':'Código interno Club Pop — não confirmado na EVO')+'</div><div class="code">'+esc(v.code||"Código indisponível")+'</div>'+(v.code&&String(v.status).toUpperCase()==='ACTIVE'?'<button type="button" class="copy-voucher" data-code="'+esc(v.code)+'">Copiar código do voucher</button>':'')+'<div class="sub">Origem: '+esc(({MISSION:"MISSÃO",STORE:"LOJA",PROMOTION:"PROMOÇÃO"}[v.source_type]||v.source_type||"Club Pop"))+' · Unidade: '+esc(({bike:"Bike Pop",gym:"Gym Pop"}[v.unit]||v.unit||"—"))+'</div><div class="sub">Resgate: '+esc(v.requested_at?new Date(v.requested_at).toLocaleString("pt-BR"):"Data não informada")+'</div></article>').join("");
}catch(e){box.className="empty error";box.textContent="Não foi possível carregar seus vouchers: "+e.message}}
document.addEventListener("click",async e=>{const b=e.target.closest(".copy-voucher");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.code);b.textContent="Código copiado ✓"}catch(err){const range=document.createRange();range.selectNodeContents(b.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(range);b.textContent="Selecione e copie o código acima"}});
load();
</script></body></html>
