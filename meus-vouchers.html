<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus vouchers — Club Pop</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#19232d;background:#a9eaf5}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:24px 18px 95px}header{display:flex;align-items:center;gap:15px;margin-bottom:25px}a{color:inherit;text-decoration:none}.back{border:0;border-radius:14px;background:#fff;padding:12px 15px;font-weight:800}.lead{color:#49606c;margin:5px 0 22px}.card{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 6px 20px #15334810}.tag{display:inline-block;border-radius:99px;background:#e6f8f3;color:#176c52;padding:6px 12px;font-size:12px;font-weight:800}.code{font-size:24px;font-weight:900;letter-spacing:1px;overflow-wrap:anywhere;margin:12px 0}.sub{color:#596876;font-size:14px}.empty{background:white;border-radius:20px;padding:30px 20px;text-align:center}.action{border:0;background:#202c47;color:white;border-radius:12px;padding:12px 16px;font-weight:800}.error{color:#a12e36}h1{margin:0;font-size:26px}h2{font-size:19px;margin:14px 0 8px}</style></head><body><main><header><a class="back" href="/perfil.html">← Voltar</a><div><h1>🎟️ Meus vouchers</h1><div class="sub">Suas recompensas no Club Pop</div></div></header><p class="lead">Confira os códigos, os benefícios e a situação dos seus vouchers.</p><div id="list" class="empty">Carregando seus vouchers...</div></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const box=document.getElementById("list"),token=sessionStorage.getItem("clubpop_token");if(!token){location.replace("/");return}
try{const r=await fetch("/api/mission-redemptions?route=vouchers",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Não foi possível consultar seus vouchers");const vouchers=d.vouchers||[];if(!vouchers.length){box.className="empty";box.textContent="Você ainda não possui vouchers registrados.";return}
box.className="";box.innerHTML=vouchers.map(v=>'<article class="card"><span class="tag">'+esc(v.status||"PENDENTE")+'</span><h2>'+esc(v.title||v.description||"Voucher")+'</h2><div class="sub">'+esc(v.description||"")+'</div><div class="code">'+esc(v.code||"Código indisponível")+'</div><div class="sub">Origem: '+esc(v.source_type||"Club Pop")+' · Unidade: '+esc(v.unit||"—")+'</div><div class="sub">Resgate: '+esc(v.requested_at?new Date(v.requested_at).toLocaleString("pt-BR"):"Data não informada")+'</div></article>').join("");
}catch(e){box.className="empty error";box.textContent="Não foi possível carregar seus vouchers: "+e.message}}
load();
</script></body></html>
