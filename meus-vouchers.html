<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus vouchers — Club Pop</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#19232d;background:var(--cp-unit-bg,#a9eaf5)}*{box-sizing:border-box}body{margin:0}main{width:100%;max-width:none;margin:0;padding:0 30px 115px}main>header{margin:0 -30px 20px!important;width:calc(100% + 60px)!important;border-radius:0!important}header{display:flex;align-items:center;gap:15px;margin-bottom:25px}a{color:inherit;text-decoration:none}.back{border:0;border-radius:14px;background:#fff;padding:12px 15px;font-weight:800}.lead{color:#49606c;margin:5px 0 22px}.card{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 6px 20px #15334810}.tag{display:inline-block;border-radius:99px;background:#e6f8f3;color:#176c52;padding:6px 12px;font-size:12px;font-weight:800}.code{user-select:all;font-size:24px;font-weight:900;letter-spacing:1px;overflow-wrap:anywhere;margin:12px 0}.sub{color:#596876;font-size:14px}.empty{background:white;border-radius:20px;padding:30px 20px;text-align:center}.action{border:0;background:#202c47;color:white;border-radius:12px;padding:12px 16px;font-weight:800}.error{color:#a12e36}h1{margin:0;font-size:26px}h2{font-size:19px;margin:14px 0 8px} .page-title{margin:14px 0 20px}.navwrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(96%,460px);z-index:10;background:#fff;border-radius:26px;padding:12px 5px;box-shadow:0 6px 28px #0002}.nav.modern{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.nav button{border:0;background:transparent;color:#7c8793;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:700;padding:8px 0}.nav button.active{color:#089dcc;background:#e8f8fc;border-radius:16px}.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}body{background:var(--cp-unit-bg,#a9eaf5)}.back{display:none}.copy-voucher{margin:9px 0 14px;padding:11px 16px;border:0;border-radius:12px;background:#101820;color:#fff;font-weight:850;cursor:pointer}.copy-voucher:focus-visible{outline:3px solid #00a9dc}@media(max-width:500px){main{padding-left:18px;padding-right:18px}main>header{margin-left:-18px!important;margin-right:-18px!important;width:calc(100% + 36px)!important}}</style><link rel="stylesheet" href="/student-unit-theme.css"></head><body><main><header id="club-pop-student-header" class="cp-header-card cp-header-placeholder" aria-label="Cabeçalho Club Pop"></header><div class="page-title"><h1>🎟️ Meus vouchers</h1><div class="sub">Suas recompensas no Club Pop</div></div><p class="lead">Confira os códigos, os benefícios e a situação dos seus vouchers.</p><div id="list" class="empty">Carregando seus vouchers...</div></main><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H5V10"/></svg><span>Início</span></button><button onclick="location.href='/missoes.html'"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/></svg><span>Missões</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox="0 0 24 24"><path d="M4 9h16v12H4zM2 5h20v4H2zM12 5v16"/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg><span>Loja</span></button><button class="active" onclick="location.href='/perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button></nav></div><script src="/student-unit-theme.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const box=document.getElementById("list"),token=sessionStorage.getItem("clubpop_token");if(!token){location.replace("/");return}
try{const r=await fetch("/api/mission-redemptions?route=vouchers",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Não foi possível consultar seus vouchers");const vouchers=d.vouchers||[];if(!vouchers.length){box.className="empty";box.textContent="Você ainda não possui vouchers registrados.";return}
box.className="";box.innerHTML=vouchers.map(v=>'<article class="card"><span class="tag">'+esc(({ACTIVE:"ATIVO",USED:"UTILIZADO",CANCELLED:"CANCELADO",PENDING:"PENDENTE"}[v.status]||v.status||"PENDENTE"))+'</span><h2>'+esc(v.title||v.description||"Voucher")+'</h2><div class="sub">'+esc(v.description||"")+'</div><div class="code">'+esc(v.code||"Código indisponível")+'</div>'+(v.code&&String(v.status).toUpperCase()==='ACTIVE'?'<button type="button" class="copy-voucher" data-code="'+esc(v.code)+'">Copiar código do voucher</button>':'')+'<div class="sub">Origem: '+esc(({MISSION:"MISSÃO",STORE:"LOJA",PROMOTION:"PROMOÇÃO"}[v.source_type]||v.source_type||"Club Pop"))+' · Unidade: '+esc(({bike:"Bike Pop",gym:"Gym Pop"}[v.unit]||v.unit||"—"))+'</div><div class="sub">Resgate: '+esc(v.requested_at?new Date(v.requested_at).toLocaleString("pt-BR"):"Data não informada")+'</div></article>').join("");
}catch(e){box.className="empty error";box.textContent="Não foi possível carregar seus vouchers: "+e.message}}
document.addEventListener("click",async e=>{const b=e.target.closest(".copy-voucher");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.code);b.textContent="Código copiado ✓"}catch(err){const range=document.createRange();range.selectNodeContents(b.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(range);b.textContent="Selecione e copie o código acima"}});
load();
</script></body></html>
