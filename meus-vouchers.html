<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus vouchers — Club Pop</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#19232d;background:var(--cp-unit-bg,#a9eaf5)}*{box-sizing:border-box}body{margin:0}main{width:100%;max-width:none;margin:0;padding:0 30px 115px}main>header{margin:0 -30px 20px!important;width:calc(100% + 60px)!important;border-radius:0!important}header{display:flex;align-items:center;gap:15px;margin-bottom:25px}a{color:inherit;text-decoration:none}.back{border:0;border-radius:14px;background:#fff;padding:12px 15px;font-weight:800}.lead{color:#49606c;margin:5px 0 22px}.card{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 6px 20px #15334810}.tag{display:inline-block;border-radius:99px;background:#e6f8f3;color:#176c52;padding:6px 12px;font-size:12px;font-weight:800}.code{user-select:all;font-size:24px;font-weight:900;letter-spacing:1px;overflow-wrap:anywhere;margin:12px 0}.sub{color:#596876;font-size:14px}.empty{background:white;border-radius:20px;padding:30px 20px;text-align:center}.action{border:0;background:#202c47;color:white;border-radius:12px;padding:12px 16px;font-weight:800}.error{color:#a12e36}h1{margin:0;font-size:26px}h2{font-size:19px;margin:14px 0 8px} .page-title{margin:14px 0 20px}.navwrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(96%,460px);z-index:10;background:#fff;border-radius:26px;padding:12px 5px;box-shadow:0 6px 28px #0002}.nav.modern{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.nav button{border:0;background:transparent;color:#7c8793;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:700;padding:8px 0}.nav button.active{color:#089dcc;background:#e8f8fc;border-radius:16px}.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}body{background:var(--cp-unit-bg,#a9eaf5)}.back{display:none}.copy-voucher{margin:9px 0 14px;padding:11px 16px;border:0;border-radius:12px;background:#101820;color:#fff;font-weight:850;cursor:pointer}.copy-voucher:focus-visible{outline:3px solid #00a9dc}@media(max-width:500px){main{padding-left:18px;padding-right:18px}main>header{margin-left:-18px!important;margin-right:-18px!important;width:calc(100% + 36px)!important}}.claim-panel{background:white;border-radius:22px;padding:22px;margin:14px 0;text-align:center}.claim-panel button{background:#101820;color:white;border:0;border-radius:14px;padding:15px 22px;font-weight:850}.claim-spin{width:55px;height:55px;margin:14px auto;border:6px solid #d6f5ff;border-top-color:#05a8c6;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes popIn{0%{transform:scale(.45);opacity:0}70%{transform:scale(1.13);opacity:1}100%{transform:scale(1)}}</style><link rel="stylesheet" href="/student-unit-theme.css"><style>.cp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.cp-stat{background:#fff;border-radius:17px;padding:15px 5px;text-align:center}.cp-stat b{display:block;font-size:24px}.cp-stat small{font-size:11px;color:#63717a}.cp-tools{background:white;padding:14px;border-radius:18px;margin:12px 0}.cp-search{width:100%;border:1px solid #d6e1e6;border-radius:12px;padding:13px;font-size:14px}.cp-filters{display:flex;gap:6px;overflow-x:auto;margin-top:10px}.cp-filter{border:1px solid #dce4e8;background:white;border-radius:30px;padding:9px 13px;font-weight:700;white-space:nowrap}.cp-filter.selected{background:#14212c;color:white}.cp-voucher{background:white;border-radius:18px;margin:10px 0;overflow:hidden}.cp-summary{border:0;background:none;width:100%;padding:17px;text-align:left;cursor:pointer}.cp-title{font-weight:850;font-size:16px;margin:8px 0}.cp-meta{color:#596876;font-size:12px;line-height:1.7}.cp-detail{padding:15px 17px;border-top:1px solid #e9edf0}.cp-countdown{font-size:12px;color:#a26100;font-weight:800}.cp-more{width:100%;border:1px solid #15212d;background:#fff;border-radius:13px;padding:14px;font-weight:800;margin:12px 0}</style><style id="cp-layout-fix">html,body{width:100%;max-width:100%;overflow-x:hidden}body{min-height:100dvh}main{box-sizing:border-box;width:100%;max-width:100%;margin:0 auto;padding:0 18px 130px!important}main>header#club-pop-student-header{box-sizing:border-box!important;width:calc(100% + 36px)!important;max-width:none!important;margin:0 -18px 20px!important;border-radius:0!important;padding-left:18px!important;padding-right:18px!important;transform:none!important}.navwrap{position:fixed!important;bottom:0!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(100%,460px)!important;padding:0 10px 10px!important;z-index:100!important;background:linear-gradient(transparent,#f4f6f8 35%)!important;border-radius:0!important;box-shadow:none!important}.nav.modern{box-sizing:border-box!important;width:100%!important;height:84px!important;min-height:84px!important;max-height:84px!important;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center!important;background:#fff!important;border:1px solid #e5e9ee!important;border-radius:24px!important;padding:6px!important;box-shadow:0 10px 30px #1112!important}.nav.modern button{box-sizing:border-box!important;min-width:0!important;height:70px!important;padding:0 2px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important;font-size:11px!important;line-height:13px!important;border-radius:18px!important}.nav.modern svg{width:25px!important;height:25px!important;min-width:25px!important;min-height:25px!important}.nav.modern span{font-size:11px!important;white-space:nowrap!important}.nav.modern .active{color:#078fcb!important;background:#eaf8fe!important}.cp-tools,.cp-voucher,.cp-stats{max-width:100%;min-width:0}.cp-search{box-sizing:border-box;max-width:100%;min-width:0}.cp-filters{max-width:100%;scrollbar-width:none}.cp-filters::-webkit-scrollbar{display:none}.cp-summary{box-sizing:border-box;max-width:100%}</style><style id="cp-voucher-compact">.cp-voucher .cp-detail{font-size:13px!important;line-height:1.45!important;padding:12px 15px 15px!important}.cp-voucher .cp-detail .code{font-size:13px!important;line-height:1.5!important;font-weight:700!important;letter-spacing:0!important;overflow-wrap:anywhere!important;margin:9px 0!important;background:#f4f7f9;padding:10px;border-radius:10px}.cp-voucher .cp-detail .sub{font-size:12px!important;margin:6px 0!important}.cp-voucher .cp-detail button{font-size:12px!important;padding:9px 12px!important;max-width:100%}.cp-voucher .cp-detail summary{font-size:13px!important;padding:10px!important}.cp-voucher .cp-detail p{font-size:12px!important}.cp-voucher .cp-summary{padding:14px!important}.cp-voucher .cp-title{font-size:15px!important}</style></head><body><main><header id="club-pop-student-header" class="cp-header-card cp-header-placeholder" aria-label="Cabeçalho Club Pop"></header><div class="page-title"><h1>🎟️ Meus vouchers</h1><div class="sub">Suas recompensas no Club Pop</div></div><p class="lead">Confira os códigos, os benefícios e a situação dos seus vouchers.</p><section id="claimPanel" hidden class="claim-panel"></section><div class="cp-stats"><div class="cp-stat"><b id="cpTotal">—</b><small>Gerados</small></div><div class="cp-stat"><b id="cpActive">—</b><small>Ativos</small></div><div class="cp-stat"><b id="cpExpired">—</b><small>Expirados</small></div></div><div class="cp-tools"><input id="cpSearch" class="cp-search" placeholder="Buscar benefício ou código"><div class="cp-filters"><button class="cp-filter selected" data-filter="all">Todos</button><button class="cp-filter" data-filter="active">Ativos</button><button class="cp-filter" data-filter="expired">Expirados</button><button class="cp-filter" data-filter="used">Utilizados</button></div></div><div id="list" class="empty">Carregando seus vouchers...</div><button id="cpMore" class="cp-more" hidden>Ver mais vouchers ↓</button></main><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H5V10"/></svg><span>Início</span></button><button onclick="location.href='/missoes.html'"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/></svg><span>Missões</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox="0 0 24 24"><path d="M4 9h16v12H4zM2 5h20v4H2zM12 5v16"/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg><span>Loja</span></button><button class="active" onclick="location.href='/perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button></nav></div><script src="/student-unit-theme.js"></script><script>
window.voucherNextStep=()=>'<section style="margin:18px 0;padding:18px;border-radius:16px;background:#eff9f7;text-align:center;line-height:1.6"><div><h3>Próximo passo</h3><img style="display:block;margin:12px auto;border-radius:17px" src="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f0/33/92/f0339285-8ca8-6868-3ad9-a93ea5f9aad6/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/512x512bb.jpg" alt="Aplicativo Bike Pop" width="72" height="72"><p>Acesse o aplicativo do Bike Pop, clique em <strong>Compras</strong> e finalize seu pedido colando o código do seu voucher.</p><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"><a style="display:block;padding:12px;border-radius:12px;background:#153b48;color:white;font-size:13px" href="https://apps.apple.com/us/app/bike-pop/id6744976326" target="_blank" rel="noopener noreferrer">iPhone · App Store</a><a style="display:block;padding:12px;border-radius:12px;background:#153b48;color:white;font-size:13px" href="https://play.google.com/store/apps/details?id=br.com.w12.bikepop" target="_blank" rel="noopener noreferrer">Android · Google Play</a></div></div></section>';

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),mid=params.get("mission"),gid=params.get("goal"),panel=document.getElementById("claimPanel");
function formatBrazilDate(value){if(!value)return "Data não informada";const raw=String(value).trim();const iso=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)?raw.replace(" ","T")+"Z":raw;const d=new Date(iso);return Number.isNaN(d.getTime())?"Data não informada":new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d)}
function unitLabel(v){const u=String(v||localStorage.getItem('clubpop_active_unit')||'club').toLowerCase();return u==='bike'?'Bike Pop':u==='gym'?'Gym Pop':'Club Pop'}
function voucherMeta(v){try{return JSON.parse(v.metadata_json||"{}")}catch{return {}}}
function planDetails(items){if(!items?.length)return '<p class="sub">Consulte a equipe para confirmar os planos, contratos e serviços participantes.</p>';return '<details style="margin-top:16px;text-align:left;border:1px solid #d9e2e8;border-radius:14px;padding:14px"><summary style="cursor:pointer;font-weight:700">Ver planos e contratos participantes ('+items.length+')</summary><ul style="padding-left:20px;line-height:1.9">'+items.map(x=>'<li>'+esc(x.name||'Contrato nº '+x.id)+'</li>').join('')+'</ul></details>'}
function showClaim(vouchers,pending=[]){if(!mid||!gid){panel.hidden=true;panel.innerHTML='';return}panel.hidden=false;const found=vouchers.find(v=>v.source_type==="MISSION"&&String(v.source_id)===gid&&String(voucherMeta(v).missionId)===mid),waiting=pending.find(x=>x.source_id===mid+":"+gid);
if(found){panel.innerHTML=voucherMeta(found).provider==="EVO"?'<div style="font-size:46px;animation:popIn .65s ease-out">🎉🎁✨</div><h2>Parabéns! Seu voucher chegou!</h2><p>Você conquistou um benefício especial. Copie o código abaixo e utilize nos planos ou serviços participantes da sua unidade.</p><div class="code" style="margin:16px auto">'+esc(found.code)+'</div><button type="button" class="copy-voucher" data-code="'+esc(found.code)+'">COPIAR MEU VOUCHER</button>'+planDetails(found.eligiblePlans)+window.voucherNextStep():'<h2>Resgate interno já registrado</h2><p>Este código anterior ainda precisa de confirmação. Solicite conferência à equipe.</p>';return}
if(waiting){if(['code_pending','review_required'].includes(String(waiting.status).toLowerCase())){panel.innerHTML='<h2>Seu voucher está em conferência</h2><p>Já existe uma solicitação para esta recompensa. A equipe do '+unitLabel()+' está conferindo o código. Não é necessário solicitar novamente.</p>';return}panel.innerHTML='<div style="font-size:38px">🎟️</div><h2>Seu voucher está chegando!</h2><p>Sua solicitação está na fila. O voucher aparecerá aqui quando estiver disponível.</p>';return}
panel.innerHTML='<h2>🎁 Sua conquista merece comemoração!</h2><p>Confirme para gerar seu voucher no '+unitLabel()+'.</p><button id="claimVoucher">RESGATAR VOUCHER</button>'}
let claiming=false;
async function redeem(){if(claiming)return;claiming=true;panel.innerHTML='<div class="claim-spin" role="status" aria-label="Processando"></div><h2>Preparando seu presente...</h2>';try{const token=sessionStorage.getItem("clubpop_token"),r=await fetch("/api/mission-redemptions?route=claim",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({missionId:mid,goalId:gid})}),d=await r.json();if(!r.ok||!d.ok){const messages={META_AINDA_NAO_ATINGIDA:"A meta ainda não foi confirmada nos dados sincronizados.",MISSAO_FORA_DO_PERIODO:"Este desafio não está no período ativo.",MODELO_VOUCHER_INDISPONIVEL:"O modelo de voucher está indisponível. Fale com a equipe.",VOUCHER_EVO_EXIGE_UMA_RECOMPENSA_POR_META:"Para emissão automática, a meta deve ter somente um voucher como recompensa.",TAREFA_SEM_COMPROVACAO_D1:"Esta tarefa ainda não possui comprovação suficiente para resgate automático.",RESGATE_ANTERIOR_INTERNO_REQUER_CONFERENCIA:"Este prêmio já tem um resgate interno. Solicite conferência à equipe."};throw Error(messages[d.error]||"Não foi possível emitir agora. Informe à equipe: "+(d.error||"falha de comunicação"))}await new Promise(resolve=>setTimeout(resolve,5000));await load();}catch(e){panel.innerHTML='<h2>Não foi possível confirmar a emissão</h2><p>'+esc(e.message)+'</p><p>Atualize a página para conferir a situação antes de tentar novamente.</p>'}finally{claiming=false}}
document.addEventListener("click",e=>{if(e.target.id==="claimVoucher")redeem()});
async function load(){const box=document.getElementById("list"),token=sessionStorage.getItem("clubpop_token");if(!token){location.replace("/");return}
try{const r=await fetch("/api/mission-redemptions?route=vouchers",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Não foi possível consultar seus vouchers");const vouchers=d.vouchers||[];showClaim(vouchers,d.pending||[]);if(!vouchers.length){box.className="empty";box.textContent="Você ainda não possui vouchers registrados.";return}
box.className="";window.cpVouchers=vouchers;window.cpShown=5;window.cpRenderVouchers=()=>{const q=(document.getElementById("cpSearch").value||"").toLowerCase(),f=window.cpFilter||"all",statusOf=v=>{const s=String(v.status||"").toUpperCase();if(["USED","REDEEMED"].includes(s))return "used";if(["EXPIRED","CANCELLED"].includes(s))return "expired";const expiry=v.expires_at||v.valid_until||v.expiration_date;if(expiry&&new Date(expiry.replace(" ","T")+(expiry.includes("Z")?"":"Z")).getTime()<Date.now())return "expired";return ["ACTIVE","ISSUED"].includes(s)?"active":"other"},list=vouchers.filter(v=>(f==="all"||statusOf(v)===f)&&[v.title,v.description,v.code].some(t=>String(t||"").toLowerCase().includes(q)));document.getElementById("cpTotal").textContent=vouchers.length;document.getElementById("cpActive").textContent=vouchers.filter(v=>statusOf(v)==="active").length;document.getElementById("cpExpired").textContent=vouchers.filter(v=>statusOf(v)==="expired").length;box.innerHTML=list.slice(0,window.cpShown).map(v=>{const st=statusOf(v),expires=v.expires_at||v.valid_until||v.expiration_date;const countdown=expires&&st==="active"?Math.max(0,Math.ceil((new Date(expires.replace(" ","T")+(expires.includes("Z")?"":"Z")).getTime()-Date.now())/86400000)):null;return '<article class="cp-voucher"><details><summary class="cp-summary"><span class="tag">'+esc(({active:"ATIVO",expired:"EXPIRADO",used:"UTILIZADO",other:"PENDENTE"})[st])+'</span><div class="cp-title">'+esc(v.title||v.description||"Voucher")+'</div><div class="cp-meta">Validade: '+esc(expires?formatBrazilDate(expires):"Não informada")+' · '+esc(unitLabel(v.unit))+'</div>'+(countdown!==null?'<div class="cp-countdown">Expira em '+countdown+' dia(s)</div>':'')+'</summary><div class="cp-detail">'+planDetails(v.eligiblePlans)+'<div class="code">'+esc(v.code||"Código indisponível")+'</div>'+(v.code&&st==="active"?'<button class="copy-voucher" data-code="'+esc(v.code)+'">Copiar código</button>'+window.voucherNextStep():'')+'<p class="sub">Origem: '+esc(({MISSION:"Missão",STORE:"Loja",PROMOTION:"Promoção",BENEFIT:"Benefício"})[String(v.source_type||"").toUpperCase()]||"Club Pop")+'</p><p class="sub">Resgate: '+esc(formatBrazilDate(v.requested_at))+'</p></div></details></article>'}).join("")||'<div class="empty">Nenhum voucher encontrado.</div>';document.getElementById("cpMore").hidden=window.cpShown>=list.length};window.cpRenderVouchers();
}catch(e){box.className="empty error";box.textContent="Não foi possível carregar seus vouchers: "+e.message}}
document.addEventListener("click",async e=>{const b=e.target.closest(".copy-voucher");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.code);b.textContent="Código copiado ✓"}catch(err){const range=document.createRange();range.selectNodeContents(b.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(range);b.textContent="Selecione e copie o código acima"}});
document.getElementById("cpSearch").oninput=()=>{window.cpShown=5;window.cpRenderVouchers?.()};document.querySelectorAll(".cp-filter").forEach(b=>b.onclick=()=>{window.cpFilter=b.dataset.filter;window.cpShown=5;document.querySelectorAll(".cp-filter").forEach(x=>x.classList.toggle("selected",x===b));window.cpRenderVouchers?.()});document.getElementById("cpMore").onclick=()=>{window.cpShown+=5;window.cpRenderVouchers?.()};load();
</script><script src="/beneficios-resgate.js"></script></body></html>
