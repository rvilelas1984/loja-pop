<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop | Landing reconstruída — Admin</title><link rel="stylesheet" href="/admin-common.css"><style>
:root{font-family:system-ui;color:#17202b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:30px 20px 80px}h1{margin:0 0 8px;font-size:30px}.sub{color:#667085;margin:0 0 24px}.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:#e6ebf3;color:#142034}.primary{background:#1456b8;color:white}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #dfe5ed;border-radius:16px;overflow:hidden;min-width:0}.card header{padding:17px;display:flex;align-items:center;gap:10px}.card header strong{flex:1}.card small{display:block;color:#667085;padding:0 17px 14px}.card .editor{border-top:1px solid #e9edf3;padding:18px;display:none}.card.open .editor{display:grid;gap:13px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#475467}.field input,.field textarea{width:100%;border:1px solid #ccd5e1;border-radius:9px;padding:11px;font:inherit}.field textarea{min-height:75px}.entry{border:1px solid #dbe2ea;border-radius:10px;padding:12px;display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row img{max-width:100%;max-height:130px;object-fit:contain}.state{font-size:13px;color:#526070;margin:10px 0}@media(max-width:720px){.cards{grid-template-columns:1fr}main{padding:18px 12px}} @media(max-width:900px){.cards{grid-template-columns:1fr!important}.card header{flex-wrap:wrap}.card header strong{flex:1 1 100%;overflow-wrap:anywhere}.card header button{flex:1 1 auto}.bar button,.bar a{max-width:100%;white-space:normal}}\n.published-link{display:inline-flex;align-items:center;justify-content:center;padding:11px 17px;background:#8c4bd4;color:#fff!important;text-decoration:none;border-radius:10px;font-weight:800;min-height:43px}.published-link:hover{background:#7434bf}.cards{align-items:start}.card{min-width:0;max-width:100%;overflow:hidden}.card.open{grid-column:1/-1;min-width:0}.card .editor,.card .field,.card .entry{min-width:0;max-width:100%;overflow-wrap:anywhere}.card .editor{grid-template-columns:minmax(0,1fr)}.card .field input,.card .field textarea{min-width:0;max-width:100%;overflow-wrap:anywhere}.card img,.entry img,.editor img{display:block!important;width:auto!important;height:auto!important;max-width:100%!important;max-height:260px!important;object-fit:contain!important;border-radius:10px}.card header{flex-wrap:wrap}.card header strong{min-width:0;overflow-wrap:anywhere}.card.open header strong{flex-basis:100%}.entry{overflow:hidden}.bar{align-items:center}.bar button,.bar a{flex:0 1 auto}.cp-admin-ready main{padding-top:100px!important}@media(max-width:850px){.cp-admin-ready main{padding-top:95px!important}.cards{grid-template-columns:minmax(0,1fr)!important}.card.open{grid-column:1}.card header{display:flex;flex-wrap:wrap}.card header strong{flex-basis:100%}.card header button{flex:1}.bar button,.bar a{flex:1 1 auto;text-align:center}.card .editor{padding:14px}.card img,.entry img,.editor img{max-height:220px!important}}@media(max-width:390px){.bar button,.bar a{width:100%}}</style></head><body><main><h1>Landing • Novo editor</h1><p class="sub">Reconstrução independente · 10 blocos · dois cartões por linha no desktop</p><div class="bar"><button id="save">Salvar rascunho</button><button id="preview" class="primary">Pré-visualizar</button><button id="publish" class="primary" type="button">Publicar Landing Page</button><a href="/landing-rebuild-preview.html?published=1" target="_blank" rel="noopener" class="published-link">Ver versão publicada ↗</a><button id="reset">Restaurar padrão</button></div><div id="status" class="state" role="status"></div><section id="cards" class="cards"></section></main><script src="/admin-common.js"></script><script>
const SCHEMA=[{"id":"identity","name":"Identidade Visual","hint":"Logo e favicon usados na Landing Page. Informe a URL do arquivo publicado (PNG, SVG, JPG ou ICO).","fields":{"logoUrl":"","faviconUrl":""}},{"id":"carousel","name":"1. Banner Carrossel","hint":"Configure cada banner separadamente: imagem e destino do clique.","fields":{"banners":[{"imageUrl":"https://drive.google.com/file/d/1O8HHvamXD6XzVQT_ufPkG6MoNMRLTUuH/view?usp=drive_link","linkUrl":"","newTab":false},{"imageUrl":"https://drive.google.com/file/d/1O8HHvamXD6XzVQT_ufPkG6MoNMRLTUuH/view?usp=drive_link","linkUrl":"","newTab":false}],"interval":"5"}},{"id":"hero","name":"2. Abertura / Hero","hint":"Primeiro quadro da página — “Você treina pelos seus objetivos...”","fields":{"eyebrow":"SEU TREINO. SUA CONSTÂNCIA. SUAS CONQUISTAS.","title":"Você treina pelos seus objetivos. O Club Pop recompensa o caminho.","text":"Transforme sua frequência em motivação: participe de missões, promoções e experiências que deixam cada treino ainda mais valioso.","imageUrl":"https://drive.google.com/thumbnail?id=1Rcaa1dh9LS5ArsUI3x3U2C72kj3W8ITY&sz=w1200","buttonText":"QUERO FAZER PARTE →","buttonUrl":"/login.html","buttonVisible":true,"buttonNewTab":false}},{"id":"features","name":"2. Resumo — Missões, Promoções, Fitcoins e Benefícios","hint":"As quatro caixas brancas logo abaixo da abertura.","fields":{"missionText":"Desafios que aproximam você dos seus objetivos.","promotionText":"Você já treina. Agora seu treino pode valer muito mais.","fitcoinsText":"Seu esforço vale. E agora também rende.","benefitsText":"Vantagens que acompanham a sua rotina."}},{"id":"how","name":"3. Como funciona","hint":"Seção “Sua frequência vira benefícios.”","fields":{"eyebrow":"COMO FUNCIONA","title":"Sua frequência vira benefícios.","text":"Quanto mais você se compromete com você mesmo, mais o Club Pop acompanha e reconhece sua jornada.","step1Title":"Faça suas aulas","step1Text":"Registre suas presenças e mantenha o ritmo.","step2Title":"Complete missões","step2Text":"Constância que te faz ir mais longe — com objetivos claros e recompensas.","step3Title":"Conquiste vantagens","step3Text":"Fitcoins, prêmios, descontos, experiências e promoções exclusivas."}},{"id":"promotion","name":"4. Promoção destaque","hint":"Quadro escuro “Seu próximo check-in pode valer muito mais.”","fields":{"eyebrow":"PROMOÇÕES QUE DÃO VONTADE DE PARTICIPAR","title":"Seu próximo check-in pode valer muito mais.","text":"Campanhas especiais transformam presença em chances, experiências e grandes prêmios. Continue treinando e acompanhe as promoções ativas no Club Pop.","buttonText":"VER MINHAS OPORTUNIDADES →","buttonUrl":"/login.html","buttonVisible":true,"buttonNewTab":false}},{"id":"missions","name":"5. Missões","hint":"Seção “Desafios que deixam você mais perto dos seus objetivos.”","fields":{"eyebrow":"MISSÕES","title":"Desafios que deixam você mais perto dos seus objetivos.","card1Title":"Constância semanal","card1Text":"Não é sobre treinar um dia. É sobre construir o hábito que muda seus resultados.","card2Title":"Metas de presença","card2Text":"Cada presença é mais um passo. Complete metas e desbloqueie novas recompensas.","card3Title":"Conquistas que motivam","card3Text":"Seu progresso merece ser visto, celebrado e recompensado."}},{"id":"partners","name":"6. Academias parceiras","hint":"Seção “Onde sua jornada acontece.”","fields":{"eyebrow":"ACADEMIAS PARCEIRAS","title":"Onde sua jornada acontece.","text":"O Club Pop Fit conecta alunos e academias em uma experiência que valoriza frequência e relacionamento.","partners":[{"name":"BIKE POP","logoUrl":""},{"name":"GYM POP","logoUrl":""}]}},{"id":"header","name":"7. Botão do topo — Acessar Club Pop","hint":"Botão verde no cabeçalho da Landing Page.","fields":{"buttonText":"Acessar Club Pop →","buttonUrl":"/login.html","buttonVisible":true,"buttonNewTab":false}},{"id":"footer","name":"8. Rodapé","hint":"Informações exibidas no final da página.","fields":{"brand":"CLUB POP FIT","tagline":"Treine. Conquiste. Evolua.","text":"Academias parceiras: Bike Pop • Gym Pop"}}];
const KEY='clubpop_landing_rebuild_admin_v1';
let state=load();const cards=document.getElementById('cards'),status=document.getElementById('status');
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.blocks)&&saved.blocks.length===SCHEMA.length)return saved}catch{}return{version:1,blocks:SCHEMA.map((x,i)=>({id:x.id,order:i,active:true,fields:structuredClone(x.fields)}))}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));status.textContent='Rascunho salvo neste navegador. Nenhum dado foi publicado.'}
function field(parent,label,value,callback){const wrap=document.createElement('div');wrap.className='field';const title=document.createElement('label');title.textContent=label;const input=typeof value==='string'&&value.length>110?document.createElement('textarea'):document.createElement('input');if(input.tagName==='INPUT')input.type='text';input.value=value??'';input.addEventListener('input',()=>callback(input.value));wrap.append(title,input);parent.append(wrap);return input}
function normalizeImageUrl(value){try{const u=new URL(String(value||""),location.origin);if(!["http:","https:"].includes(u.protocol))return "";if(u.hostname==="drive.google.com"){const match=u.pathname.match(/\/file\/d\/([^/]+)/);const id=match?.[1]||u.searchParams.get("id");if(id)return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1200"}return u.href}catch{return ""}}
function image(parent,url){if(!url)return;const img=document.createElement('img');img.alt='Imagem cadastrada';img.src=normalizeImageUrl(url);img.loading='lazy';img.addEventListener('error',()=>{img.alt='Imagem indisponível — confira a URL';img.remove();const error=document.createElement('small');error.textContent='Não foi possível carregar esta imagem. Confira as permissões públicas do Drive e o link.';parent.append(error)});parent.append(img)}
function render(){cards.replaceChildren();for(const spec of SCHEMA){const block=state.blocks.find(x=>x.id===spec.id);const card=document.createElement('article');card.className='card';const head=document.createElement('header');const title=document.createElement('strong');title.textContent=spec.name;const toggle=document.createElement('button');toggle.textContent=block.active?'Ativo':'Oculto';toggle.onclick=()=>{block.active=!block.active;toggle.textContent=block.active?'Ativo':'Oculto';persist()};const edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>{card.classList.toggle('open');edit.textContent=card.classList.contains('open')?'Fechar':'Editar'};head.append(title,toggle,edit);const hint=document.createElement('small');hint.textContent=spec.hint;const body=document.createElement('div');body.className='editor';for(const [key,value] of Object.entries(block.fields)){if(Array.isArray(value)){const section=document.createElement('div');section.className='field';const label=document.createElement('label');label.textContent=key==='banners'?'Banners do carrossel':'Academias parceiras';section.append(label);const entries=document.createElement('div');entries.className='field';const paint=()=>{entries.replaceChildren();value.forEach((item,index)=>{const entry=document.createElement('div');entry.className='entry';for(const [k,v] of Object.entries(item)){if(typeof v==='boolean'){const row=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=v;check.onchange=()=>{item[k]=check.checked;persist()};row.append(check,document.createTextNode(' '+k));entry.append(row)}else field(entry,k,v,t=>{item[k]=t;persist();if(k==='imageUrl'||k==='logoUrl'){const preview=entry.querySelector('img');if(preview){if(t)preview.src=normalizeImageUrl(t);else preview.remove()}else if(t)image(entry,t)}})}image(entry,item.imageUrl||item.logoUrl);const remove=document.createElement('button');remove.textContent='Remover';remove.onclick=()=>{value.splice(index,1);paint();persist()};entry.append(remove);entries.append(entry)})};paint();const add=document.createElement('button');add.textContent='+ Adicionar';add.onclick=()=>{value.push(key==='banners'?{imageUrl:'',linkUrl:'',newTab:false}:{name:'',logoUrl:''});paint();persist()};section.append(entries,add);body.append(section)}else if(typeof value==='boolean'){const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=value;check.onchange=()=>{block.fields[key]=check.checked;persist()};label.append(check,document.createTextNode(' '+key));body.append(label)}else {{const input=field(body,key,value,t=>{block.fields[key]=t;persist();if(key==='imageUrl'||key==='logoUrl'||key==='faviconUrl'){const parent=input.parentElement;let img=parent.querySelector('img');if(!t){if(img)img.remove()}else if(img){img.src=normalizeImageUrl(t)}else image(parent,t)}});if(key==='imageUrl'||key==='logoUrl'||key==='faviconUrl')image(input.parentElement,value)}}}const saveBlock=document.createElement('button');saveBlock.type='button';saveBlock.className='primary';saveBlock.textContent='Salvar bloco ✓';saveBlock.onclick=()=>{persist();card.classList.remove('open');edit.textContent='Editar';status.textContent='Bloco '+spec.name+' salvo no rascunho deste navegador.'};body.append(saveBlock);card.append(head,hint,body);cards.append(card)}}
document.getElementById('save').onclick=persist;document.getElementById('reset').onclick=()=>{if(!confirm('Restaurar os textos padrão e remover todos os links de imagens do rascunho? A versão publicada não será alterada.'))return;state={version:1,blocks:SCHEMA.map((x,i)=>{const fields=structuredClone(x.fields);const clearImages=obj=>{if(Array.isArray(obj)){obj.forEach(clearImages);return}if(obj&&typeof obj==='object')for(const k of Object.keys(obj)){if(/^(imageUrl|logoUrl|faviconUrl)$/i.test(k))obj[k]='';else clearImages(obj[k])}};clearImages(fields);return{id:x.id,order:i,active:true,fields}})};persist();render();status.textContent='Textos padrão restaurados; todos os links de imagens foram removidos do rascunho.'};document.getElementById('preview').onclick=()=>{try{persist();window.open('/landing-rebuild-preview.html','_blank','noopener')}catch(e){status.textContent='Erro ao abrir a prévia: '+e.message}};document.getElementById('publish').onclick=async()=>{if(!confirm('Publicar esta versão oficialmente? O rascunho atual substituirá a landing publicada.'))return;const button=document.getElementById('publish');button.disabled=true;status.textContent='Publicando no servidor...';try{persist();const response=await fetch('/api/content',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({section:'landingPageRebuild',value:state})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'Servidor não confirmou a publicação.');status.textContent='Landing publicada com sucesso no servidor em '+new Date().toLocaleString('pt-BR')+'.';}catch(e){status.textContent='Falha ao publicar: '+e.message}finally{button.disabled=false}};render();
</script></body></html>
