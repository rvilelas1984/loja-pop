<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Promoções</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui}.top{display:flex;justify-content:space-between;align-items:center}.ey{font-size:11px;color:#777;font-weight:900}h1{margin:4px 0}.primary,.btn{border:0;background:#111;color:#fff;border-radius:11px;padding:13px 16px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.block{background:#fff;border:1px solid #e2e6ea;border-radius:18px}.stat{padding:18px}.stat small{font-size:10px;color:#777}.stat strong{display:block;font-size:27px;margin-top:7px}.block{margin:14px 0;overflow:hidden}.head{padding:18px 20px;display:flex;justify-content:space-between;cursor:pointer}.head h2{margin:0;font-size:16px}.head p{margin:4px 0 0;color:#777;font-size:11px}.body{padding:0 20px 20px}.closed .body{display:none}.promo{border:1px solid #e5e8ec;border-radius:14px;padding:14px;margin-top:9px;display:flex;justify-content:space-between;gap:12px}.promo p{font-size:11px;color:#777;margin:4px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini{border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900}.danger{color:#b53b43}.editor{display:none}.editor.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:12px}.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.notice{background:#eef8fc;border-radius:12px;padding:12px;font-size:11px}.req{display:grid;grid-template-columns:1fr 1.2fr 100px 40px;gap:8px;margin-top:8px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid,.req{grid-template-columns:1fr}.promo{display:block}}</style></head><body><main><div class="top"><div><div class="ey">CAMPANHAS DO ALUNO</div><h1>Promoções</h1></div><button class="primary" id="new">+ Nova promoção</button></div><section class="stats"><div class="stat"><small>PROMOÇÕES ATIVAS</small><strong id="sActive">0</strong></div><div class="stat"><small>BIKE POP</small><strong id="sBike">0</strong></div><div class="stat"><small>GYM POP</small><strong id="sGym">0</strong></div><div class="stat"><small>CLUB POP</small><strong id="sClub">0</strong></div></section><section class="block closed" id="listBlock"><div class="head"><div><h2>Promoções cadastradas</h2><p>Campanhas por unidade ou combinadas.</p></div><b>⌄</b></div><div class="body" id="list"></div></section><section class="block editor" id="editor"><div class="head"><div><h2 id="edTitle">Nova promoção</h2><p>Defina escopo, regras e participação.</p></div></div><div class="body"><div class="grid"><div class="field"><label>UNIDADE / ESCOPO</label><select id="unit"><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option><option value="club">Club Pop • combinar unidades</option></select></div><div class="field"><label>STATUS</label><select id="status"><option>Ativo</option><option>Inativo</option><option>Rascunho</option></select></div><div class="field full"><label>NOME</label><input id="name"></div><div class="field"><label>INÍCIO</label><input id="start" type="date"></div><div class="field"><label>FIM</label><input id="end" type="date"></div><div class="field"><label>NÚMEROS POR PRESENÇA</label><input id="per" type="number" min="0" value="1"></div><div class="field"><label>REINÍCIO</label><select id="reset"><option value="monthly">Mensal</option><option value="campaign">Campanha inteira</option></select></div><div class="field full"><label>TEXTO PARA O ALUNO</label><textarea id="text"></textarea></div><div class="field full"><label>REGRAS COMPLETAS</label><textarea id="rules"></textarea></div><div class="field full"><label>BANNER</label><input id="banner" placeholder="Link da imagem"></div></div><div class="field"><label>REQUISITOS DE PARTICIPAÇÃO</label><div class="notice">Para Club Pop você pode exigir combinações entre Bike e Gym. Atividades são selecionadas do cache EVO.</div><div id="requirements"></div><button class="mini" id="addReq">+ Adicionar requisito</button></div><div class="actions" style="margin-top:14px"><button class="btn" id="save">Salvar promoção</button><button class="mini" id="cancel">Cancelar</button></div></div></section></main><script src="/admin-common.js"></script><script>
let D={},editId=null;const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function get(){D=await(await fetch("/api/content",{cache:"no-store"})).json();D.promotions??=[];D.evoCache??={activities:{bike:[],gym:[]}}}async function put(){const r=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error("Falha ao salvar")}function acts(u){return D.evoCache?.activities?.[u]||[]}function reqRow(r={}){const x=document.createElement("div");x.className="req";x.innerHTML='<select class="ru"><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select><select class="ra"></select><input class="rq" type="number" min="1" value="'+(r.quantity||1)+'"><button class="mini danger">×</button>';x.querySelector(".ru").value=r.unit||"bike";const fill=()=>{const a=x.querySelector(".ra");a.innerHTML='<option value="*">Qualquer atividade</option>'+acts(x.querySelector(".ru").value).map(v=>'<option>'+esc(v.name||v)+'</option>').join("");a.value=r.activity||"*"};x.querySelector(".ru").onchange=fill;x.querySelector("button").onclick=()=>x.remove();fill();requirements.append(x)}
function render(){const a=D.promotions.filter(x=>x.status==="Ativo");sActive.textContent=a.length;sBike.textContent=a.filter(x=>x.unit==="bike").length;sGym.textContent=a.filter(x=>x.unit==="gym").length;sClub.textContent=a.filter(x=>x.unit==="club").length;list.innerHTML=D.promotions.length?D.promotions.map(p=>'<div class="promo"><div><b>'+esc(p.name)+'</b><p>'+({bike:"Bike Pop",gym:"Gym Pop",club:"Club Pop"}[p.unit||"bike"])+' • '+esc(p.status)+'</p></div><div class="actions"><button class="mini" onclick="editPromo(\''+p.id+'\')">EDITAR</button><button class="mini" onclick="togglePromo(\''+p.id+'\')">'+(p.status==="Ativo"?"DESATIVAR":"ATIVAR")+'</button><button class="mini danger" onclick="deletePromo(\''+p.id+'\')">EXCLUIR</button></div></div>').join(""):'<p>Nenhuma promoção cadastrada.</p>'}
function open(p={}){editId=p.id||null;editor.classList.add("show");edTitle.textContent=p.id?"Editar promoção":"Nova promoção";unit.value=p.unit||"bike";status.value=p.status||"Ativo";name.value=p.name||"";start.value=p.start||"";end.value=p.end||"";per.value=p.numbersPerAttendance??1;reset.value=p.reset||"monthly";text.value=p.dashboardText||"";rules.value=p.rules||"";banner.value=p.bannerUrl||"";requirements.innerHTML="";(p.requirements||[{}]).forEach(reqRow);editor.scrollIntoView({behavior:"smooth"})}window.editPromo=id=>open(D.promotions.find(x=>x.id===id));window.deletePromo=async id=>{if(!confirm("Excluir esta promoção?"))return;D.promotions=D.promotions.filter(x=>x.id!==id);await put();render()};window.togglePromo=async id=>{const p=D.promotions.find(x=>x.id===id);p.status=p.status==="Ativo"?"Inativo":"Ativo";await put();render()};listBlock.querySelector(".head").onclick=()=>listBlock.classList.toggle("closed");new.onclick=()=>open();cancel.onclick=()=>editor.classList.remove("show");addReq.onclick=()=>reqRow();save.onclick=async()=>{const reqs=[...document.querySelectorAll(".req")].map(x=>({unit:x.querySelector(".ru").value,activity:x.querySelector(".ra").value,quantity:Number(x.querySelector(".rq").value)||1}));if(unit.value!=="club"&&reqs.some(x=>x.unit!==unit.value))return alert("Requisito de unidade incompatível.");const old=D.promotions.find(x=>x.id===editId)||{},p={...old,id:editId||"promo-"+Date.now(),unit:unit.value,status:status.value,name:name.value.trim(),start:start.value,end:end.value,numbersPerAttendance:Number(per.value)||0,reset:reset.value,dashboardText:text.value.trim(),rules:rules.value.trim(),bannerUrl:banner.value.trim(),requirements:reqs};if(!p.name||!p.start||!p.end)return alert("Preencha nome, início e fim.");const i=D.promotions.findIndex(x=>x.id===p.id);i>=0?D.promotions[i]=p:D.promotions.push(p);await put();editor.classList.remove("show");render()};get().then(render);
</script></body></html>
