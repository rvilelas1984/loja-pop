<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Promoções</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui;color:#111}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#111;color:#fff;padding:25px 18px}.logo{font-size:21px;font-weight:950}.logo span{color:#08a9e3}nav{display:grid;gap:5px;margin-top:28px}nav a{color:#aaa;text-decoration:none;padding:12px;border-radius:10px;font-size:12px;font-weight:800}nav a.on{background:#fff;color:#111}main{padding:28px;max-width:1100px;width:100%;margin:auto}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0}.btn{border:0;border-radius:10px;padding:11px 13px;font-size:10px;font-weight:900;cursor:pointer}.dark{background:#111;color:#fff}.ghost{background:#fff;border:1px solid #dfe4e8}.danger{color:#b83d46}.panel,.card{background:#fff;border:1px solid #e1e6ea;border-radius:18px;padding:17px;margin-top:15px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{font-size:9px;font-weight:900;color:#087fb1}.muted{font-size:10px;color:#777}.form{display:none}.form.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:10px}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fafafa}.field textarea{height:70px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.empty{padding:25px;text-align:center;color:#888;font-size:11px}@media(max-width:760px){.layout{display:block}aside{display:none}main{padding:18px}.cards,.grid{grid-template-columns:1fr}.top{align-items:flex-start}}</style></head><script>(async()=>{try{const r=await fetch("/api/admin-auth?route=me",{cache:"no-store"});if(!r.ok)location.replace("/admin-login.html")}catch{location.replace("/admin-login.html")}})();</script><body><div class="layout"><aside><div class="logo">CLUB <span>POP</span></div><nav><a href="/admin.html">Dashboard</a><a href="/admin-importacoes.html">Alunos</a><a href="/admin-missoes.html">Missões</a><a href="/admin-loja.html">Loja</a><a href="/admin-beneficios.html">Benefícios</a><a class="on">Promoções</a></nav></aside><main><div class="top"><div><div class="muted">GESTÃO DO ALUNO</div><h1>Promoções</h1></div><button class="btn dark" id="newBtn">+ NOVA PROMOÇÃO</button></div><section class="panel"><b>Promoções cadastradas</b><div class="cards" id="cards"></div></section><section class="panel form" id="form"><div class="row"><b id="formTitle">Nova promoção</b><button class="btn ghost" id="close">FECHAR</button></div><input type="hidden" id="id"><div class="grid"><div class="field"><label>UNIDADE</label><select id="unit"><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option><option value="club">Club Pop • combina as duas</option></select></div><div class="field"><label>NOME</label><input id="name"></div><div class="field"><label>STATUS</label><select id="status"><option>Ativo</option><option>Rascunho</option><option>Inativo</option></select></div><div class="field"><label>INÍCIO</label><input id="start" type="date"></div><div class="field"><label>FIM</label><input id="end" type="date"></div><div class="field"><label>NÚMEROS POR PRESENÇA</label><input id="per" type="number" min="0" value="1"></div><div class="field"><label>REINÍCIO</label><select id="reset"><option value="monthly">Mensal</option><option value="campaign">Campanha inteira</option></select></div><div class="field"><label>MARCO 1 • PRESENÇAS</label><input id="m1a" type="number" value="8"></div><div class="field"><label>MARCO 1 • BÔNUS</label><input id="m1b" type="number" value="5"></div><div class="field"><label>MARCO 2 • PRESENÇAS</label><input id="m2a" type="number" value="12"></div><div class="field"><label>MARCO 2 • BÔNUS</label><input id="m2b" type="number" value="10"></div></div><div class="field"><label>TEXTO PARA O ALUNO</label><textarea id="text"></textarea></div><div class="field"><label>URL DO BANNER</label><input id="banner" placeholder="https://..."></div><button class="btn dark" id="save" style="margin-top:12px;width:100%">SALVAR PROMOÇÃO</button></section></main></div><script>
let data={promotions:[]};const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function get(){const r=await fetch("/api/content",{cache:"no-store"});data=await r.json();data.promotions=data.promotions||[];render()}
async function put(){const r=await fetch("/api/content",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||"Falha ao salvar")}
function unitLabel(u){return u==="gym"?"GYM POP":u==="club"?"CLUB POP":"BIKE POP"}
function render(){cards.innerHTML=data.promotions.length?data.promotions.map((p,i)=>{const ms=p.milestones||[];return '<article class="card"><span class="tag">'+esc((p.status||"Rascunho").toUpperCase())+' • '+unitLabel(p.unit)+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.start||"—")+' → '+esc(p.end||"—")+' • '+Number(p.numbersPerAttendance||0)+' por presença</div><div class="actions"><button class="btn dark" onclick="edit('+i+')">EDITAR</button><button class="btn ghost" onclick="toggle('+i+')">'+(p.status==="Ativo"?"DESATIVAR":"ATIVAR")+'</button><button class="btn ghost danger" onclick="del('+i+')">EXCLUIR</button></div></article>'}).join(""):'<div class="empty">Nenhuma promoção cadastrada.</div>'}
function openForm(p={}){form.classList.add("open");formTitle.textContent=p.id?"Editar promoção":"Nova promoção";id.value=p.id||"";unit.value=p.unit||"bike";name.value=p.name||"";status.value=p.status||"Ativo";start.value=p.start||"";end.value=p.end||"";per.value=p.numbersPerAttendance??1;reset.value=p.reset||"monthly";const m=p.milestones||[];m1a.value=m[0]?.attendance??8;m1b.value=m[0]?.bonus??5;m2a.value=m[1]?.attendance??12;m2b.value=m[1]?.bonus??10;text.value=p.dashboardText||"";banner.value=p.bannerUrl||"";form.scrollIntoView({behavior:"smooth"})}
newBtn.onclick=()=>openForm();close.onclick=()=>form.classList.remove("open");window.edit=i=>openForm(data.promotions[i]);window.toggle=async i=>{data.promotions[i].status=data.promotions[i].status==="Ativo"?"Inativo":"Ativo";try{await put();render()}catch(e){alert(e.message)}};window.del=async i=>{if(!confirm("Excluir esta promoção?"))return;data.promotions.splice(i,1);try{await put();render()}catch(e){alert(e.message)}};
save.onclick=async()=>{if(!name.value.trim()||!start.value||!end.value)return alert("Preencha nome, início e fim.");const old=data.promotions.find(x=>x.id===id.value);const p={...(old||{}),id:id.value||("promo-"+Date.now()),unit:unit.value,name:name.value.trim(),status:status.value,start:start.value,end:end.value,bannerUrl:banner.value.trim(),dashboardText:text.value.trim(),reset:reset.value,numbersPerAttendance:Number(per.value||0),milestones:[{attendance:Number(m1a.value||0),bonus:Number(m1b.value||0)},{attendance:Number(m2a.value||0),bonus:Number(m2b.value||0)}]};const ix=data.promotions.findIndex(x=>x.id===p.id);if(ix>=0)data.promotions[ix]=p;else data.promotions.push(p);save.disabled=true;try{await put();form.classList.remove("open");render();alert("Promoção salva e publicada.")}catch(e){alert(e.message)}finally{save.disabled=false}};
get().catch(e=>cards.innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script></body></html>
