<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Login</title><meta name="theme-color" content="#111318"><link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Inter,system-ui;color:#111318;padding:18px}.box{width:min(410px,100%);background:#fff;border:1px solid #e5e9ee;border-radius:26px;padding:28px}.logo{font-size:24px;font-weight:950}.logo span{color:#08a9e3}input,button{width:100%;height:52px;border-radius:14px;margin-top:12px}input{border:1px solid #dfe4e8;padding:0 14px}button{border:0;background:#111;color:#fff;font-weight:900}.msg{margin-top:10px;color:#b83d46}</style></head><body><main class="box"><div class="logo">CLUB <span>POP</span></div><h1>Acesso</h1><p>Entre com seu e-mail e PIN. O acesso administrativo antigo por PIN continua disponível.</p><input id="email" type="email" placeholder="E-mail (usuários cadastrados)"><input id="pw" type="password" inputmode="numeric" placeholder="Seu PIN"><button id="go">ENTRAR →</button><div id="msg" class="msg"></div></main><script>async function check(){const r=await fetch("/api/admin-auth?route=me",{cache:"no-store"});if(r.ok){const d=await r.json();location.replace(d.role==="reception"?"/tela-checkin.html":"/admin.html")}}check();go.onclick=async()=>{go.disabled=true;msg.textContent="Validando...";try{const r=await fetch("/api/admin-auth?route=login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:pw.value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Acesso negado");location.replace(d.role==="reception"?"/tela-checkin.html":"/admin.html")}catch(e){msg.textContent=e.message;go.disabled=false}};pw.onkeydown=e=>{if(e.key==="Enter")go.click()}</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/admin-sw.js").catch(()=>{});</script></body></html>
