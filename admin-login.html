<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Login</title><meta name="theme-color" content="#111318"><link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Inter,system-ui;color:#111318;padding:18px}.box{width:min(410px,100%);background:#fff;border:1px solid #e5e9ee;border-radius:26px;padding:28px;box-shadow:0 18px 50px #1112}.logo{font-size:24px;font-weight:950}.logo span{color:#08a9e3}.ey{margin-top:28px;font-size:10px;color:#7a828c;font-weight:900;letter-spacing:1.4px}h1{font-size:28px;margin:5px 0 7px}p{font-size:12px;color:#747b86;line-height:1.5}label{display:block;font-size:10px;font-weight:900;margin:23px 0 7px}input{width:100%;height:52px;border:1px solid #dfe4e8;border-radius:14px;padding:0 14px;font-size:16px;outline:none}button{width:100%;height:50px;margin-top:13px;border:0;border-radius:14px;background:#111;color:#fff;font-weight:900}.msg{min-height:18px;margin-top:10px;color:#b83d46;font-size:11px}</style></head><body><main class="box"><div class="logo">CLUB <span>POP</span></div><div class="ey">ÁREA RESTRITA</div><h1>Administrativo</h1><p>Entre com sua senha administrativa para acessar a gestão do Club Pop.</p><label>SENHA ADMINISTRATIVA</label><input id="pw" type="password" autocomplete="current-password" placeholder="Sua senha"><button id="go">ENTRAR NO ADMIN →</button><div class="msg" id="msg"></div></main><script>async function check(){const r=await fetch("/api/admin-auth?route=me",{cache:"no-store"});if(r.ok)location.replace("/admin.html")}check();go.onclick=async()=>{go.disabled=true;msg.textContent="Validando acesso...";try{const r=await fetch("/api/admin-auth?route=login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Acesso negado");location.replace("/admin.html")}catch(e){msg.textContent=e.message;go.disabled=false}};pw.addEventListener("keydown",e=>{if(e.key==="Enter")go.click()})</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/admin-sw.js").catch(()=>{});</script></body></html>
