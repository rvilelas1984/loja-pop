<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Links Úteis | Club Pop</title><link rel="stylesheet" href="/admin-common.css"><style>body{font:15px system-ui;background:#f5f6f8;margin:0;color:#24242a}main{max-width:960px;margin:30px auto;padding:16px}.card{background:white;border:1px solid #e7e7ea;border-radius:18px;padding:24px}h1{margin:0 0 20px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric{background:#f6f3fa;border-radius:12px;padding:15px}.metric b{display:block;font-size:26px;margin-top:7px}a{color:#7126a9}.muted{color:#777}button{border:0;background:#7126a9;color:white;padding:12px;border-radius:9px;cursor:pointer}</style><main><h1>Links Úteis</h1><section class="card"><h2>Aula experimental</h2><p><a href="/aula-experimental" target="_blank">www.clubpopfit.com.br/aula-experimental</a></p><div class="metrics" id="metrics"></div><p class="muted" id="status">Consultando métricas…</p><button onclick="load()">Atualizar indicadores</button><p class="muted">Somente dados persistidos pelo backend devem aparecer como métricas. Etapas autodeclaradas não são conversões confirmadas.</p></section></main><script src="/admin-common.js"></script><script>const labels=[["page_views","Acessos"],["unique_sessions","Sessões únicas"],["cadastro_clicks","Cliques no cadastro"],["pagamento_clicks","Cliques no pagamento"],["agendamento_clicks","Cliques no agendamento"],["confirmed_conversions","Conversões confirmadas"]];async function load(){const el=document.getElementById("metrics"),status=document.getElementById("status");el.innerHTML="";try{const r=await fetch("/api/links-uteis/stats?link=aula-experimental",{credentials:"same-origin"});if(!r.ok)throw Error("API indisponível ("+r.status+")");const d=await r.json();for(const [key,label]of labels){const item=document.createElement("div");item.className="metric";const name=document.createElement("span");name.textContent=label;const val=document.createElement("b");val.textContent=Number.isFinite(Number(d[key]))?Number(d[key]).toLocaleString("pt-BR"):"—";item.append(name,val);el.append(item)}status.textContent="Dados fornecidos pela API do Club Pop."}catch(e){status.textContent="Indicadores indisponíveis: endpoint de métricas ainda precisa ser integrado ao Worker. Nenhum número foi inventado.";}}load()</script></html>
