<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop — Relatos dos alunos</title><link rel="stylesheet" href="/admin-common.css"><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f6f8;color:#171b21;margin:0}main{max-width:1120px;margin:auto;padding:28px 18px 90px}h1{font-size:28px}.panel{background:white;border:1px solid #e1e5e9;border-radius:18px;padding:18px;margin:14px 0}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input,textarea,button{font:inherit;padding:11px;border:1px solid #d8dfe6;border-radius:10px}button{cursor:pointer;background:#15191f;color:white}button:disabled{opacity:.5;cursor:not-allowed}.report{border-bottom:1px solid #e5e9ed;padding:16px 0}.report:last-child{border:0}.meta{color:#647080;font-size:12px;line-height:1.7}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.report p{white-space:pre-wrap;overflow-wrap:anywhere}.edit{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.edit textarea{flex:1 1 260px;min-height:60px}#notice{min-height:24px;color:#a13d32}details summary{cursor:pointer;font-weight:800}small{color:#67717e}</style></head><body><main><h1>Relatos dos Alunos</h1><p>Central de acompanhamento de problemas informados pelos alunos durante o beta.</p><div class="panel filters"><select id="unit"><option value="club">Todas as unidades</option><option value="bike">Bike Pop</option><option value="gym">Gym Pop</option></select><select id="status"><option value="">Todas as situações</option><option value="aberto">Aberto</option><option value="em_analise">Em análise</option><option value="aguardando_aluno">Aguardando aluno</option><option value="resolvido">Resolvido</option><option value="encerrado">Encerrado</option></select><button id="refresh">Atualizar</button></div><div id="notice" role="status"></div><section class="panel" id="reports">Carregando relatos...</section></main><script src="/admin-common.js"></script><script type="module">
const $=id=>document.getElementById(id), statuses=['aberto','em_analise','aguardando_aluno','resolvido','encerrado'],priorities=['baixa','media','alta','critica'];const names={aberto:'Aberto',em_analise:'Em análise',aguardando_aluno:'Aguardando aluno',resolvido:'Resolvido',encerrado:'Encerrado'};let items=[];
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
function selector(values,value,labels){const s=el('select');values.forEach(v=>{const o=el('option',labels?.[v]||v);o.value=v;s.append(o)});s.value=value;return s}
async function request(payload){const url='/api/admin-auth?route=student-issues&unit='+encodeURIComponent($('unit').value)+(payload?'':'&status='+encodeURIComponent($('status').value));const r=await fetch(url,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível acessar os relatos');return d}
async function load(){const host=$('reports');host.textContent='Carregando...';$('notice').textContent='';try{const d=await request();items=Array.isArray(d.items)?d.items:[];render()}catch(e){host.textContent='Relatos indisponíveis. '+e.message}}
function render(){const host=$('reports');host.replaceChildren();if(!items.length){host.textContent='Nenhum relato encontrado.';return}items.forEach(item=>{const card=el('article',undefined,'report'),header=el('div',undefined,'row'),title=el('strong',item.member_name+' · '+item.area),state=el('span',names[item.status]||item.status);header.append(title,state);card.append(header,el('div','ID EVO: '+(item.evo_member_id||'Não vinculado')+' · Unidade: '+item.unit+' · Criado: '+item.created_at,'meta'),el('p',item.description));const details=el('details'),summary=el('summary','Acompanhar atendimento'),form=el('div',undefined,'edit'),status=selector(statuses,item.status,names),priority=selector(priorities,item.priority),note=el('textarea');note.placeholder='Observação da equipe / contato realizado';const save=el('button','Salvar acompanhamento');save.onclick=async()=>{save.disabled=true;try{await request({id:item.id,status:status.value,priority:priority.value,note:note.value});await load()}catch(e){$('notice').textContent=e.message;save.disabled=false}};form.append(status,priority,note,save);details.append(summary,form);card.append(details);host.append(card)})}
$('refresh').onclick=load;$('unit').onchange=load;$('status').onchange=load;load();
</script></body></html>
