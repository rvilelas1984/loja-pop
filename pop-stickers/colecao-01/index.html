<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POP Stickers — Biblioteca</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:#140e20;color:#fff}main{max-width:760px;margin:auto;padding:22px 16px}h1{margin:0 0 6px;color:#ff68c5;font-size:27px}.sub{color:#cbbbd4;margin-bottom:22px}input{width:100%;padding:15px;border:1px solid #654a80;background:#2b203b;border-radius:15px;color:white;font:inherit}#status{margin:14px 0;color:#d8c5df}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{border:1px solid #543866;border-radius:18px;background:#291c38;padding:12px;min-height:170px;text-align:center}.image{display:grid;place-items:center;min-height:130px;border-radius:12px;background:linear-gradient(145deg,#4a345d,#1c1528);overflow:hidden}.image img{max-width:100%;max-height:150px;object-fit:contain}.name{font-weight:700;margin-top:10px}.tag{font-size:11px;color:#ff9ddd}.pending{font-size:13px;color:#cbbbd4;padding:30px 8px}.notice{background:#30203f;border:1px solid #624273;padding:12px;border-radius:12px;margin-bottom:16px;font-size:13px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><h1>💜 POP Stickers</h1><div class="sub">Coleção 01 · TÁ PAGO!</div><div class="notice">Galeria em preparação. As figurinhas só serão liberadas quando os arquivos PNG estiverem publicados e validados.</div><input id="q" placeholder="Pesquisar: tá pago, bike, gym, treino..." aria-label="Pesquisar figurinhas"><div id="status"></div><div class="grid" id="grid"></div></main><script>const q=document.querySelector('#q'),grid=document.querySelector('#grid'),status=document.querySelector('#status');let items=[];function render(){const term=q.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const found=items.filter(x=>[x.title,x.variant,...x.keywords].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(term));status.textContent=found.length+' modelos encontrados';grid.replaceChildren();for(const x of found){const card=document.createElement('article');card.className='item';const img=document.createElement('div');img.className='image';if(x.available){const el=document.createElement('img');el.src=x.image;el.alt=x.title+' — '+x.variant;el.onerror=()=>{img.textContent='Imagem indisponível';};img.append(el)}else{img.className+=' pending';img.textContent='Aguardando publicação da figurinha'}const name=document.createElement('div');name.className='name';name.textContent=x.title;const variant=document.createElement('div');variant.className='tag';variant.textContent=x.variant.replaceAll('-',' ');card.append(img,name,variant);grid.append(card)}}q.addEventListener('input',render);fetch('./catalog.json').then(r=>{if(!r.ok)throw Error('Catálogo indisponível');return r.json()}).then(data=>{items=data.stickers||[];render()}).catch(e=>status.textContent=e.message);</script></body></html>
