<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula Experimental | Bike Pop</title><style>body{margin:0;background:#f5f2fa;color:#231b30;font:16px system-ui}main{max-width:520px;margin:auto;padding:25px 18px}section{background:white;padding:22px;border-radius:22px;box-shadow:0 8px 25px #32134a12}h1{margin:0 0 8px}p{line-height:1.5;color:#63596c}.step{font-size:13px;color:#7842a3;font-weight:700}button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:16px;background:#7225a9;color:white;text-align:center;text-decoration:none;font-weight:700;font-size:16px;cursor:pointer;margin:12px 0}.secondary{background:#eee7f3!important;color:#57217c!important}small{color:#71687a}</style><main><section><div class="step" id="step">ETAPA 1 DE 3</div><h1>Aula experimental Bike Pop</h1><p id="desc">Faça seu cadastro ou login na EVO para começar.</p><a id="action" class="btn" href="#" target="_blank" rel="noopener">Abrir cadastro / login</a><button class="secondary" id="next">Já concluí esta etapa</button><small>As etapas são confirmadas por você. O Club Pop não consegue verificar automaticamente o login ou pagamento dentro da EVO sem integração específica.</small></section></main><script>
const params=new URLSearchParams(location.search),session=(crypto.randomUUID?.()||String(Date.now())),steps=[{title:"Faça seu cadastro ou login na EVO para começar.",button:"Abrir cadastro / login",key:"cadastro",url:params.get("cadastro")},{title:"Agora compre sua aula experimental na EVO.",button:"Ir para pagamento",key:"pagamento",url:params.get("pagamento")},{title:"Escolha o horário e agende sua aula.",button:"Agendar aula",key:"agendamento",url:params.get("agendamento")}];let i=0;
function log(event,extra={}){const payload={event,link:"aula-experimental",session,at:new Date().toISOString(),path:location.pathname,...extra};const endpoint="/api/links-uteis/event";fetch(endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});}
function draw(){document.getElementById("step").textContent="ETAPA "+(i+1)+" DE 3";document.getElementById("desc").textContent=steps[i].title;const a=document.getElementById("action");a.textContent=steps[i].button;a.href=steps[i].url||"#";document.getElementById("next").textContent=i===2?"Concluí o agendamento":"Já concluí esta etapa";}
document.getElementById("action").onclick=e=>{log("button_click",{step:steps[i].key});if(!steps[i].url){e.preventDefault();alert("Link da EVO ainda não configurado. Entre em contato com o Studio Bike Pop.");}};
document.getElementById("next").onclick=()=>{log("self_reported_step",{step:steps[i].key});if(i<2){i++;draw();log("step_view",{step:steps[i].key});}else{document.getElementById("desc").textContent="Obrigado! Sua confirmação foi registrada como declaração, não como compra ou reserva validada pela EVO.";document.getElementById("next").disabled=true;}};
draw();log("page_view");</script></html>
