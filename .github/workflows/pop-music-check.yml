name: Validate Pop Music Experience
on:
  push:
    branches: [main]
    paths: [lib/pop-music.mjs, tests/pop-music.test.mjs, club-pop-worker.mjs, lib/unit-access.mjs, .github/workflows/pop-music-check.yml]
  pull_request:
    paths: [lib/pop-music.mjs, tests/pop-music.test.mjs, club-pop-worker.mjs, lib/unit-access.mjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/pop-music.test.mjs
