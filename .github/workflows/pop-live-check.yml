name: Validate Pop Live operation
on:
  push:
    branches: [main, work/pop-live-definitivo]
    paths: [lib/pop-live-operation.mjs, tests/pop-live-operation.test.mjs, migrations/20261104_pop_live_operation.sql, .github/workflows/pop-live-check.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/pop-live-operation.test.mjs
