<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP Admin — Transações Fitcoins</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;color:#111;background:#f4f6f8}main{max-width:1400px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.ey{font-size:11px;color:#777;font-weight:900;letter-spacing:1.2px}h1{margin:4px 0 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.block{background:#fff;border:1px solid #e2e6ea;border-radius:18px}.stat{padding:18px}.stat small{font-size:10px;color:#777;font-weight:900}.stat strong{display:block;font-size:25px;margin-top:7px}.filters{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:9px;padding:16px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #dce1e5;border-radius:10px;background:#fafafa}.block{overflow:hidden}.table{overflow:auto}.row{min-width:780px;display:grid;grid-template-columns:145px 1.4fr 100px 115px 120px 1.4fr;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid #edf0f2;font-size:11px}.row.head{background:#f7f9fa;font-size:9px;font-weight:900;color:#707780;border-top:0}.who b,.desc b{display:block;font-size:11px}.who small,.desc small{display:block;color:#777;margin-top:3px}.amount{font-size:13px;font-weight:950}.credit{color:#158a45}.debit{color:#cc4444}.badge{display:inline-block;border-radius:99px;padding:5px 8px;background:#eef2f4;font-size:9px;font-weight:900}.empty{text-align:center;padding:35px;color:#777}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.demo{background:#eef8fc;border:1px solid #cdebf7;border-radius:14px;padding:12px;margin-bottom:14px;font-size:11px;color:#405965}@media(max-width:760px){main{padding:20px 12px}.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="top"><div><div class="ey">FINANCEIRO • CLUB POP</div><h1>Transações Fitcoins</h1></div><button class="primary" onclick="location.href='/admin.html'">VOLTAR AO ADM</button></div><section class="stats"><div class="stat"><small>TRANSAÇÕES</small><strong id="sTotal">0</strong></div><div class="stat"><small>CRÉDITOS</small><strong id="sCredit">0 FC</strong></div><div class="stat"><small>DÉBITOS</small><strong id="sDebit">0 FC</strong></div><div class="stat"><small>SALDO MOVIMENTADO</small><strong id="sNet">0 FC</strong></div></section><div class="demo">Extrato central do Club Pop: Loja, Missões, Promoções, Estornos e lançamentos administrativos aparecem juntos, com a origem de cada movimentação.</div><section class="block"><div class="filters"><input id="search" placeholder="Buscar aluno, descrição ou ID EVO"><select id="direction"><option value="">Créditos e débitos</option><option value="credit">Somente créditos</option><option value="debit">Somente débitos</option></select><select id="origin"><option value="">Todas as origens</option><option value="store">Loja</option><option value="mission">Missões</option><option value="promotion">Promoções</option><option value="refund">Estornos</option><option value="admin">ADM</option></select><select id="status"><option value="">Todos os status</option><option value="CONFIRMED">Confirmadas</option><option value="FAILED">Falhas</option></select></div><div class="table"><div class="row head"><span>DATA</span><span>ALUNO</span><span>VALOR</span><span>ORIGEM</span><span>SALDO</span><span>DESCRIÇÃO</span></div><div id="rows"></div></div></section></main><script>let all=[];const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),label={store:"LOJA",mission:"MISSÃO",promotion:"PROMOÇÃO",refund:"ESTORNO",admin:"ADM"};function render(){const q=document.querySelector("#search").value.toLowerCase(),di=document.querySelector("#direction").value,or=document.querySelector("#origin").value,st=document.querySelector("#status").value;const rr=all.filter(x=>(!di||x.direction===di)&&(!or||x.origin===or)&&(!st||x.status===st)&&(!q||[x.memberName,x.memberId,x.title,x.reason].join(" ").toLowerCase().includes(q)));document.querySelector("#rows").innerHTML=rr.length?rr.map(x=>'<div class="row"><span>'+new Date(x.createdAt).toLocaleString("pt-BR")+'</span><span class="who"><b>'+esc(x.memberName||"Aluno Club Pop")+'</b><small>EVO '+esc(x.memberId)+'</small></span><span class="amount '+x.direction+'">'+(x.direction==="credit"?"+":"−")+x.amount+' FC</span><span><i class="badge">'+esc(label[x.origin]||x.origin)+'</i></span><span>'+x.balanceBefore+' → <b>'+x.balanceAfter+'</b></span><span class="desc"><b>'+esc(x.title)+'</b><small>'+esc(x.reason)+'</small></span></div>').join(""):'<div class="empty">Nenhuma transação encontrada.</div>';const cr=all.filter(x=>x.direction==="credit").reduce((a,x)=>a+Number(x.amount||0),0),db=all.filter(x=>x.direction==="debit").reduce((a,x)=>a+Number(x.amount||0),0);document.querySelector("#sTotal").textContent=all.length;document.querySelector("#sCredit").textContent=cr+" FC";document.querySelector("#sDebit").textContent=db+" FC";document.querySelector("#sNet").textContent=(cr-db)+" FC"}document.querySelectorAll(".filters input,.filters select").forEach(x=>x.oninput=render);(async()=>{try{const r=await fetch("/api/content",{cache:"no-store"}),d=await r.json();all=(d.fitcoinMovements||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));render()}catch(e){document.querySelector("#rows").innerHTML='<div class="empty">Não foi possível carregar as transações.</div>'}})();</script></body></html>
