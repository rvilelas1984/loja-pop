<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop — Landing Page</title><link rel="stylesheet" href="/admin-common.css"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Inter,system-ui;color:#111}main{max-width:1050px;margin:auto;padding:30px 20px 80px}h1{font-size:32px;margin:0}.lead{color:#6d7580}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:25px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer;background:#111;color:#fff}.green{background:#18b879}.block{background:#fff;border:1px solid #e2e6ea;border-radius:18px;margin:11px 0;overflow:hidden}.head{display:flex;align-items:center;gap:12px;padding:17px}.drag{font-size:20px;color:#999}.info{flex:1}.info b{display:block}.info small{color:#777}.pill{font-size:9px;font-weight:900;background:#e9fff5;color:#087b50;padding:6px 9px;border-radius:99px}.body{padding:0 18px 18px;display:none}.block.open .body{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:10px}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dce1e5;border-radius:10px}.actions{display:flex;gap:6px}.mini{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px;cursor:pointer}.preview{background:#07101b;color:#fff;border-radius:18px;padding:18px;margin-bottom:20px}.preview a{color:#21e49c}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="bar"><div><h1>Landing Page</h1><p class="lead">Construa a apresentação pública do Club Pop por blocos.</p></div><div><a class="btn" href="/landing.html" target="_blank">PRÉ-VISUALIZAR ↗</a> <button class="btn green" id="save">SALVAR ALTERAÇÕES</button></div></div><div class="preview"><b>clubpopfit.com.br</b><p>Os blocos ativos abaixo constroem a página pública. Você pode editar textos, ativar/desativar e mudar a ordem.</p></div><div id="list"></div></main><script src="/admin-common.js"></script><script>
const defaults=[['hero','Hero principal'],['features','Missões • Promoções • Fitcoins • Benefícios'],['how','Como funciona'],['missions','Missões'],['promotion','Promoção destaque'],['fitcoins','Fitcoins'],['benefits','Benefícios'],['partners','Academias parceiras'],['cta','Chamada final'],['footer','Rodapé']];let data={seoTitle:'Club Pop Fit — Sua rotina vale mais',blocks:defaults.map((x,i)=>({id:x[0],type:x[0],name:x[1],active:true,order:i,title:'',text:'',imageUrl:''}))};const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){list.innerHTML=data.blocks.sort((a,b)=>a.order-b.order).map((b,i)=>'<section class="block" data-id="'+E(b.id)+'"><div class="head"><span class="drag">☷</span><div class="info"><b>'+E(b.name||b.type)+'</b><small>'+E(b.type)+'</small></div><span class="pill">'+(b.active!==false?'ATIVO':'OCULTO')+'</span><div class="actions"><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini toggle">'+(b.active!==false?'Ocultar':'Ativar')+'</button><button class="mini edit">Editar</button></div></div><div class="body"><div class="grid"><div class="field"><label>TÍTULO / CHAMADA</label><input class="title" value="'+E(b.title)+'" placeholder="Chamada de interesse"></div><div class="field"><label>LINK DA IMAGEM</label><input class="image" value="'+E(b.imageUrl)+'" placeholder="Google Drive ou URL pública"></div><div class="field" style="grid-column:1/-1"><label>TEXTO</label><textarea class="text" rows="3">'+E(b.text)+'</textarea></div></div></div></section>').join('');bind()}
function bind(){document.querySelectorAll('.block').forEach(el=>{const id=el.dataset.id,b=data.blocks.find(x=>x.id===id);el.querySelector('.edit').onclick=()=>el.classList.toggle('open');el.querySelector('.toggle').onclick=()=>{b.active=!b.active;draw()};el.querySelector('.up').onclick=()=>move(id,-1);el.querySelector('.down').onclick=()=>move(id,1);['title','text','image'].forEach(k=>el.querySelector('.'+k).oninput=e=>b[k==='image'?'imageUrl':k]=e.target.value)})}function move(id,d){const a=data.blocks.sort((a,b)=>a.order-b.order),i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i].order,a[j].order]=[a[j].order,a[i].order];draw()}
fetch('/api/content').then(r=>r.json()).then(d=>{if(d.landingPage)data=d.landingPage;draw()}).catch(draw);save.onclick=async()=>{cpBusy(save,true,'SALVANDO...');try{const r=await fetch('/api/content',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({section:'landingPage',value:data})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Falha');cpNotify('success','Landing Page','Configuração salva.')}catch(e){cpNotify('error','Landing Page',e.message)}finally{cpBusy(save,false)}};</script></body></html>
