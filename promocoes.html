<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Promoções</title><style>:root{--b:#111318;--blue:#08a9e3;--m:#747b86;--line:#e5e9ed}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui,sans-serif;color:var(--b)}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 35px}.back{font-size:11px;font-weight:900}.hero{margin-top:18px;border-radius:24px;background:#111;color:#fff;aspect-ratio:16/7;display:grid;place-items:center;text-align:center;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;display:none}.hero b{font-size:22px}.hero small{display:block;color:#aaa;margin-top:5px}.title{margin:22px 0 8px}.title h1{font-size:27px;margin:0}.title p{font-size:11px;color:var(--m)}.card{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:11px}.row{display:flex;justify-content:space-between;align-items:center}.tag{font-size:8px;font-weight:900;color:#159765}.bar{height:9px;background:#edf0f2;border-radius:99px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.btn{width:100%;border:0;border-radius:13px;background:#111;color:#fff;padding:13px;font-weight:900;margin-top:12px}.rules{font-size:10px;color:#69717b;line-height:1.6}.empty{margin-top:22px;border:1px solid var(--line);border-radius:22px;padding:40px 22px;text-align:center}.empty .ico{width:50px;height:50px;border-radius:50%;background:#f1f4f6;display:grid;place-items:center;margin:0 auto 14px;font-size:21px}.empty h2{margin:0 0 7px;font-size:18px}.empty p{margin:0;color:var(--m);font-size:11px;line-height:1.5}</style></head><body><div class="app"><div class="back" onclick="location.href='/'">← VOLTAR AO INÍCIO</div><div id="promoList"></div><div class="empty" id="emptyPromo" style="display:none"><div class="ico">★</div><h2>Em breve teremos novas promoções...</h2><p>Continue acompanhando o Club Pop.</p></div></div><script>let u=JSON.parse(sessionStorage.getItem("clubpop")||"null");if(!u)location.href="/";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),fmt=s=>s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"",img=u=>{const m=String(u||"").match(/drive\\.google\\.com\\/file\\/d\\/([^/]+)/)||String(u||"").match(/[?&]id=([^&]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1400":u};fetch("/api/content",{cache:"no-store"}).then(r=>r.json()).then(c=>{const today=new Date().toISOString().slice(0,10),ps=(c.promotions||[]).filter(x=>x.status==="Ativo"&&(!x.start||x.start<=today)&&(!x.end||x.end>=today));if(!ps.length){emptyPromo.style.display="block";return}promoList.innerHTML=ps.map(p=>'<section class="card">'+(p.bannerUrl?'<div class="hero"><img src="'+esc(img(p.bannerUrl))+'" style="display:block" alt=""></div>':'')+'<div class="title"><h1>'+esc(p.name)+'</h1><p>'+fmt(p.start)+' a '+fmt(p.end)+'</p></div><div class="row"><b>'+esc(p.unit==="gym"?"Gym Pop":p.unit==="club"?"Club Pop":"Bike Pop")+'</b><span class="tag">ATIVA</span></div><p class="rules">'+esc(p.dashboardText||"")+'</p><section class="card"><b>Como funciona</b><p class="rules">'+esc(p.rules||"")+'</p></section>'+(p.promotionType==="lucky_number"&&p.luckyNumber&&p.luckyNumber.enabled?'<button class="btn" onclick="location.href=\'/meus-numeros.html?promotion='+encodeURIComponent(p.id)+'\'">VER MEUS NÚMEROS →</button>':'')+'</section>').join("")}).catch(()=>{emptyPromo.style.display="block"})</script></body></html>
