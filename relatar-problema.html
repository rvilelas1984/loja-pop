<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop — Relatar problema</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#15191e;margin:0}.app{max-width:460px;min-height:100vh;margin:auto;padding:25px 18px 90px;background:white;box-sizing:border-box}a{color:#6c3bba;text-decoration:none;font-weight:800}.card{border:1px solid #e5e9ef;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 8px 22px #1015200a}h1{font-size:25px;margin:22px 0 8px}p{color:#687280;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:850;margin:18px 0 8px}select,textarea,button{width:100%;font:inherit;box-sizing:border-box;border-radius:12px;padding:14px}select,textarea{border:1px solid #dce1e8;background:white}textarea{min-height:150px;resize:vertical}button{border:0;background:#111318;color:white;font-weight:850;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}#notice{min-height:22px;color:#a32b35;margin-top:12px;font-size:13px}small{color:#7b8490}</style></head><body><main class="app"><a href="/perfil.html">← Voltar ao perfil</a><h1>Relatar um problema</h1><p>Encontrou alguma dificuldade no Club Pop? Conte o que aconteceu. Nossa equipe poderá localizar seu cadastro e acompanhar a correção.</p><form class="card" id="form"><label for="area">Onde ocorreu o problema?</label><select id="area" required><option value="">Selecione a área</option><option value="dashboard">Dashboard</option><option value="missoes">Missões e desafios</option><option value="presencas">Minhas presenças</option><option value="brasoes">Meus brasões</option><option value="estrelas">Estrelas e conquistas</option><option value="vouchers">Vouchers e resgates</option><option value="beneficios">Benefícios e parceiros</option><option value="loja">Loja</option><option value="perfil">Perfil e acesso</option><option value="outros">Outro problema</option></select><label for="description">Descreva o problema</label><textarea id="description" required minlength="10" maxlength="3000" placeholder="O que você tentou fazer? O que aconteceu?"></textarea><small>Seu nome e vínculo com a unidade serão associados automaticamente à sua conta.</small><button id="send">Enviar relato</button><div id="notice" role="status"></div></form><section class="card"><h2 style="font-size:17px">Meus relatos</h2><div id="history">Carregando...</div></section></main><script>
const token=sessionStorage.getItem('clubpop_token'),unit=localStorage.getItem('clubpop_active_unit')==='gym'?'gym':'bike',notice=document.getElementById('notice');if(!token){location.replace('/')}
async function call(method,body){const r=await fetch('/auth/student-issues?unit='+unit,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível enviar o relato');return d}
async function load(){const host=document.getElementById('history');try{const d=await call('GET');host.replaceChildren();if(!d.items?.length){host.textContent='Você ainda não enviou relatos.';return}for(const x of d.items){const p=document.createElement('p');p.textContent='#'+x.id+' · '+x.area+' · '+x.status+' · '+x.created_at;host.append(p)}}catch(e){host.textContent='Não foi possível consultar os relatos: '+e.message}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;notice.textContent='Enviando...';try{const d=await call('POST',{area:document.getElementById('area').value,description:document.getElementById('description').value});notice.style.color='#16754b';notice.textContent='Relato #'+d.id+' recebido. Obrigado!';document.getElementById('description').value='';await load()}catch(err){notice.style.color='#a32b35';notice.textContent=err.message}finally{b.disabled=false}});load();
</script></body></html>
