<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLUB POP Admin — Benefícios</title><meta name="theme-color" content="#111318"><link rel="manifest" href="/admin-manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>
:root{--ink:#0d0d0f;--bg:#f5f5f7;--line:#e6e6ea;--muted:#777980;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}aside{background:#0d0d0f;color:#fff;padding:27px 18px;position:sticky;top:0;height:100vh}.logo{font-size:23px;font-weight:950;letter-spacing:-1px;padding:0 10px}.logo small{display:block;color:#888;font-size:10px;letter-spacing:2px;margin-top:4px}nav{display:grid;gap:6px;margin-top:30px}nav a{color:#aaa;text-decoration:none;padding:13px 14px;border-radius:12px;font-weight:750;font-size:13px}nav a.on{background:#fff;color:#111}
main{padding:32px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:25px}.ey{font-size:11px;color:#888;font-weight:850;letter-spacing:1.5px}.top h1{font-size:30px;margin:5px 0 0;letter-spacing:-1px}.primary{border:0;background:#111;color:#fff;border-radius:11px;padding:12px 16px;font-weight:850;font-size:12px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px}.stat{padding:18px}.stat span{font-size:11px;color:var(--muted);font-weight:700}.stat b{display:block;font-size:26px;margin-top:7px}
.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:17px}.panel{padding:20px;margin-bottom:17px}.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.panel.collapsed .panel-body{display:none}.panel.collapsed .ph{margin-bottom:0}
.ph-actions{display:flex;align-items:center;gap:7px}.collapse{width:31px;height:31px;border:1px solid #ddd;background:#fff;border-radius:9px;font-weight:900;cursor:pointer;font-size:16px;line-height:1}
.panel.collapsed .collapse{transform:rotate(180deg)}.ph h2{font-size:16px;margin:0}.ghost{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:850}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:13px}.search{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fafafa;font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{border:1px solid #ddd;background:#fff;border-radius:20px;padding:7px 10px;font-size:10px;font-weight:800}.chip.on{background:#111;color:#fff;border-color:#111}
.benefit{cursor:pointer;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.benefit:last-child{border:0}.benefit:hover{background:#fafafa}.log{margin-top:14px;border-top:1px solid #eee;padding-top:12px}.log h3{font-size:11px;margin:0 0 9px}.logitem{display:grid;grid-template-columns:86px 1fr;gap:8px;font-size:10px;padding:7px 0;border-bottom:1px solid #f0f0f0}.logitem time{color:#888}.logitem b{font-size:10px}.pic{width:48px;height:48px;border-radius:12px;background:#eee;display:grid;place-items:center;font-weight:900;font-size:11px}.benefit b{font-size:12px}.benefit p{font-size:10px;color:#777;margin:4px 0}.badge{font-size:9px;padding:5px 8px;border-radius:20px;background:#efeff1;font-weight:850}.actions{display:flex;gap:5px;margin-top:6px}.actions button{border:0;background:none;padding:0;font-size:9px;font-weight:850;color:#555}
.form{display:grid;gap:12px}.field label{display:block;font-size:10px;font-weight:850;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:10px;background:#fafafa;padding:11px;font:inherit;font-size:11px}.field textarea{height:72px;resize:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.upload{border:1px dashed #bbb;border-radius:12px;padding:17px;text-align:center;font-size:10px;color:#777}.toggle{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding-top:12px;font-size:11px;font-weight:750}.switch{width:38px;height:22px;border-radius:20px;background:#111;position:relative}.switch:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;right:3px;top:3px}.preview{background:#f5f5f7;border-radius:15px;padding:14px}.preview small{font-size:9px;color:#888;font-weight:850}.student-card{background:#fff;border:1px solid #e3e3e6;border-radius:15px;padding:14px;margin-top:9px}.student-card .hero{height:90px;border-radius:11px;background:#111;color:#fff;display:flex;align-items:end;padding:12px;font-weight:900}.student-card h3{font-size:13px;margin:12px 0 4px}.student-card p{font-size:10px;color:#777;margin:0 0 8px}.student-card strong{font-size:11px}.save{width:100%;border:0;background:#111;color:#fff;border-radius:11px;padding:12px;font-size:11px;font-weight:900;margin-top:3px}
.mobile-top,.mobile-menu{display:none}
@media(max-width:850px){.app{display:block}aside{display:none}.mobile-top{display:flex;position:sticky;top:0;z-index:20;height:68px;background:#fff;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;padding:0 16px}.mobile-brand{font-size:18px;font-weight:950;letter-spacing:-.7px}.mobile-brand small{display:block;font-size:9px;color:#777;font-weight:650;margin-top:2px}.hamb{width:42px;height:42px;border:0;background:#111;border-radius:12px;display:grid;place-content:center;gap:4px}.hamb span{width:18px;height:2px;background:#fff}.mobile-menu{position:fixed;z-index:19;top:68px;right:0;width:min(290px,82vw);height:calc(100vh - 68px);background:#111;padding:16px}.mobile-menu.open{display:grid;align-content:start;gap:6px}.mobile-menu a{color:#bbb;padding:14px;border-radius:11px;font-size:13px;font-weight:800}.mobile-menu a.on{background:#fff;color:#111}main{padding:20px 14px}.top{align-items:center}.top h1{font-size:25px}.primary{padding:10px 12px}.cards{grid-template-columns:1fr 1fr;gap:9px}.grid{grid-template-columns:1fr}.benefit{grid-template-columns:48px 1fr}.benefit>.badge{grid-column:2}.two{grid-template-columns:1fr}}
.admin-mobile-nav-fix{display:none}@media(max-width:850px){.admin-mobile-nav-fix{display:flex;position:sticky;top:0;z-index:100;height:68px;background:#fff;border-bottom:1px solid #e4e5e8;align-items:center;justify-content:space-between;padding:0 16px}.admin-mobile-nav-fix b{font-size:18px}.admin-mobile-nav-fix small{display:block;font-size:9px;color:#777}.admin-mobile-nav-fix button{width:42px;height:42px;border:0;background:#111;color:#fff;border-radius:12px;font-size:22px}.admin-mobile-drawer{display:none;position:fixed;z-index:99;top:68px;right:0;width:min(290px,82vw);height:calc(100vh - 68px);background:#111;padding:16px}.admin-mobile-drawer.open{display:grid;align-content:start;gap:6px}.admin-mobile-drawer a{color:#bbb;text-decoration:none;padding:14px;border-radius:11px;font-size:13px;font-weight:800}.admin-mobile-drawer a.on{background:#fff;color:#111}}
</style><link rel="stylesheet" href="/admin-common.css"><style>.cp-admin-ready .grid{grid-template-columns:1fr!important}.cp-admin-ready #editorPanel{margin-top:14px}</style></head><script>(async()=>{try{const r=await fetch("/api/admin-auth?route=me",{cache:"no-store"});if(!r.ok)location.replace("/admin-login.html")}catch{location.replace("/admin-login.html")}})();</script><body><div class="app"><main><header class="top"><div><div class="ey">CONTEÚDO DO ALUNO</div><h1>Benefícios</h1></div><button class="primary" id="newBenefit">+ Novo benefício</button></header>
<section class="cards"><div class="stat"><span>Benefícios ativos</span><b>0</b></div><div class="stat"><span>Parceiros</span><b>0</b></div><div class="stat"><span>Em destaque</span><b>0</b></div><div class="stat"><span>Inativos</span><b>0</b></div></section>
<div class="grid"><div><section class="panel collapsible"><div class="ph"><h2>Benefícios publicados</h2><div class="ph-actions"><button class="collapse" title="Encolher/expandir">⌃</button></div></div><div class="panel-body"><div id="benefitList"></div></div></section></div><div><section class="panel collapsible" id="editorPanel"><div class="ph"><h2 id="editorTitle">Editar benefício</h2><div class="ph-actions"><span class="badge" id="editorBadge">CADASTRADO</span><button class="collapse" title="Encolher/expandir">⌃</button></div></div>
<div class="panel-body"><div class="form"><div class="field"><label>NOME DO PARCEIRO</label><input></div>
<div class="field"><label>TÍTULO DO BENEFÍCIO</label><input></div>
<div class="field"><label>DESCRIÇÃO CURTA</label><textarea></textarea></div>
<div class="two"><div class="field"><label>CATEGORIA</label><select><option>Bike</option><option>Bem-estar</option><option>Alimentação</option><option>Serviços</option></select></div><div class="field"><label>TIPO</label><select><option>Desconto</option><option>Voucher</option><option>Cortesia</option><option>Condição especial</option></select></div></div>
<div class="field"><label>VALOR / CHAMADA</label><input></div>
<div class="two"><div class="field"><label>INÍCIO DA CAMPANHA</label><input type="date" ></div><div class="field"><label>FIM DA CAMPANHA</label><input type="date" ></div></div>
<div class="field"><label>COMO UTILIZAR</label><textarea></textarea></div>
<div class="field"><label>LINK / CONTATO DO PARCEIRO</label><input placeholder="WhatsApp, Instagram ou site"></div>
<div class="field"><label>IMAGEM / LOGO</label><input placeholder="Link público da imagem"></div><button class="save" id="saveBenefit">Salvar alterações</button></div></div></section></div></div></main></div>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/admin-sw.js").catch(()=>{});</script><script src="/admin-common.js"></script><script src="/admin-beneficios-v2.js"></script></body></html>
