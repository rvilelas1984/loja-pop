<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Pop — Tutoriais</title><style>:root{--ink:#171b21;--muted:#717d8b;--line:#e3e9ef;--bg:#f4f6f8;--accent:#1599cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;padding:22px 18px 95px;background:linear-gradient(#fff,#f6f8fb)}h1{font-size:26px;margin:20px 0 8px}p{color:var(--muted);line-height:1.5}a{color:var(--accent);text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 8px 22px #15243509}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#edf8fc;font-size:23px}.muted{color:var(--muted);font-size:12px}.cta{background:#10141a;color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}input,select{width:100%;padding:13px;border:1px solid #dce2e9;border-radius:12px;font:inherit;margin-top:10px}button{font:inherit;cursor:pointer}.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.chip{white-space:nowrap;border:1px solid #dfe6ed;background:#fff;padding:9px 13px;border-radius:20px}.chip.active{background:#14191f;color:#fff}.video{width:100%;text-align:left;background:#fff;border:1px solid #e5e9ef;border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px;margin:9px 0}.video strong{display:block;margin-bottom:5px}.video small{color:var(--muted)}dialog{border:0;padding:0;margin:auto;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;background:#080a0d;color:#fff;overflow:hidden}dialog::backdrop{background:#000}body:has(dialog[open]){overflow:hidden}.story{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 14px);gap:10px}.story-head{display:flex;align-items:center;gap:12px}.story-head strong{flex:1;font-size:15px}.story-head button,.story-foot button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:30px;padding:9px 12px}.story-frame{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.story-frame iframe{width:100%;height:100%;max-height:calc(100dvh - 150px);border:0;border-radius:14px;background:#000}.story-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}.story-foot a{color:#fff;font-size:12px}.story-foot button:disabled{opacity:.3}#notice{color:#9c3434}</style></head><body><main class="app"><a href="/perfil.html">← Voltar ao perfil</a><h1>Central de Tutoriais</h1><p>Aprenda a aproveitar cada recurso do Club Pop no seu ritmo.</p><section class="card"><div class="row"><div class="icon">🎓</div><div class="grow"><strong>Tour interativo do aplicativo</strong><div class="muted">Reveja o passo a passo dentro do Club Pop</div></div></div><button class="cta" style="width:100%;margin-top:16px" id="replay">Rever tutorial</button></section><section class="card"><strong>Vídeos explicativos</strong><input id="search" placeholder="Pesquisar: missões, dashboard, vouchers..."><div class="filters" id="filters"></div><div id="videos">Carregando tutoriais...</div><div id="notice" role="status"></div></section></main><dialog id="player"><div class="story"><div class="story-head"><span>▶</span><strong id="videoTitle"></strong><button id="close" aria-label="Fechar vídeo">✕</button></div><div class="story-frame"><iframe id="frame" title="Vídeo do tutorial" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div><div class="story-foot"><button id="previous" aria-label="Vídeo anterior">‹ Anterior</button><a id="driveLink" target="_blank" rel="noopener noreferrer">Abrir no Drive ↗</a><button id="next" aria-label="Próximo vídeo">Próximo ›</button></div></div></dialog><script src="/student-onboarding-tour.js" defer></script><script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('clubpop_token'),unit=localStorage.getItem('clubpop_active_unit')==='gym'?'gym':'bike';let items=[],filter='Todos';if(!token)location.replace('/');
$('replay').onclick=()=>{if(typeof window.clubPopStartTutorial==='function')window.clubPopStartTutorial();else location.href='/?tutorial=1'};
function safeId(s){return /^[A-Za-z0-9_-]{10,}$/.test(s||'')}
function render(){const term=$('search').value.toLocaleLowerCase('pt-BR');const cats=['Todos',...new Set(items.map(x=>x.category))];$('filters').replaceChildren();for(const c of cats){const b=document.createElement('button');b.className='chip'+(c===filter?' active':'');b.textContent=c;b.onclick=()=>{filter=c;render()};$('filters').append(b)}const host=$('videos');host.replaceChildren();const shown=items.filter(x=>(filter==='Todos'||x.category===filter)&&(x.title+' '+x.description+' '+x.category).toLocaleLowerCase('pt-BR').includes(term));if(!shown.length){host.textContent='Nenhum vídeo disponível nesta categoria.';return}for(const v of shown){const b=document.createElement('button');b.className='video';const icon=document.createElement('div');icon.className='icon';icon.textContent='▶️';const body=document.createElement('div');body.className='grow';const title=document.createElement('strong');title.textContent=v.title;const meta=document.createElement('small');meta.textContent=v.category+' · '+(v.description||'Assista ao tutorial');body.append(title,meta);b.append(icon,body);b.onclick=()=>openVideo(v);host.append(b)}}
let activeVideo=-1;function openVideo(v){const i=items.findIndex(x=>x.id===v.id);if(i<0||!safeId(v.drive_file_id))return;activeVideo=i;$('videoTitle').textContent=v.title;$('frame').src='https://drive.google.com/file/d/'+encodeURIComponent(v.drive_file_id)+'/preview';$('driveLink').href='https://drive.google.com/file/d/'+encodeURIComponent(v.drive_file_id)+'/view';$('previous').disabled=i===0;$('next').disabled=i===items.length-1;if(!$('player').open)$('player').showModal()}
function closeVideo(){$('player').close()}$('close').onclick=closeVideo;$('previous').onclick=()=>{if(activeVideo>0)openVideo(items[activeVideo-1])};$('next').onclick=()=>{if(activeVideo<items.length-1)openVideo(items[activeVideo+1])};$('player').addEventListener('close',()=>{$('frame').src='about:blank';activeVideo=-1});$('search').oninput=render;
(async()=>{try{const r=await fetch('/api/auth?route=tutorials&unit='+unit,{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro ao carregar');items=d.items||[];render()}catch(e){$('videos').textContent='Não foi possível carregar os vídeos.';$('notice').textContent=e.message}})();
</script></body></html>
