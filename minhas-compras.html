<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas compras — Club Pop</title><link rel="stylesheet" href="/student-unit-theme.css"><style>.cp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.cp-stat{background:#fff;border-radius:17px;padding:15px 5px;text-align:center}.cp-stat b{display:block;font-size:24px}.cp-stat small{font-size:11px;color:#63717a}.cp-tools{background:white;padding:14px;border-radius:18px;margin:12px 0}.cp-search{width:100%;border:1px solid #d6e1e6;border-radius:12px;padding:13px;font-size:14px}.cp-filters{display:flex;gap:6px;overflow-x:auto;margin-top:10px}.cp-filter{border:1px solid #dce4e8;background:white;border-radius:30px;padding:9px 13px;font-weight:700;white-space:nowrap}.cp-filter.selected{background:#14212c;color:white}.cp-voucher{background:white;border-radius:18px;margin:10px 0;overflow:hidden}.cp-summary{border:0;background:none;width:100%;padding:17px;text-align:left;cursor:pointer}.cp-title{font-weight:850;font-size:16px;margin:8px 0}.cp-meta{color:#596876;font-size:12px;line-height:1.7}.cp-detail{padding:15px 17px;border-top:1px solid #e9edf0}.cp-countdown{font-size:12px;color:#a26100;font-weight:800}.cp-more{width:100%;border:1px solid #15212d;background:#fff;border-radius:13px;padding:14px;font-weight:800;margin:12px 0}</style><style>body{margin:0;background:var(--cp-unit-bg,#a9eaf5);font-family:system-ui,sans-serif;color:#19232d}main{padding:0 18px 115px}main>header{margin:0 -18px 20px;width:calc(100% + 36px)}h1{font-size:27px;margin:12px 0 4px}.cp-sub{color:#546773;margin:0 0 20px}.navwrap{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(96%,460px);z-index:10;background:#fff;border-radius:26px;padding:12px 5px;box-shadow:0 6px 28px #0002}.nav.modern{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.nav button{border:0;background:transparent;color:#7c8793;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:11px;font-weight:700;padding:8px 0}.nav button.active{color:#089dcc;background:#e8f8fc;border-radius:16px}.nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style><style id="cp-layout-fix">html,body{width:100%;max-width:100%;overflow-x:hidden}body{min-height:100dvh}main{box-sizing:border-box;width:100%;max-width:100%;margin:0 auto;padding:0 18px 130px!important}main>header#club-pop-student-header{box-sizing:border-box!important;width:calc(100% + 36px)!important;max-width:none!important;margin:0 -18px 20px!important;border-radius:0!important;padding-left:18px!important;padding-right:18px!important;transform:none!important}.navwrap{position:fixed!important;bottom:0!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(100%,460px)!important;padding:0 10px 10px!important;z-index:100!important;background:linear-gradient(transparent,#f4f6f8 35%)!important;border-radius:0!important;box-shadow:none!important}.nav.modern{box-sizing:border-box!important;width:100%!important;height:84px!important;min-height:84px!important;max-height:84px!important;display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center!important;background:#fff!important;border:1px solid #e5e9ee!important;border-radius:24px!important;padding:6px!important;box-shadow:0 10px 30px #1112!important}.nav.modern button{box-sizing:border-box!important;min-width:0!important;height:70px!important;padding:0 2px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important;font-size:11px!important;line-height:13px!important;border-radius:18px!important}.nav.modern svg{width:25px!important;height:25px!important;min-width:25px!important;min-height:25px!important}.nav.modern span{font-size:11px!important;white-space:nowrap!important}.nav.modern .active{color:#078fcb!important;background:#eaf8fe!important}.cp-tools,.cp-voucher,.cp-stats{max-width:100%;min-width:0}.cp-search{box-sizing:border-box;max-width:100%;min-width:0}.cp-filters{max-width:100%;scrollbar-width:none}.cp-filters::-webkit-scrollbar{display:none}.cp-summary{box-sizing:border-box;max-width:100%}</style><style id="cp-purchase-compact">.cp-voucher .cp-detail{font-size:13px!important;line-height:1.5!important;padding:12px 15px!important}.cp-voucher .cp-title{font-size:15px!important}.cp-voucher .cp-summary{padding:14px!important}.cp-voucher .cp-meta{font-size:12px!important}</style></head><body><main><header id="club-pop-student-header" class="cp-header-card cp-header-placeholder" aria-label="Cabeçalho Club Pop"></header><h1>🛍️ Minhas compras</h1><p class="cp-sub">Acompanhe pagamentos, vouchers e retiradas.</p><div class="cp-stats"><div class="cp-stat"><b id="cpTotal">—</b><small>Pedidos</small></div><div class="cp-stat"><b id="cpActive">—</b><small>Pagos</small></div><div class="cp-stat"><b id="cpExpired">—</b><small>Pendentes</small></div></div><div class="cp-tools"><input id="cpSearch" class="cp-search" placeholder="Buscar pedido ou item"><div class="cp-filters"><button class="cp-filter selected" data-filter="all">Todos</button><button class="cp-filter" data-filter="approved">Pagos</button><button class="cp-filter" data-filter="pending">Pendentes</button><button class="cp-filter" data-filter="completed">Entregues</button></div></div><section id="list">Carregando compras...</section><button id="cpMore" class="cp-more" hidden>Ver mais compras ↓</button></main><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v11H5V10"/></svg><span>Início</span></button><button onclick="location.href='/missoes.html'"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/></svg><span>Missões</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox="0 0 24 24"><path d="M4 9h16v12H4zM2 5h20v4H2zM12 5v16"/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg><span>Loja</span></button><button class="active" onclick="location.href='/perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span></button></nav></div><script src="/student-unit-theme.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let orders=[],shown=5,filter="all",catalog={};const $=id=>document.getElementById(id);function unit(){return localStorage.getItem("clubpop_active_unit")==="gym"?"gym":"bike"}function date(v){if(!v)return"—";const s=String(v);const d=new Date(/^\d{4}-/.test(s)&&!s.endsWith("Z")?s.replace(" ","T")+"Z":s);return isNaN(d)?s:new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",dateStyle:"short",timeStyle:"short"}).format(d)}function isCheckoutChoice(o){return o.status==='selected'&&o.external_state==='none'&&!o.provider_order_id}\nfunction status(o){if(o.delivery_state==="cancelled"||o.status==="cancelled")return "cancelled";if(o.external_state==="refunded")return "refunded";if(o.status==="coins_review")return "coins_review";return o.delivery_state==="completed"?"completed":o.status==="approved"?"approved":o.status==="paid_pending_coins"?"coins_review":o.status==="created"||o.status==="creating"||o.status==="pending"||o.status==="selected"?"pending":o.status}function render(){const q=$("cpSearch").value.toLowerCase();const visible=orders.filter(o=>!isCheckoutChoice(o));const list=visible.filter(o=>("all"||status(o)===filter||(filter==="pending"&&status(o)==="coins_review"))&&[o.id,o.item_id,o.item_type].some(v=>String(v||"").toLowerCase().includes(q)));$("cpTotal").textContent=visible.length;$("cpActive").textContent=visible.filter(o=>status(o)==="approved"||status(o)==="completed").length;$("cpExpired").textContent=visible.filter(o=>["pending","coins_review"].includes(status(o))).length;$("list").innerHTML=list.slice(0,shown).map(o=>{const st=status(o),paid=st==="approved"||st==="completed";return '<article class="cp-voucher"><details><summary class="cp-summary"><span class="tag" style="font-weight:900;padding:5px 10px;border-radius:8px;background:'+(paid?"#e0f5e9":st==="coins_review"?"#fff1d0":"#ffe5e6")+';color:'+(paid?"#087341":st==="coins_review"?"#8b5c08":"#b51d32")+';">'+esc(st==="completed"?"ENTREGUE":paid?"PAGO":st==="coins_review"?"EM CONFERÊNCIA":st==="expired"?"EXPIRADO":st==="cancelled"||st==="superseded"?"VENDA CANCELADA":st==="refunded"?"ESTORNADO":st==="pending"?"PENDENTE":"EM ANÁLISE")+'</span><div class="cp-title">'+esc(o.item_name||catalog[o.item_type+":"+o.item_id]||((o.item_type==="service"?"Serviço ":"Produto ")+o.item_id))+'</div><div class="cp-meta">'+(Number(o.currency_quantity)>0?esc(o.currency_quantity)+' Fitcoins · ':'')+'R$ '+(Number(o.amount_cents||0)/100).toFixed(2).replace(".",",")+' · '+esc(date(o.created_at))+'</div><div class="cp-countdown" style="color:'+(paid?"#087341":st==="coins_review"?"#8b5c08":"#b51d32")+';font-weight:800">'+(st==="completed"?"Entrega concluída":paid?(o.item_type==="product"?"Disponível para retirada na recepção":"Pagamento confirmado — aguarde emissão do voucher"):st==="coins_review"?(Number(o.amount_cents)>0?"Pix recebido • conferindo Fitcoins. Não pague novamente.":"Conferindo o pagamento com Fitcoins. Não pague novamente."):st==="pending"&&o.external_state==="refunded"?"Pagamento estornado. Aguardando regularização na recepção.":st==="expired"?"Prazo encerrado. Nenhuma moeda foi debitada neste pedido.":st==="cancelled"||st==="superseded"?"Pedido cancelado":st==="refunded"?"Moedas estornadas": "Aguardando pagamento")+'</div></summary><div class="cp-detail"><p><b>Pedido:</b> '+esc(o.id)+'</p><p><b>Unidade:</b> '+esc(o.unit==="gym"?"Gym Pop":"Bike Pop")+'</p><p><b>Data:</b> '+esc(date(o.created_at))+'</p><p><b>Valor:</b> R$ '+(Number(o.amount_cents||0)/100).toFixed(2).replace(".",",")+'</p>'+(o.item_type==="service"&&paid?'<p>Seu voucher, quando emitido, estará em <a href="/meus-vouchers.html">Meus Vouchers</a>.</p>':'')+'</div></details></article>'}).join("")||'<div class="cp-voucher" style="padding:20px">Nenhuma compra encontrada.</div>';$("cpMore").hidden=shown>=list.length}
async function load(){const token=sessionStorage.getItem("clubpop_token");if(!token){location.replace("/");return}try{const r=await fetch("/checkout/pix/orders?unit="+unit(),{headers:{Authorization:"Bearer "+token},cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Falha ao carregar compras");orders=d.orders||[];try{const cr=await fetch("/api/content",{cache:"no-store"});if(cr.ok){const content=await cr.json();for(const [type,items] of [["product",content.products||[]],["service",content.services||[]]])for(const item of items)catalog[type+":"+item.id]=item.name||item.title||""}}catch{}render()}catch(e){$("list").textContent="Não foi possível carregar as compras: "+e.message}}$("cpSearch").oninput=()=>{shown=5;render()};document.querySelectorAll(".cp-filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;shown=5;document.querySelectorAll(".cp-filter").forEach(x=>x.classList.toggle("selected",x===b));render()});$("cpMore").onclick=()=>{shown+=5;render()};load();
</script></body></html>
