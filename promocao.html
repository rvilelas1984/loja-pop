<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Promoção</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui;color:#111}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 115px}.back{font-size:11px;font-weight:900;cursor:pointer}.banner{width:100%;aspect-ratio:16/9;object-fit:contain;background:#111;border-radius:22px;margin-top:18px}.tag{font-size:10px;color:#08a9e3;font-weight:950;margin-top:18px}.title{font-size:28px;margin:7px 0}.muted{font-size:11px;color:#737b84}.status{margin-top:15px;padding:14px;border-radius:15px;background:#eef9fd;color:#087ca8;font-size:11px;font-weight:900}.card{border:1px solid #e5e9ed;border-radius:20px;padding:16px;margin-top:13px}.card h2{font-size:15px;margin:0 0 8px}.rules{white-space:pre-line;font-size:11px;color:#68717b;line-height:1.6}.progress{height:9px;background:#edf0f2;border-radius:20px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#08a9e3,#35d09a)}.btn{width:100%;border:0;border-radius:14px;background:#111;color:#fff;padding:14px;font-weight:900;margin-top:13px}.milestone{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:11px}.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:0 10px 10px;z-index:50}.navbottom{height:84px;background:#fff;border:1px solid #e1e6ea;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 30px #1112;padding:6px}.navbottom button{border:0;background:none;color:#8c949d;font-size:10px;font-weight:800;border-radius:18px}.navbottom .on{background:#e8f8fd;color:#079dce}.fitreward{background:#f0fbf5;border:1px solid #bdebd0}.fitreward b{color:#118650}.fitreward.debit{background:#fff5f5;border-color:#f0c4c4}.fitreward.debit b{color:#b63b3b}.btn:disabled{opacity:.55}</style></head><body><main class="app"><div class="back" onclick="history.length>1?history.back():location.href='/'">← VOLTAR</div><div id="view"></div></main><script>const id=new URLSearchParams(location.search).get("id"),u=JSON.parse(sessionStorage.getItem("clubpop")||"{}"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),img=u=>{const m=String(u||"").match(/\/d\/([^/]+)/)||String(u||"").match(/[?&]id=([^&]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1400":u},fmt=s=>s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"";if(!sessionStorage.getItem("clubpop_token"))location.replace("/");async function claimFitcoins(pid,btn){if(!confirm("Confirmar esta recompensa em Fitcoins?"))return;btn.disabled=true;btn.textContent="PROCESSANDO...";try{const token=sessionStorage.getItem("clubpop_token"),r=await fetch("/api/promo-numbers?route=fitcoins",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({promotionId:pid})}),d=await r.json();if(!r.ok)throw Error(d.error||"Falha na recompensa");btn.textContent=d.duplicate?"RECOMPENSA JÁ PROCESSADA ✓":"FITCOINS PROCESSADOS ✓";alert((d.direction==="debit"?"Débito":"Crédito")+" confirmado. Novo saldo: "+d.balance+" Fitcoins")}catch(e){alert("Não foi possível processar Fitcoins: "+e.message);btn.disabled=false;btn.textContent="RESGATAR FITCOINS →"}} fetch("/api/content",{cache:"no-store"}).then(r=>r.json()).then(c=>{const p=(c.promotions||[]).find(x=>String(x.id)===String(id));if(!p){view.innerHTML="<h1>Promoção não encontrada</h1>";return}const today=new Date().toISOString().slice(0,10),contracts=(u.memberships||[]).filter(x=>!x.cancelDate&&(!x.endDate||String(x.endDate).slice(0,10)>=today)),accepted=(p.eligibility?.acceptedContracts||[]).map(String),eligible=(p.eligibility?.mode||"any")==="any"||contracts.some(x=>accepted.includes(String(x.idMembership))),n=Number(u.attendanceCount||0),participating=eligible&&n>0,status=participating?"✓ VOCÊ ESTÁ PARTICIPANDO!":eligible?"VOCÊ ESTÁ APTO A PARTICIPAR!":"VOCÊ AINDA NÃO ESTÁ ELEGÍVEL",ln=p.promotionType==="lucky_number"&&p.luckyNumber?.enabled,miles=p.luckyNumber?.milestones||p.milestones||[];view.innerHTML=(p.bannerUrl?'<img class="banner" src="'+esc(img(p.bannerUrl))+'" alt="">':"")+'<div class="tag">PROMOÇÃO ATIVA · '+esc(p.unit==="gym"?"GYM POP":p.unit==="club"?"CLUB POP":"BIKE POP")+'</div><h1 class="title">'+esc(p.name)+'</h1><div class="muted">'+fmt(p.start)+' a '+fmt(p.end)+'</div><div class="status">'+status+'</div>'+(p.dashboardText?'<section class="card"><h2>Sobre a promoção</h2><div class="rules">'+esc(p.dashboardText)+'</div></section>':"")+'<section class="card"><h2>Regras</h2><div class="rules">'+esc(p.rules||"Consulte as regras desta promoção no Studio.")+'</div></section>'+(p.fitcoinAction?.enabled?'<section class="card fitreward '+(p.fitcoinAction.direction==="debit"?"debit":"")+'"><h2>Ação Fitcoins</h2><b>'+(p.fitcoinAction.direction==="debit"?"−":"+")+esc(p.fitcoinAction.amount)+' Fitcoins</b><div class="muted" style="margin-top:6px">Ao atingir '+esc(p.fitcoinAction.attendance)+' check-ins.</div>'+(n>=Number(p.fitcoinAction.attendance||0)?'<button class="btn" onclick="claimFitcoins(\''+esc(p.id)+'\',this)">RESGATAR FITCOINS →</button>':'<div class="status">Faltam '+Math.max(0,Number(p.fitcoinAction.attendance||0)-n)+' check-in(s).</div>')+'</section>':"")+(ln?'<section class="card"><h2>Seu progresso</h2><b>'+n+' check-in(s) válido(s)</b><div class="progress"><i style="width:'+Math.min(100,n/Math.max(1,Number(miles.at(-1)?.attendance||miles.at(-1)?.value||12))*100)+'%"></i></div>'+miles.map(x=>'<div class="milestone"><span>'+esc(x.attendance||x.value)+' check-ins</span><b>+'+esc(x.bonus||x.extraNumbers||0)+' números</b></div>').join("")+'<button class="btn" onclick="location.href=\'/meus-numeros.html?promotion='+encodeURIComponent(p.id)+'\'">MEUS NÚMEROS DA SORTE →</button></section>':"")}).catch(()=>view.innerHTML="<h1>Não foi possível carregar a promoção.</h1>")</script><div class="navwrap"><nav class="navbottom"><button onclick="location.href='/'">⌂<br>Início</button><button class="on" onclick="location.href='/missoes.html'">☆<br>Desafios</button><button onclick="location.href='/beneficios.html'">♙<br>Benefícios</button><button onclick="location.href='/loja.html'">♧<br>Loja</button><button onclick="location.href='/perfil.html'">♙<br>Perfil</button></nav></div></body></html>
