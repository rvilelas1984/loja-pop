<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Promoção</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui;color:#111}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 40px}.back{font-size:11px;font-weight:900;cursor:pointer}.banner{width:100%;aspect-ratio:16/9;object-fit:contain;background:#111;border-radius:22px;margin-top:18px}.tag{font-size:10px;color:#08a9e3;font-weight:950;margin-top:18px}.title{font-size:28px;margin:7px 0}.muted{font-size:11px;color:#737b84}.status{margin-top:15px;padding:14px;border-radius:15px;background:#eef9fd;color:#087ca8;font-size:11px;font-weight:900}.card{border:1px solid #e5e9ed;border-radius:20px;padding:16px;margin-top:13px}.card h2{font-size:15px;margin:0 0 8px}.rules{white-space:pre-line;font-size:11px;color:#68717b;line-height:1.6}.progress{height:9px;background:#edf0f2;border-radius:20px;overflow:hidden;margin:11px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#08a9e3,#35d09a)}.btn{width:100%;border:0;border-radius:14px;background:#111;color:#fff;padding:14px;font-weight:900;margin-top:13px}.milestone{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:11px}</style></head><body><main class="app"><div class="back" onclick="history.length>1?history.back():location.href='/'">← VOLTAR</div><div id="view"></div></main><script>const id=new URLSearchParams(location.search).get("id"),u=JSON.parse(sessionStorage.getItem("clubpop")||"{}"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),img=u=>{const m=String(u||"").match(/\/d\/([^/]+)/)||String(u||"").match(/[?&]id=([^&]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1400":u},fmt=s=>s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR"):"";if(!sessionStorage.getItem("clubpop_token"))location.replace("/");fetch("/api/content",{cache:"no-store"}).then(r=>r.json()).then(c=>{const p=(c.promotions||[]).find(x=>String(x.id)===String(id));if(!p){view.innerHTML="<h1>Promoção não encontrada</h1>";return}const today=new Date().toISOString().slice(0,10),contracts=(u.memberships||[]).filter(x=>!x.cancelDate&&(!x.endDate||String(x.endDate).slice(0,10)>=today)),accepted=(p.eligibility?.acceptedContracts||[]).map(String),eligible=(p.eligibility?.mode||"any")==="any"||contracts.some(x=>accepted.includes(String(x.idMembership))),n=Number(u.attendanceCount||0),participating=eligible&&n>0,status=participating?"✓ VOCÊ ESTÁ PARTICIPANDO!":eligible?"VOCÊ ESTÁ APTO A PARTICIPAR!":"VOCÊ AINDA NÃO ESTÁ ELEGÍVEL",ln=p.promotionType==="lucky_number"&&p.luckyNumber?.enabled,miles=p.luckyNumber?.milestones||p.milestones||[];view.innerHTML=(p.bannerUrl?'<img class="banner" src="'+esc(img(p.bannerUrl))+'" alt="">':"")+'<div class="tag">PROMOÇÃO ATIVA · '+esc(p.unit==="gym"?"GYM POP":p.unit==="club"?"CLUB POP":"BIKE POP")+'</div><h1 class="title">'+esc(p.name)+'</h1><div class="muted">'+fmt(p.start)+' a '+fmt(p.end)+'</div><div class="status">'+status+'</div>'+(p.dashboardText?'<section class="card"><h2>Sobre a promoção</h2><div class="rules">'+esc(p.dashboardText)+'</div></section>':"")+'<section class="card"><h2>Regras</h2><div class="rules">'+esc(p.rules||"Consulte as regras desta promoção no Studio.")+'</div></section>'+(ln?'<section class="card"><h2>Seu progresso</h2><b>'+n+' check-in(s) válido(s)</b><div class="progress"><i style="width:'+Math.min(100,n/Math.max(1,Number(miles.at(-1)?.attendance||miles.at(-1)?.value||12))*100)+'%"></i></div>'+miles.map(x=>'<div class="milestone"><span>'+esc(x.attendance||x.value)+' check-ins</span><b>+'+esc(x.bonus||x.extraNumbers||0)+' números</b></div>').join("")+'<button class="btn" onclick="location.href=\'/meus-numeros.html?promotion='+encodeURIComponent(p.id)+'\'">MEUS NÚMEROS DA SORTE →</button></section>':"")}).catch(()=>view.innerHTML="<h1>Não foi possível carregar a promoção.</h1>")</script></body></html>
