<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja Pop | Fitcoins</title><style>
:root{--bg:#071017;--card:#0e1a24;--text:#f5f8fa;--muted:#8fa3b2;--cyan:#13d8e8;--blue:#158cff;--line:rgba(255,255,255,.08);--green:#39d98a;--red:#ff6673}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,rgba(21,140,255,.16),transparent 32%),var(--bg);color:var(--text);display:flex;justify-content:center}.app{width:min(100%,520px);padding:24px 18px 40px}.brand{text-align:center;padding:22px 0 28px}.mark{width:62px;height:62px;margin:auto;border-radius:18px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font-weight:900;font-size:24px;color:#041017}.brand h1{font-size:24px;margin:13px 0 3px}.brand p{margin:0;color:var(--muted);font-size:14px}.card{background:linear-gradient(180deg,#11212c,var(--card));border:1px solid var(--line);border-radius:24px;padding:22px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--cyan)}h2{font-size:23px;margin:8px 0 7px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px}label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;height:54px;border-radius:14px;border:1px solid var(--line);background:#08131b;color:white;padding:0 16px;font-size:16px}button{width:100%;height:54px;border:0;border-radius:14px;margin-top:12px;background:linear-gradient(90deg,var(--cyan),var(--blue));color:#041017;font-weight:900}.hint{color:#718795;font-size:11px;margin-top:7px}.result{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;background:#071119;padding:12px;border-radius:12px;color:#a9bdc9;max-height:300px;overflow:auto}.foot{text-align:center;color:#617684;font-size:11px;margin-top:18px}</style></head>
<body><main class="app"><header class="brand"><div class="mark">LP</div><h1>LOJA POP</h1><p>Clube de Recompensas</p></header><section class="card"><div class="eyebrow">EVO • FITCOINS</div><h2>Consulte suas recompensas</h2><div class="sub">Teste real de comunicação com a EVO. Nenhum Fitcoin será alterado.</div><label>CPF ou ID EVO</label><input id="member" inputmode="numeric" placeholder="CPF: 000.000.000-00 ou ID EVO"><div class="hint">Na primeira validação, use o ID EVO.</div><button id="go">CONSULTAR EVO</button><div class="result" id="result"><strong id="status"></strong><pre id="payload"></pre></div></section><div class="foot">LOJA POP × EVO • SOMENTE LEITURA • v0.1</div></main>
<script>const go=document.querySelector("#go"),result=document.querySelector("#result"),statusEl=document.querySelector("#status"),payload=document.querySelector("#payload");go.onclick=async()=>{const m=document.querySelector("#member").value.trim();if(!m)return;go.disabled=true;go.textContent="CONSULTANDO...";result.style.display="block";statusEl.className="";statusEl.textContent="Conectando...";try{const r=await fetch("/api/evo?member="+encodeURIComponent(m));const d=await r.json();statusEl.className=d.ok?"ok":"err";statusEl.textContent=d.ok?"● EVO respondeu com sucesso":"● Consulta não concluída";payload.textContent=JSON.stringify(d,null,2)}catch(e){statusEl.className="err";statusEl.textContent="● Falha no backend";payload.textContent=e.message}finally{go.disabled=false;go.textContent="CONSULTAR EVO"}};</script></body></html>
