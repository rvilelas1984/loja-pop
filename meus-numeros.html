<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Meus números</title><style>
*{box-sizing:border-box}:root{--blue:#08a9e3;--ink:#0d1117;--muted:#6f7781;--line:#e5e9ed}body{margin:0;background:#e9edf1;font-family:Inter,system-ui;color:var(--ink)}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:18px 18px 118px}.top{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.brand{color:#079dcc}.hero{margin-top:18px;background:linear-gradient(145deg,#0a1016,#151d25);color:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 35px #07121c22}.hero small{color:#70dcff;font-weight:900}.hero h1{font-size:25px;margin:7px 0 16px}.stats,.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#ffffff0c;border:1px solid #ffffff12;border-radius:16px;padding:13px}.stat b,.box b{font-size:27px;display:block}.stat span,.box span{font-size:9px;color:#aeb9c3;font-weight:800}.audit{margin-top:12px;background:#eaf9ff;border:1px solid #c9effd;border-radius:15px;padding:12px;font-size:10px;line-height:1.5;color:#17647f}.month{margin-top:16px;border:1px solid var(--line);border-radius:23px;padding:17px}.month.current{border:1.5px solid #9ce6fb;box-shadow:0 8px 24px #08a9e312}.monthhead{display:flex;justify-content:space-between}.month h2{font-size:17px;margin:0}.tag{font-size:8px;font-weight:1000;padding:6px 8px;border-radius:999px;background:#eef1f3;color:#69717b}.tag.on{background:#dff8ff;color:#087fa8}.summary{margin:14px 0}.box{background:#f5f7f9;border-radius:14px;padding:12px}.box span{color:var(--muted)}.breakdown{background:#fafbfc;border-radius:14px;padding:12px;font-size:10px;line-height:1.8}.line{display:flex;justify-content:space-between}.bonus{color:#078fcb;font-weight:900}.total{border-top:1px dashed #d7dde2;margin-top:5px;padding-top:6px;font-weight:1000}.codesTitle{font-size:10px;font-weight:1000;margin:15px 0 8px}.codes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.code{font-family:monospace;text-align:center;border:1px solid #dce4e8;border-radius:11px;padding:10px 5px;font-size:10px;font-weight:900}.sync{margin-top:16px;width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(90deg,#079bd2,#13b9e6);color:#fff;font-weight:1000}.sync:disabled{opacity:.7}.sync.loading:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid #fff8;border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#fff0f0;color:#9c3333;border-color:#ffd6d6}.empty{text-align:center;color:#777;font-size:11px;padding:18px}.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:0 10px 10px;background:linear-gradient(transparent,#f4f6f8 35%)}.nav{height:84px;background:#fff;border:1px solid #e5e9ee;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 30px #1112;padding:6px}.nav button{border:0;background:none;color:#8b929b;font-size:9px;font-weight:800;border-radius:18px}.nav .on{background:#eaf8fe;color:#078fcb}.ico{font-size:21px;display:block;margin-bottom:4px}</style></head><body><div class="app"><div class="top"><div onclick="location.href='/promocoes.html'">← VOLTAR À PROMOÇÃO</div><div class="brand">CLUB POP</div></div><section class="hero"><small id="promoName">PROMOÇÃO</small><h1>Meus números da sorte</h1><div class="stats"><div class="stat"><b id="total">—</b><span>NÚMEROS ATIVOS</span></div><div class="stat"><b id="presenceTotal">—</b><span>PRESENÇAS NA PROMOÇÃO</span></div></div></section><div id="status" class="audit">Validando suas presenças e números...</div><div id="months"></div><button id="sync" class="sync">↻ ATUALIZAR MEUS NÚMEROS</button></div><div class="navwrap"><nav class="nav"><button onclick="location.href='/'"><span class="ico">⌂</span>Início</button><button class="on" onclick="location.href='/missoes.html'"><span class="ico">☆</span>Desafios</button><button onclick="location.href='/beneficios.html'"><span class="ico">♢</span>Benefícios</button><button onclick="location.href='/loja.html'"><span class="ico">▱</span>Loja</button><button onclick="location.href='/perfil.html'"><span class="ico">○</span>Perfil</button></nav></div><script>
const token=sessionStorage.getItem("clubpop_token"),promotion=new URLSearchParams(location.search).get("promotion"),auth={Authorization:"Bearer "+token};if(!token)location.href="/";if(!promotion)location.href="/promocoes.html";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const monthLabel=k=>{const [y,m]=k.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase())};async function load(syncFirst=false){status.className="audit";status.textContent=syncFirst?"Sincronizando presenças válidas...":"Carregando números...";sync.disabled=true;sync.classList.toggle("loading",syncFirst);sync.textContent=syncFirst?"ATUALIZANDO...":"CARREGANDO...";let watchdog=setTimeout(()=>{status.className="audit error";status.textContent="A sincronização está demorando mais que o esperado. Verificando integração EVO...";sync.disabled=false;sync.classList.remove("loading");sync.textContent="↻ ATUALIZAR MEUS NÚMEROS"},15000);try{let syncData=null;if(syncFirst){const r=await fetch("/api/promo-numbers?route=sync",{method:"POST",headers:{...auth,"Content-Type":"application/json"},body:JSON.stringify({promotionId:promotion})});syncData=await r.json();if(!r.ok){if(r.status===403&&syncData.error==="ALUNO_NAO_ELEGIVEL"){total.textContent="0";presenceTotal.textContent="0";months.innerHTML='<div class="empty"><b>Você não está elegível para esta promoção no momento.</b><br>Seu contrato ativo não está entre os contratos participantes.</div>';status.className="audit";status.innerHTML="ℹ <b>Promoção indisponível para seu contrato atual.</b>";return}throw Error(syncData.error||"Falha ao sincronizar")}}const [nr,cr]=await Promise.all([fetch("/api/promo-numbers?route=mine&promotion="+encodeURIComponent(promotion),{headers:auth,cache:"no-store"}),fetch("/api/content",{cache:"no-store"})]),d=await nr.json(),content=await cr.json();if(!nr.ok)throw Error(d.error||"Falha ao consultar");const promo=(content.promotions||[]).find(p=>String(p.id)===String(promotion))||{},cfg=promo.luckyNumber||{},per=Math.max(0,Number(cfg.numbersPerAttendance||promo.numbersPerAttendance||1)),milestones=(cfg.milestones||[]).slice().sort((a,b)=>Number(a.attendance)-Number(b.attendance));promoName.textContent=d.promotion?.name||promo.name||"PROMOÇÃO";total.textContent=d.total||0;presenceTotal.textContent=syncData?.attendance??d.attendance??"—";const grouped={};for(const x of(d.codes||[])){const k=x.reference_month||String(x.issued_at||"").slice(0,7)||"Outros";(grouped[k]??=[]).push(x)}const keys=Object.keys(grouped).sort();const now=new Date().toISOString().slice(0,7);months.innerHTML=keys.map(k=>{const arr=grouped[k],isNow=k===now,label=k==="Outros"?"Outros":monthLabel(k);return '<section class="month '+(isNow?"current":"")+'"><div class="monthhead"><div><h2>'+esc(label)+'</h2></div><span class="tag '+(isNow?"on":"")+'">'+(isNow?"EM ANDAMENTO":"ENCERRADO")+'</span></div><div class="summary"><div class="box"><b>'+arr.length+'</b><span>NÚMEROS GERADOS</span></div><div class="box"><b>'+per+'</b><span>NÚMERO(S) POR PRESENÇA</span></div></div><div class="codesTitle">SEUS CÓDIGOS DE '+esc(label.toUpperCase())+'</div><div class="codes">'+arr.map(x=>'<div class="code">'+esc(x.code)+'</div>').join("")+'</div></section>'}).join("")||'<div class="empty">Nenhum número emitido ainda.</div>';status.innerHTML="✓ <b>Demonstrativo da promoção</b><br>Organizado por competência e pelas regras configuradas no ADM."}catch(e){status.className="audit error";status.textContent="Não foi possível atualizar: "+e.message}finally{clearTimeout(watchdog);sync.disabled=false;sync.classList.remove("loading");sync.textContent="↻ ATUALIZAR MEUS NÚMEROS"}}sync.onclick=()=>load(true);load(true);
</script></body></html>
