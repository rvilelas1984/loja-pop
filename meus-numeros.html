<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Meus números</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui;color:#111}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 115px}.back{font-size:11px;font-weight:900;cursor:pointer}.hero{margin-top:18px;background:#111;color:#fff;border-radius:24px;padding:22px}.hero small{color:#68d5ff;font-weight:900}.hero h1{font-size:26px;margin:7px 0}.hero b{font-size:35px}.card{margin-top:13px;border:1px solid #e5e9ed;border-radius:20px;padding:16px}.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.code{font-family:monospace;text-align:center;border:1px solid #dce4e8;border-radius:11px;padding:11px;font-weight:900}.info{font-size:10px;color:#727a84;line-height:1.55}.pending{padding:14px;background:#eef8fc;border-radius:13px;font-size:10px;color:#17647f}.error{background:#fff0f0;color:#9c3333}.empty{text-align:center;color:#777;font-size:11px;padding:18px}.sync{width:100%;border:0;border-radius:12px;padding:12px;background:#08a9e3;color:#fff;font-weight:900;cursor:pointer;margin-top:12px}.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:0 10px 10px;z-index:50}.navbottom{height:84px;background:#fff;border:1px solid #e1e6ea;border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 30px #1112;padding:6px}.navbottom button{border:0;background:none;color:#8c949d;font-size:10px;font-weight:800;border-radius:18px}.navbottom .on{background:#e8f8fd;color:#079dce}</style></head><body><div class="app"><div class="back" onclick="location.href='/promocoes.html'">← VOLTAR À PROMOÇÃO</div><section class="hero"><small id="promoName">PROMOÇÃO</small><h1>Meus números da sorte</h1><b id="total">—</b><div>códigos ativos</div></section><section class="card"><div id="status" class="pending">Validando suas presenças e números...</div><button id="sync" class="sync">ATUALIZAR MEUS NÚMEROS</button><div class="codes" id="codes"></div></section><section class="card"><b>🔐 Códigos únicos</b><p class="info">Cada código fica ligado à promoção e à presença ou bônus que o originou. O sistema verifica duplicidade antes da emissão e o banco também bloqueia códigos repetidos.</p></section></div><script>const token=sessionStorage.getItem('clubpop_token'),promotion=new URLSearchParams(location.search).get('promotion');if(!token)location.href='/';if(!promotion)location.href='/promocoes.html';const auth={Authorization:'Bearer '+token};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(syncFirst=false){status.className='pending';status.textContent=syncFirst?'Sincronizando presenças válidas...':'Carregando números...';sync.disabled=true;try{if(syncFirst){const r=await fetch('/api/promo-numbers?route=sync',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({promotionId:promotion})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao sincronizar')}const r=await fetch('/api/promo-numbers?route=mine&promotion='+encodeURIComponent(promotion),{headers:auth,cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao consultar');promoName.textContent=d.promotion?.name||'PROMOÇÃO';total.textContent=d.total||0;codes.innerHTML=(d.codes||[]).map(x=>'<div class="code">'+esc(x.code)+'</div>').join('')||'<div class="empty" style="grid-column:1/-1">Nenhum número emitido ainda.</div>';status.textContent=(d.total||0)+' número(s) ativo(s).';}catch(e){status.className='pending error';status.textContent='Não foi possível atualizar: '+e.message;}finally{sync.disabled=false}}sync.onclick=()=>load(true);load(true);</script><div class="navwrap"><nav class="navbottom"><button onclick="location.href='/'">⌂<br>Início</button><button class="on" onclick="location.href='/missoes.html'">☆<br>Desafios</button><button onclick="location.href='/beneficios.html'">♙<br>Benefícios</button><button onclick="location.href='/loja.html'">♧<br>Loja</button><button onclick="location.href='/perfil.html'">♙<br>Perfil</button></nav></div></body></html>
