on><button class="on" onclick="location.href='/missoes.html'"><span class="ico">☆</span>Desafios</button><button onclick="location.href='/beneficios.html'"><span class="ico">♢</span>Benefícios</button><button onclick="location.href='/loja.html'"><span class="ico">▱</span>Loja</button><button onclick="location.href='/perfil.html'"><span class="ico">○</span>Perfil</button></nav></div><script>const token=sessionStorage.getItem("clubpop_token"),promotion=new URLSearchParams(location.search).get("promotion"),auth={Authorization:"Bearer "+token};if(!token)location.href="/";const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),ml=k=>{const[y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase())};function infer(d){const g={};for(const c of(d.codes||[])){const z=String(c.code||"").match(/^[BG]-(\d{4})(\d{2})-/),m=c.reference_month||(z?z[1]+"-"+z[2]:String(c.issued_at||"").slice(0,7));(g[m]??=[]).push(c)}return Object.entries(g).sort().map(([month,codes])=>({month,status:month===new Date().toISOString().slice(0,7)?"current":"closed",attendance:null,entitled:codes.length,codes}))}async function load(doSync=false){status.className="audit";status.textContent=doSync?"Sincronizando presenças válidas...":"Carregando seus números...";sync.disabled=true;if(doSync)sync.classList.add("loading");try{const r=doSync?await fetch("/api/promo-numbers?route=sync",{method:"POST",headers:{...auth,"Content-Type":"application/json"},body:JSON.stringify({promotionId:promotion})}):await fetch("/api/promo-numbers?route=mine&promotion="+encodeURIComponent(promotion),{headers:auth,cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Falha ao sincronizar");const c=await(await fetch("/api/content",{cache:"no-store"})).json(),p=(c.promotions||[]).find(x=>String(x.id)===promotion)||{},per=+(p.luckyNumber?.numbersPerAttendance||1),rows=d.months?.length?d.months:infe
