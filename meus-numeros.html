<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLUB POP — Meus números</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:Inter,system-ui;color:#111}.app{max-width:460px;margin:auto;min-height:100vh;background:#fff;padding:20px 18px 115px}.back{font-size:11px;font-weight:900;cursor:pointer}.hero{margin-top:18px;background:#111;color:#fff;border-radius:24px;padding:22px}.hero small{color:#68d5ff;font-weight:900}.hero h1{font-size:26px;margin:7px 0}.hero b{font-size:35px}.card{margin-top:13px;border:1px solid #e5e9ed;border-radius:20px;padding:16px}.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.code{font-family:monospace;text-align:center;border:1px solid #dce4e8;border-radius:11px;padding:11px;font-weight:900}.info{font-size:10px;color:#727a84;line-height:1.55}.pending{padding:14px;background:#eef8fc;border-radius:13px;font-size:10px;color:#17647f}.error{background:#fff0f0;color:#9c3333}.empty{text-align:center;color:#777;font-size:11px;padding:18px}.sync{width:100%;border:0;border-radius:12px;padding:12px;background:#08a9e3;color:#fff;font-weight:900;cursor:pointer;margin-top:12px}.sync:disabled{opacity:.7;cursor:wait}.sync.loading:before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid #fff8;border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.navwrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);padding:0 10px 10px;z-index:50;background:linear-gradient(transparent,#f4f6f8 35%)}.nav.modern{width:100%;height:84px;background:#fff;border:1px solid #e5e9ee;border-radius:24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;box-shadow:0 10px 30px #1112;padding:6px}.nav.modern button{height:70px;min-width:0;padding:0 2px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#8b929b;font-size:11px;font-weight:800;border-radius:18px;position:relative}.nav.modern svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nav.modern span{font-size:11px;line-height:13px;white-space:nowrap}.nav.modern .active{color:#078fcb;background:#eaf8fe}.nav.modern .active:after{content:"";position:absolute;bottom:3px;width:20px;height:3px;border-radius:9px;background:#08a9e3}</style></head><body><div class="app"><div class="back" onclick="location.href='/promocoes.html'">← VOLTAR À PROMOÇÃO</div><section class="hero"><small id="promoName">PROMOÇÃO</small><h1>Meus números da sorte</h1><b id="total">—</b><div>códigos ativos</div></section><section class="card"><div id="status" class="pending">Validando suas presenças e números...</div><button id="sync" class="sync">ATUALIZAR MEUS NÚMEROS</button><div class="codes" id="codes"></div></section><section class="card"><b>🔐 Códigos únicos</b><p class="info">Cada código fica ligado à promoção e à presença ou bônus que o originou. O sistema verifica duplicidade antes da emissão e o banco também bloqueia códigos repetidos.</p></section></div><script>const token=sessionStorage.getItem('clubpop_token'),promotion=new URLSearchParams(location.search).get('promotion');if(!token)location.href='/';if(!promotion)location.href='/promocoes.html';const auth={Authorization:'Bearer '+token};const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(syncFirst=false){status.className='pending';status.textContent=syncFirst?'Sincronizando presenças válidas...':'Carregando números...';sync.disabled=true;sync.classList.toggle('loading',syncFirst);sync.textContent=syncFirst?'ATUALIZANDO...':'CARREGANDO...';try{if(syncFirst){const r=await fetch('/api/promo-numbers?route=sync',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({promotionId:promotion})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao sincronizar')}const r=await fetch('/api/promo-numbers?route=mine&promotion='+encodeURIComponent(promotion),{headers:auth,cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao consultar');promoName.textContent=d.promotion?.name||'PROMOÇÃO';total.textContent=d.total||0;codes.innerHTML=(d.codes||[]).map(x=>'<div class="code">'+esc(x.code)+'</div>').join('')||'<div class="empty" style="grid-column:1/-1">Nenhum número emitido ainda.</div>';status.textContent=(d.total||0)+' número(s) ativo(s).';}catch(e){status.className='pending error';status.textContent='Não foi possível atualizar: '+e.message;}finally{sync.disabled=false;sync.classList.remove('loading');sync.textContent='ATUALIZAR MEUS NÚMEROS'}}sync.onclick=()=>load(true);load(true);</script><div class="navwrap"><nav class="nav modern"><button onclick="location.href='/'"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg><span>Início</span></button><button class="active" onclick="location.href='/missoes.html'"><svg viewBox="0 0 24 24"><path d="m12 3 2.1 4.3 4.8.7-3.5 3.4.8 4.8L12 14l-4.2 2.2.8-4.8L5.1 8l4.8-.7L12 3Z"/><path d="M7 20h10"/></svg><span>Desafios</span></button><button onclick="location.href='/beneficios.html'"><svg viewBox="0 0 24 24"><path d="M20 12v8H4v-8"/><path d="M2 7h20v5H2z"/><path d="M12 7v13"/><path d="M12 7H7.5A2.5 2.5 0 1 1 10 4.5L12 7Zm0 0h4.5A2.5 2.5 0 1 0 14 4.5L12 7Z"/></svg><span>Benefícios</span></button><button onclick="location.href='/loja.html'"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span>Loja</span></button><button onclick="location.href='/perfil.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span>Perfil</span></button></nav></div></body></html>
